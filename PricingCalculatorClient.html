<script>
  /**
 * ==========================================
 * Pricing Summary
 * ==========================================
 */
window.pricingSummary = {

    ingredientTotal : 0,

    businessCost : 0,

    totalCost : 0,

    sellingPrice : 0,

    profit : 0,

    profitPercentage : 0

};


/**
 * ==========================================
 * Business Costs Cache
 * ==========================================
 */
window.businessCosts = [];


  /**
    * ==========================================
    * Add Ingredient Row
    * ==========================================
    */
   function addIngredientRow() {
      const tbody = document.getElementById("ingredientTableBody");

      // Remove placeholder
      if (tbody.children.length === 1 && tbody.children[0].cells.length === 1) {
         tbody.innerHTML = "";
      }

      const rowCount = tbody.rows.length + 1;
      const row = tbody.insertRow();

      // Fallback: If window.ingredients is empty, try loading them on the fly
      const ingredientOptions = (window.ingredients && window.ingredients.length > 0) 
         ? window.ingredients 
         : [];

      row.innerHTML = `
        <td class="text-center">
            ${rowCount}
        </td>
        <td>
          <select class="form-select ingredientName" onchange="ingredientChanged(this)">
              <option value="">Select Ingredient</option>
              ${ingredientOptions.map(function (item) {
                 return `<option value="${item}">${item}</option>`;
              }).join("")}
          </select>
        </td>
        <td>
          <input type="number" class="form-control text-end ingredientQty" value="" min="0" step="0.001" placeholder="Enter Qty" oninput="recalculatePricing()">
        </td>
        <td>
           <select class="form-select ingredientUnit" onchange="recalculatePricing()">
                <option value="Kg">Kg</option>
                <option value="Gram">Gram</option>
                <option value="Litre">Litre</option>
                <option value="ml">ml</option>
                <option value="Unit">Unit</option>
            </select>
        </td>
        <td class="text-end ingredientRate">
            ₹0.00
        </td>
        <td class="text-end ingredientCost">
            ₹0.00
        </td>
        <td class="text-center">
            <button class="btn btn-sm btn-danger" onclick="removeIngredientRow(this)">
                ✖
            </button>
        </td>
    `;
      
      // If ingredients weren't loaded yet when row was added, trigger a quick reload for this select
      if (ingredientOptions.length === 0) {
          google.script.run.withSuccessHandler(function(res) {
              if(res.success && res.ingredients) {
                  window.ingredients = res.ingredients;
                  const selectEl = row.querySelector('.ingredientName');
                  const currentVal = selectEl.value;
                  selectEl.innerHTML = '<option value="">Select Ingredient</option>' + 
                      res.ingredients.map(item => `<option value="${item}">${item}</option>`).join("");
                  selectEl.value = currentVal;
              }
          }).getIngredients();
      }
   }

   /**
    * ==========================================
    * Remove Ingredient Row
    * ==========================================
    */
   function removeIngredientRow(button) {
      const tbody = document.getElementById("ingredientTableBody");

      button.closest("tr").remove();

      // Re-number rows

      Array.from(tbody.rows).forEach(function (row, index) {
         row.cells[0].innerText = index + 1;
      });

      if (tbody.rows.length === 0) {
         tbody.innerHTML = `

            <tr>

                <td colspan="7"
                    class="text-center text-muted">

                    Click "Add Ingredient" to start.

                </td>

            </tr>

        `;
      }
      recalculatePricing();
   }

   /**
    * ==========================================
    * Convert To Base Unit
    * ==========================================
    */
   function convertToBaseUnit(quantity, unit) {
      quantity = Number(quantity) || 0;

      switch (String(unit).trim().toUpperCase()) {
         // Weight

         case "KG":
            return quantity * 1000;

         case "GRAM":
         case "G":
            return quantity;

         // Volume

         case "LITRE":
         case "LITER":
         case "L":
            return quantity * 1000;

         case "ML":
            return quantity;

         // Count

         case "UNIT":
         case "NOS":
         case "NO":
         case "PCS":
         case "PIECE":
            return quantity;

         default:
            return quantity;
      }
   }

   /**
    * ==========================================
    * Calculate Rate
    * ==========================================
    */
   function calculateRate(amount, quantity, unit) {
      const baseQty = convertToBaseUnit(quantity, unit);

      if (baseQty <= 0) {
         return 0;
      }

      return amount / baseQty;
   }



/**
 * ==========================================
 * Calculate Ingredient Costs
 * ==========================================
 */
function calculateIngredientCosts() {

    const rows =
        document.querySelectorAll("#ingredientTableBody tr");

    rows.forEach(function(row){

        if (row.cells.length < 7) {

            return;

        }

        const qty =
            Number(
                row.querySelector(".ingredientQty").value
            ) || 0;

        const unit =
            row.querySelector(".ingredientUnit").value;

        const purchaseRate =
            Number(row.dataset.purchaseRate) || 0;

  const recipeBaseQuantity =
    convertToBaseUnit(qty, unit);

const ingredientCost =
    recipeBaseQuantity * purchaseRate;

row.dataset.ingredientCost =
    ingredientCost;

    row.querySelector(".ingredientCost").innerText =
    "₹" + ingredientCost.toFixed(2);

    });

}


/**
 * ==========================================
 * Calculate Ingredient Total
 * ==========================================
 */
function calculateIngredientTotal() {

    const rows =
        document.querySelectorAll("#ingredientTableBody tr");

    let ingredientTotal = 0;

    rows.forEach(function(row){

        if (row.cells.length < 7) {

            return;

        }

        ingredientTotal +=
            Number(row.dataset.ingredientCost || 0);

    });

    window.pricingSummary.ingredientTotal =
        ingredientTotal;

}









/**
 * ==========================================
 * Calculate Business Costs
 * ==========================================
 */
function calculateBusinessCosts() {

    let businessCost = 0;

    window.businessCosts.forEach(function(cost){

        if (String(cost.active).trim().toUpperCase() !== "YES") {

            return;

        }

        if (cost.unit === "Per Order") {

            businessCost += Number(cost.amount) || 0;

        }

    });

    window.pricingSummary.businessCost = businessCost;

}




/**
 * ==========================================
 * Calculate Total Cost
 * ==========================================
 */
function calculateTotalCost() {

    const totalCost =

        window.pricingSummary.ingredientTotal +

        window.pricingSummary.businessCost;

    window.pricingSummary.totalCost = totalCost;

}




/**
 * ==========================================
 * Calculate Selling Price
 * ==========================================
 */
function calculateSellingPrice() {
    
    const sellingPriceEl = document.getElementById("sellingPrice");

    // Safety check: Default to 0 if the element doesn't exist
    const sellingPrice = sellingPriceEl ? (Number(sellingPriceEl.value) || 0) : 0;

    window.pricingSummary.sellingPrice = sellingPrice;

}







/**
 * ==========================================
 * Calculate Profit
 * ==========================================
 */
function calculateProfit() {

    if (window.pricingSummary.sellingPrice <= 0) {

        window.pricingSummary.profit = 0;

        return;

    }

    window.pricingSummary.profit =

        window.pricingSummary.sellingPrice -

        window.pricingSummary.totalCost;

}




/**
 * ==========================================
 * Calculate Profit Percentage
 * ==========================================
 */
function calculateProfitPercentage() {

    let profitPercentage = 0;

    if (window.pricingSummary.sellingPrice > 0) {

        profitPercentage =

            (
                window.pricingSummary.profit /

                window.pricingSummary.sellingPrice
            ) * 100;

    }

    window.pricingSummary.profitPercentage =
        profitPercentage;

}





/**
 * ==========================================
 * Calculate Food Cost Percentage
 * ==========================================
 */
function calculateFoodCostPercentage() {

    let foodCostPercentage = 0;

    if (window.pricingSummary.sellingPrice > 0) {

        foodCostPercentage =

            (

                window.pricingSummary.totalCost /

                window.pricingSummary.sellingPrice

            ) * 100;

    }

    window.pricingSummary.foodCostPercentage =
        foodCostPercentage;

}





/**
 * ==========================================
 * Update Food Cost Status
 * ==========================================
 */
function updateFoodCostStatus() {
    const badge = document.getElementById("foodCostStatus");

    // Safety check: Exit if the user left the screen
    if (!badge) {
        return;
    }

    const percentage = window.pricingSummary.foodCostPercentage;

    badge.className = "badge";

    if (percentage === 0) {
        badge.classList.add("bg-secondary");
        badge.innerText = "Not Calculated";
    }
    else if (percentage < 30) {
        badge.classList.add("bg-success");
        badge.innerText = "Excellent";
    }
    else if (percentage <= 40) {
        badge.classList.add("bg-primary");
        badge.innerText = "Good";
    }
    else if (percentage <= 50) {
        badge.classList.add("bg-warning", "text-dark");
        badge.innerText = "High";
    }
    else {
        badge.classList.add("bg-danger");
        badge.innerText = "Review Price";
    }
}







/**
 * ==========================================
 * Update Cost Summary
 * ==========================================
 */
function updateSummary() {
    const ingredientTotalEl = document.getElementById("ingredientTotal");
    const businessCostTotalEl = document.getElementById("businessCostTotal");
    const totalCostEl = document.getElementById("totalCost");
    const profitEl = document.getElementById("profit");
    const profitPercentageEl = document.getElementById("profitPercentage");
    const foodCostPercentageEl = document.getElementById("foodCostPercentage");

    if (ingredientTotalEl) {
        ingredientTotalEl.value = "₹" + window.pricingSummary.ingredientTotal.toFixed(2);
    }
    if (businessCostTotalEl) {
        businessCostTotalEl.value = "₹" + window.pricingSummary.businessCost.toFixed(2);
    }
    if (totalCostEl) {
        totalCostEl.value = "₹" + window.pricingSummary.totalCost.toFixed(2);
    }
    if (profitEl) {
        profitEl.value = "₹" + window.pricingSummary.profit.toFixed(2);
    }
    if (profitPercentageEl) {
        profitPercentageEl.value = window.pricingSummary.profitPercentage.toFixed(2) + "%";
    }
    if (foodCostPercentageEl) {
        foodCostPercentageEl.value = window.pricingSummary.foodCostPercentage.toFixed(2) + "%";
    }

    updateFoodCostStatus();
}




/**
 * ==========================================
 * Recalculate Pricing
 * ==========================================
 */
function recalculatePricing() {

    // Row Calculations
    calculateIngredientCosts();

    // Cost Calculations
    calculateIngredientTotal();

    calculateBusinessCosts();

    calculateTotalCost();

    // Profit Calculations
    calculateSellingPrice();

    calculateProfit();

    calculateProfitPercentage();

    calculateFoodCostPercentage();

    // Refresh UI
    updateSummary();

}



   /**
    * ==========================================
    * Ingredient Changed
    * ==========================================
    */
   function ingredientChanged(select) {
      const ingredient = select.value;

      if (!ingredient) {
         return;
      }

      google.script.run

         .withSuccessHandler(function (data) {
            if (!data.success) {
               showCustomToast(data.message, "error");

               return;
            }

            const row = select.closest("tr");

            // Save latest purchase details

            row.dataset.purchaseQuantity = data.quantity;

            row.dataset.purchaseUnit = data.unit;

            row.dataset.purchaseAmount = data.amount;

            // Calculate Rate

            const rate = calculateRate(
               data.amount,

               data.quantity,

               data.unit,
            );

           row.dataset.purchaseRate = rate;

            // Show Rate

            row.querySelector(".ingredientRate").innerText =
               "₹" + rate.toFixed(3);

            // Recipe Quantity should be empty

            row.querySelector(".ingredientQty").value = "";

            // Default recipe unit

            row.querySelector(".ingredientUnit").value = data.unit;

            // Reset Cost
            
           row.dataset.ingredientCost = 0;

            recalculatePricing();
         })

         .withFailureHandler(function (error) {
            console.error(error);
            showCustomToast(error.toString(), "error");
         })

         .getLatestPurchase(ingredient);
   }

/**
 * ==========================================
 * Save Recipe & Pricing Data
 * ==========================================
 */
function saveRecipePricing() {
    const menuItemSelect = document.getElementById("pricingMenuItem");
    const menuItem = menuItemSelect ? menuItemSelect.value : "";
    const category = document.getElementById("pricingCategory") ? document.getElementById("pricingCategory").value : "";
    const sellingPrice = Number(document.getElementById("sellingPrice").value) || 0;

    if (!menuItem) {
        showCustomToast("Please select a Menu Item before saving.", "error");
        menuItemSelect.focus();
        return;
    }

    const rows = document.querySelectorAll("#ingredientTableBody tr");
    const ingredients = [];

    rows.forEach(function(row) {
        // Skip placeholder rows
        if (row.cells.length < 7) return;

        const nameEl = row.querySelector(".ingredientName");
        const qtyEl = row.querySelector(".ingredientQty");
        const unitEl = row.querySelector(".ingredientUnit");

        const ingredientName = nameEl ? nameEl.value : "";
        const qty = Number(qtyEl ? qtyEl.value : 0) || 0;
        const unit = unitEl ? unitEl.value : "";
        const rate = Number(row.dataset.purchaseRate) || 0;
        const cost = Number(row.dataset.ingredientCost) || (qty * rate);

        if (ingredientName && qty > 0) {
            ingredients.push({
                name: ingredientName,
                qty: qty,
                unit: unit,
                rate: rate,
                cost: cost
            });
        }
    });

    if (ingredients.length === 0) {
        showCustomToast("Please add at least one valid ingredient with quantity.", "error");
        return;
    }

    const payload = {
        menuItem: menuItem,
        category: category,
        sellingPrice: sellingPrice,
        ingredientTotal: window.pricingSummary.ingredientTotal,
        businessCost: window.pricingSummary.businessCost,
        totalCost: window.pricingSummary.totalCost,
        profit: window.pricingSummary.profit,
        profitPercentage: window.pricingSummary.profitPercentage,
        foodCostPercentage: window.pricingSummary.foodCostPercentage,
        ingredients: ingredients
    };

    google.script.run
        .withSuccessHandler(function(response) {
            if (response.success) {
                showCustomToast("Recipe and Pricing saved successfully for " + menuItem + "!", "success");
            } else {
                showCustomToast("Error saving: " + response.message, "error");
            }
        })
        .withFailureHandler(function(error) {
            console.error(error);
            showCustomToast("Failed to save recipe: " + error, "error");
        })
        .saveRecipeData(payload);
}



/**
 * Add Food Item tab - form feedback helpers.
 */
function resetNewFoodItemMessage() {
    const message = document.getElementById("newFoodItemMessage");
    if (!message) return;
    message.className = "alert d-none mb-0";
    message.textContent = "";
}

function showNewFoodItemMessage(text, isSuccess) {
    const message = document.getElementById("newFoodItemMessage");
    if (!message) {
        alert(text);
        return;
    }
    message.className = "alert mb-0 " + (isSuccess ? "alert-success" : "alert-danger");
    message.textContent = text;
}

/**
 * Refresh in-memory and local POS menu data after a successful menu insert.
 * This means POS search sees the new item without waiting for the old browser cache.
 */
function refreshPOSMenuAfterFoodItemSave() {
    google.script.run
        .withSuccessHandler(function(menu) {
            const freshMenu = (menu || []).map(function(item) {
                return Object.assign({}, item, {
                    searchName: String(item.itemName || "").trim().toLowerCase()
                });
            });

            // JavaScript.html owns this variable in the parent app scope.
            if (typeof menuCache !== "undefined") {
                menuCache = freshMenu;
            }

            try {
                const raw = localStorage.getItem("smoky_swaad_pos_cache");
                const cached = raw ? JSON.parse(raw) : {};
                cached.menu = freshMenu;
                cached.timestamp = Date.now();
                localStorage.setItem("smoky_swaad_pos_cache", JSON.stringify(cached));
            } catch (storageError) {
                console.warn("Could not update local POS menu cache:", storageError);
            }
        })
        .withFailureHandler(function(error) {
            console.error("Food item was saved, but POS menu refresh failed:", error);
        })
        .loadMenu();
}



/** Menu management UI: load all active and inactive items. */
function showMenuManagementMessage(message, success) {
  const el = document.getElementById("menuManagementMessage");
  if (!el) return;
  el.className = "alert " + (success ? "alert-success" : "alert-danger");
  el.textContent = message;
}

function loadMenuManagement() {
  const tbody = document.getElementById("menuManagementTableBody");
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="6" class="text-center">Loading menu items...</td></tr>';
  google.script.run
    .withSuccessHandler(function(items) {
      window.menuManagementItems = Array.isArray(items) ? items : [];
      renderMenuManagementTable(window.menuManagementItems);
    })
    .withFailureHandler(function(error) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-danger">Could not load menu items.</td></tr>';
      showMenuManagementMessage(error && error.message ? error.message : String(error), false);
    })
    .getMenuItemsForManagement();
}

function renderMenuManagementTable(items) {
  const tbody = document.getElementById("menuManagementTableBody");
  if (!tbody) return;
  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No menu items found.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map(function(item) {
    const id = escapeMenuManagerValue(item.itemId);
    const name = escapeMenuManagerValue(item.itemName);
    const category = escapeMenuManagerValue(item.category);
    return `<tr data-menu-id="${id}">
      <td><div class="fw-semibold">${name}</div><small class="text-muted">${id}</small></td>
      <td><input class="form-control form-control-sm menu-manager-category" maxlength="80" value="${category}" aria-label="Category for ${name}"></td>
      <td><input class="form-control form-control-sm menu-manager-price" type="number" min="0.01" step="0.01" value="${Number(item.price) || 0}" aria-label="Selling price for ${name}"></td>
      <td><input class="form-control form-control-sm menu-manager-cost" type="number" min="0" step="0.01" value="${Number(item.cost) || 0}" aria-label="Cost price for ${name}"></td>
      <td><select class="form-select form-select-sm menu-manager-active" aria-label="Status for ${name}"><option value="yes" ${item.isActive ? 'selected' : ''}>Active</option><option value="no" ${!item.isActive ? 'selected' : ''}>Inactive</option></select></td>
      <td><div class="d-flex gap-1 flex-wrap"><button class="btn btn-sm btn-primary" onclick="saveMenuManagerRow(this)">Save</button><button class="btn btn-sm btn-outline-danger" onclick="removeMenuManagerItem(this, '${id}', '${name}')" ${item.isActive ? '' : 'disabled'}>Remove</button></div></td>
    </tr>`;
  }).join("");
}

function escapeMenuManagerValue(value) {
  return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function saveMenuManagerRow(button) {
  const row = button.closest("tr");
  const payload = {
    itemId: row.getAttribute("data-menu-id"),
    category: row.querySelector(".menu-manager-category").value.trim(),
    price: Number(row.querySelector(".menu-manager-price").value),
    cost: Number(row.querySelector(".menu-manager-cost").value),
    isActive: row.querySelector(".menu-manager-active").value === "yes"
  };
  if (!payload.category || !Number.isFinite(payload.price) || payload.price <= 0 || !Number.isFinite(payload.cost) || payload.cost < 0) {
    showMenuManagementMessage("Please enter a category, a selling price greater than zero, and a valid non-negative cost price.", false);
    return;
  }
  button.disabled = true;
  button.textContent = "Saving...";
  google.script.run
    .withSuccessHandler(function(response) {
      button.disabled = false;
      button.textContent = "Save";
      if (!response || !response.success) {
        showMenuManagementMessage(response && response.message ? response.message : "Unable to update menu item.", false);
        return;
      }
      showMenuManagementMessage(response.message, true);
      refreshPOSMenuAfterFoodItemSave();
      if (typeof loadMenuItems === "function") loadMenuItems();
      loadMenuManagement();
    })
    .withFailureHandler(function(error) {
      button.disabled = false;
      button.textContent = "Save";
      showMenuManagementMessage(error && error.message ? error.message : String(error), false);
    })
    .updateMenuItemDetails(payload);
}

function removeMenuManagerItem(button, itemId, itemName) {
  if (!window.confirm('Remove "' + itemName + '" from the POS menu? It will be marked inactive; past orders will be preserved.')) return;
  button.disabled = true;
  button.textContent = "Removing...";
  google.script.run
    .withSuccessHandler(function(response) {
      if (!response || !response.success) {
        button.disabled = false;
        button.textContent = "Remove";
        showMenuManagementMessage(response && response.message ? response.message : "Unable to remove menu item.", false);
        return;
      }
      showMenuManagementMessage(response.message, true);
      refreshPOSMenuAfterFoodItemSave();
      if (typeof loadMenuItems === "function") loadMenuItems();
      loadMenuManagement();
    })
    .withFailureHandler(function(error) {
      button.disabled = false;
      button.textContent = "Remove";
      showMenuManagementMessage(error && error.message ? error.message : String(error), false);
    })
    .deactivateMenuItem(itemId);
}

/**
 * Save a new food item to the same Menu sheet used by POS search.
 */
function saveNewFoodItemFromPricing(event) {
    if (event && typeof event.preventDefault === "function") {
        event.preventDefault();
    }

    const form = document.getElementById("addFoodItemForm");
    const saveButton = document.getElementById("saveNewFoodItemButton");
    if (!form) return;

    const payload = {
        itemName: String(document.getElementById("newFoodItemName").value || "").trim(),
        category: String(document.getElementById("newFoodItemCategory").value || "").trim(),
        price: Number(document.getElementById("newFoodItemPrice").value),
        cost: Number(document.getElementById("newFoodItemCost").value || 0),
        prepTime: Number(document.getElementById("newFoodItemPrepTime").value || 0),
        isActive: document.getElementById("newFoodItemActive").checked
    };

    if (!payload.itemName || !payload.category || !Number.isFinite(payload.price) || payload.price <= 0) {
        showNewFoodItemMessage("Enter a food item name, category, and selling price greater than zero.", false);
        return;
    }

    resetNewFoodItemMessage();
    if (saveButton) {
        saveButton.disabled = true;
        saveButton.textContent = "Saving...";
    }

    google.script.run
        .withSuccessHandler(function(response) {
            if (saveButton) {
                saveButton.disabled = false;
                saveButton.textContent = "💾 Save Food Item";
            }
            if (!response || !response.success) {
                showNewFoodItemMessage(response && response.message ? response.message : "Unable to save the food item.", false);
                return;
            }

            showNewFoodItemMessage(response.message || "Food item saved successfully.", true);

            if (payload.isActive) {
                refreshPOSMenuAfterFoodItemSave();
            }

            // Refresh the existing Pricing Calculator dropdown too.
            if (typeof loadMenuItems === "function") {
                loadMenuItems();
            }

            form.reset();
            document.getElementById("newFoodItemCost").value = "0";
            document.getElementById("newFoodItemPrepTime").value = "30";
            document.getElementById("newFoodItemActive").checked = true;
        })
        .withFailureHandler(function(error) {
            if (saveButton) {
                saveButton.disabled = false;
                saveButton.textContent = "💾 Save Food Item";
            }
            showNewFoodItemMessage(error && error.message ? error.message : "Unable to save the food item.", false);
        })
        .addFoodItemToMenu(payload);
}


// Load all menu items (including inactive ones) into the menu management table.
document.addEventListener("shown.bs.tab", function(event) {
    if (event.target && event.target.id === "manage-menu-tab") loadManageMenuItems();
});

function showManageMenuMessage(message, success) {
    const el = document.getElementById("manageMenuMessage");
    if (!el) return;
    el.className = "alert " + (success ? "alert-success" : "alert-danger");
    el.textContent = message;
    el.classList.remove("d-none");
}

function loadManageMenuItems() {
    const body = document.getElementById("manageMenuItemsBody");
    if (!body) return;
    body.innerHTML = '<tr><td colspan="6" class="text-center">Loading menu items...</td></tr>';
    google.script.run.withSuccessHandler(function(items) {
        if (!items || !items.length) { body.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No menu items found.</td></tr>'; return; }
        body.innerHTML = items.map(function(item) {
            const esc = function(v) { return String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;"); };
            return '<tr data-item-id="' + esc(item.itemId) + '">' +
                '<td><div class="fw-semibold">' + esc(item.itemName) + '</div><small class="text-muted">' + esc(item.itemId) + '</small></td>' +
                '<td><input class="form-control form-control-sm menu-category" value="' + esc(item.category) + '" required></td>' +
                '<td><input class="form-control form-control-sm menu-cost" type="number" min="0" step="0.01" value="' + esc(item.cost) + '" required></td>' +
                '<td><input class="form-control form-control-sm menu-price" type="number" min="0.01" step="0.01" value="' + esc(item.price) + '" required></td>' +
                '<td><input class="form-check-input menu-active" type="checkbox" ' + (item.isActive ? 'checked' : '') + ' aria-label="Active"></td>' +
                '<td><button type="button" class="btn btn-outline-danger btn-sm" onclick="deactivateMenuItemRow(this)">Remove</button></td></tr>';
        }).join("");
    }).withFailureHandler(function(err) {
        body.innerHTML = '<tr><td colspan="6" class="text-danger">Could not load menu items.</td></tr>';
        showManageMenuMessage(err && err.message ? err.message : String(err), false);
    }).getMenuItemsForManagement();
}

function deactivateMenuItemRow(button) {
    const row = button.closest("tr");
    if (!row) return;
    const name = row.querySelector("td .fw-semibold").textContent;
    if (!confirm('Remove "' + name + '" from the active POS menu? This preserves the spreadsheet row and old orders. Click Save All Changes to apply.')) return;
    row.querySelector(".menu-active").checked = false;
    row.classList.add("table-warning");
}

function saveAllMenuItems() {
    const button = document.getElementById("saveAllMenuItemsButton");
    const rows = Array.from(document.querySelectorAll("#manageMenuItemsBody tr[data-item-id]"));
    if (!rows.length) { showManageMenuMessage("There are no menu changes to save.", false); return; }
    const items = rows.map(function(row) { return {
        itemId: row.getAttribute("data-item-id"),
        category: row.querySelector(".menu-category").value.trim(),
        cost: Number(row.querySelector(".menu-cost").value),
        price: Number(row.querySelector(".menu-price").value),
        isActive: row.querySelector(".menu-active").checked
    }; });
    for (const item of items) {
        if (!item.category || !Number.isFinite(item.cost) || item.cost < 0 || !Number.isFinite(item.price) || item.price <= 0) {
            showManageMenuMessage("Check each row: category is required, cost must be 0 or more, and selling price must be greater than 0.", false); return;
        }
    }
    button.disabled = true; button.textContent = "Saving All...";
    google.script.run.withSuccessHandler(function(response) {
        button.disabled = false; button.textContent = "💾 Save All Changes";
        if (!response || !response.success) { showManageMenuMessage(response && response.message ? response.message : "Unable to save menu changes.", false); return; }
        showManageMenuMessage(response.message || "All menu changes saved.", true);
        if (typeof refreshPOSMenuAfterFoodItemSave === "function") refreshPOSMenuAfterFoodItemSave();
        if (typeof loadMenuItems === "function") loadMenuItems();
        loadManageMenuItems();
    }).withFailureHandler(function(err) {
        button.disabled = false; button.textContent = "💾 Save All Changes";
        showManageMenuMessage(err && err.message ? err.message : String(err), false);
    }).saveMenuItemsBulk(items);
}

</script>
