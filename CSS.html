<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* ==========================================
   GLOBAL
========================================== */

:root{

    --brand:#ff6b00;

}

html,
body{

    height:100%;
    margin:0;
    padding:0;

    background:#f5f7fa;

    font-family:Arial, Helvetica, sans-serif;

    font-size:14px;

    overflow:hidden;

}

/* ==========================================
   HEADER
========================================== */

.navbar{

    height:60px;

}

/* ==========================================
   SIDEBAR
========================================== */

#sidebar{

    position:fixed;

    top:60px;

    left:0;

    width:220px;

    height:calc(100vh - 60px);

    overflow-y:auto;

    background:#ffffff;

    border-right:1px solid #dee2e6;

}

/* ==========================================
   MAIN CONTENT
========================================== */

#main-content{

    margin-left:220px;

    margin-top:60px;

    height:calc(100vh - 60px);

    overflow-y:auto;

    padding:12px;

}

/* ==========================================
   TYPOGRAPHY
========================================== */

body{

    font-size:14px;

}

.card-header h4{

    font-size:1.45rem;
    margin:0;

}

.card-header h5{

    font-size:1.1rem;
    margin:0;

}

h5{

    font-size:1.05rem;

}

.form-label{

    font-size:13px;
    font-weight:600;
    margin-bottom:4px;

}

.form-control,
.form-select{

    font-size:14px;

}

.btn{

    font-size:14px;

}

.list-group-item{

    font-size:15px;

}

/* ==========================================
   CARDS
========================================== */

.card{

    border-radius:10px;

    margin-bottom:12px;

}

.card-body{

    padding:16px;

}

/* ==========================================
   FORMS
========================================== */

.row.g-3{

    row-gap:.6rem !important;

}

.input-group-text{

    font-size:14px;

}

/* ==========================================
   SIDEBAR MENU
========================================== */

#sidebar .list-group-item{

    padding:12px 16px;

}

/* ==========================================
   MOBILE
========================================== */

@media(max-width:768px){

    html,
    body{
        height:auto;
        min-height:100%;
        overflow-x:hidden;
        overflow-y:auto;
    }

    #sidebar{

        position:relative;

        width:100%;

        height:auto;

        top:0;

    }

    #main-content{

        margin-left:0;

        margin-top:0;

        height:auto;

        min-height:calc(100vh - 60px);

        overflow:visible;

        padding:10px;

    }

}


/* ==========================================
   MOBILE SELECT PICKER
   Global fallback for touch/mobile browsers.
   Desktop continues to use native <select>.
========================================== */

#mobileSelectPickerOverlay{
    position:fixed;
    inset:0;
    z-index:20000;
    display:none;
    align-items:flex-end;
    background:rgba(0,0,0,.35);
    padding:12px;
}

#mobileSelectPickerOverlay.is-open{
    display:flex;
}

#mobileSelectPicker{
    width:100%;
    max-height:min(72vh,560px);
    overflow:hidden;
    background:#fff;
    border-radius:16px 16px 10px 10px;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);
}

.mobile-select-picker-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid #e9ecef;
}

#mobileSelectPickerTitle{
    min-width:0;
    margin:0;
    font-size:16px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

#mobileSelectPickerOptions{
    max-height:calc(min(72vh,560px) - 58px);
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
}

.mobile-select-picker-option{
    width:100%;
    min-height:48px;
    border:0;
    border-bottom:1px solid #f1f3f5;
    background:#fff;
    padding:11px 14px;
    text-align:left;
    font-size:16px;
}

.mobile-select-picker-option.is-selected{
    font-weight:700;
    background:#f8f9fa;
}


/* ==========================================
   MOBILE DROPDOWNS - ARROW ONLY STANDARD V2
========================================== */

@media (max-width:768px), (pointer:coarse){

    /* The wrapper must have exactly the same geometry as the select.
       This prevents the arrow hit-area from leaking above/below fields. */
    .mobile-select-arrow-host{
        position:relative !important;
    }

    select.mobile-arrow-select,
    #personalExpensesScreen select.form-select.mobile-arrow-select{
        -webkit-appearance:none !important;
        appearance:none !important;
        background-image:none !important;
        pointer-events:none !important;
        padding-right:48px !important;
    }

    /* Dedicated arrow hit area. It is vertically centered against the
       select itself and has no divider/border line. */
    .mobile-select-arrow-button{
        position:absolute !important;
        z-index:20 !important;
        right:0 !important;

        /* JS writes --mobile-select-top and --mobile-select-height from
           the actual select geometry. Fallbacks cover initial paint. */
        top:var(--mobile-select-top, 0px) !important;
        height:var(--mobile-select-height, 100%) !important;

        width:48px !important;
        min-width:48px !important;

        margin:0 !important;
        padding:0 !important;

        border:0 !important;
        outline:0 !important;
        box-shadow:none !important;
        background:transparent !important;

        display:flex !important;
        align-items:center !important;
        justify-content:center !important;

        border-radius:0 .375rem .375rem 0 !important;

        touch-action:manipulation;
        -webkit-tap-highlight-color:transparent;
        cursor:pointer;
    }

    .mobile-select-arrow-button:active{
        background:rgba(0,0,0,.04) !important;
    }

    .mobile-select-arrow-chevron{
        display:block;
        width:10px;
        height:10px;
        margin-top:-5px;
        border-right:2px solid currentColor;
        border-bottom:2px solid currentColor;
        transform:rotate(45deg);
        transform-origin:center;
        pointer-events:none;
    }

    .mobile-select-arrow-button:disabled{
        opacity:.45;
        pointer-events:none;
    }

    /* Personal Expenses history filters:
       keep Month and Category on an exact 50/50 grid. */
    #personalExpensesScreen .pe-history-filter-row{
        display:grid !important;
        grid-template-columns:minmax(0, 1fr) minmax(0, 1fr) !important;
        gap:10px !important;
    }

    #personalExpensesScreen .pe-history-filter-row > *{
        width:100% !important;
        min-width:0 !important;
        max-width:none !important;
    }
}

@media (min-width:769px) and (pointer:fine){
    .mobile-select-arrow-button{
        display:none !important;
    }

    select.mobile-arrow-select{
        pointer-events:auto !important;
    }

    #mobileSelectPickerOverlay{
        display:none !important;
    }
}

</style>
