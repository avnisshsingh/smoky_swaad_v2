   // ==========================================
   // GLOBAL MOBILE SELECT PICKER
   // ==========================================
   // Apps Script screens are injected dynamically, therefore
   // one delegated handler covers every current/future <select>.
   // Desktop keeps the browser-native select behaviour.

   let mobileSelectPickerTarget = null;
   let mobilePickerOpeningGuardUntil = 0;

   function shouldUseMobileSelectPicker() {
      return window.matchMedia("(max-width: 768px), (pointer: coarse)").matches;
   }

   function ensureMobileSelectPicker() {
      let overlay = document.getElementById("mobileSelectPickerOverlay");

      if (overlay) return overlay;

      overlay = document.createElement("div");
      overlay.id = "mobileSelectPickerOverlay";
      overlay.setAttribute("aria-hidden", "true");

      overlay.innerHTML = `
         <div id="mobileSelectPicker" role="dialog" aria-modal="true">
            <div class="mobile-select-picker-header">
               <h2 id="mobileSelectPickerTitle">Select</h2>
               <button type="button"
                       id="mobileSelectPickerClose"
                       class="btn btn-sm btn-outline-secondary">
                  Close
               </button>
            </div>
            <div id="mobileSelectPickerOptions"></div>
         </div>
      `;

      document.body.appendChild(overlay);

      overlay.addEventListener("click", function (event) {
         // Ignore only the release/click belonging to the gesture that
         // opened this picker. Without this guard Android can immediately
         // close/select against the newly-created overlay.
         if (Date.now() < mobilePickerOpeningGuardUntil) {
            event.preventDefault();
            event.stopPropagation();
            return;
         }

         if (
            event.target === overlay ||
            event.target.closest("#mobileSelectPickerClose")
         ) {
            closeMobileSelectPicker();
            return;
         }

         const optionButton = event.target.closest(
            "[data-mobile-select-index]",
         );

         if (!optionButton || !mobileSelectPickerTarget) return;

         const index = Number(optionButton.dataset.mobileSelectIndex);
         const option = mobileSelectPickerTarget.options[index];

         if (!option || option.disabled) return;

         mobileSelectPickerTarget.selectedIndex = index;

         // Preserve every module's existing listeners/calculations.
         mobileSelectPickerTarget.dispatchEvent(
            new Event("input", { bubbles: true }),
         );
         mobileSelectPickerTarget.dispatchEvent(
            new Event("change", { bubbles: true }),
         );

         closeMobileSelectPicker();
      });

      return overlay;
   }

   function getMobileSelectTitle(select) {
      if (!select) return "Select";

      if (select.id) {
         const label = document.querySelector(
            `label[for="${CSS.escape(select.id)}"]`,
         );
         if (label && label.textContent.trim()) {
            return label.textContent.replace("*", "").trim();
         }
      }

      return (
         select.getAttribute("aria-label") ||
         select.getAttribute("name") ||
         "Select"
      );
   }

   function openMobileSelectPicker(select) {
      if (!select || select.disabled) return;

      const overlay = ensureMobileSelectPicker();
      const title = document.getElementById("mobileSelectPickerTitle");
      const optionsBox = document.getElementById("mobileSelectPickerOptions");

      mobileSelectPickerTarget = select;
      title.textContent = getMobileSelectTitle(select);

      const html = [];

      for (let i = 0; i < select.options.length; i++) {
         const option = select.options[i];

         html.push(
            `<button type="button"
                     class="mobile-select-picker-option${i === select.selectedIndex ? " is-selected" : ""}"
                     data-mobile-select-index="${i}"
                     ${option.disabled ? "disabled" : ""}>
               ${escapeMobileSelectText(option.textContent)}
            </button>`,
         );
      }

      optionsBox.innerHTML = html.join("");
      overlay.classList.add("is-open");
      overlay.setAttribute("aria-hidden", "false");

      requestAnimationFrame(function () {
         const selected = optionsBox.querySelector(".is-selected");
         if (selected) {
            selected.scrollIntoView({ block: "nearest" });
         }
      });
   }

   function closeMobileSelectPicker() {
      const overlay = document.getElementById("mobileSelectPickerOverlay");

      if (overlay) {
         overlay.classList.remove("is-open");
         overlay.setAttribute("aria-hidden", "true");
      }

      mobileSelectPickerTarget = null;
   }

   function escapeMobileSelectText(value) {
      const div = document.createElement("div");
      div.textContent = String(value || "");
      return div.innerHTML;
   }

   // ==========================================================
   // MOBILE SELECT ACTIVATION - ARROW ONLY
   // ==========================================================
   // On mobile the native <select> itself is made non-interactive.
   // A dedicated arrow button is added over the right side of every
   // dropdown. This gives us three benefits:
   //   1. only the arrow opens the picker;
   //   2. scrolling over the field cannot accidentally open it;
   //   3. the browser's native select UI can never appear.
   //
   // Existing <select> values/change events remain the source of truth.

   function syncMobileSelectArrowGeometry(select, button) {
      if (!select || !button || !select.parentElement) {
         return;
      }

      const host = select.parentElement;

      const selectRect = select.getBoundingClientRect();

      const hostRect = host.getBoundingClientRect();

      const top = Math.max(0, selectRect.top - hostRect.top);

      button.style.setProperty("--mobile-select-top", top + "px");

      button.style.setProperty(
         "--mobile-select-height",
         selectRect.height + "px",
      );
   }

   function enhanceMobileSelect(select) {
      if (!select || select.dataset.mobileArrowReady === "true") {
         return;
      }

      const host = select.parentElement;

      if (!host) {
         return;
      }

      select.dataset.mobileArrowReady = "true";
      select.classList.add("mobile-arrow-select");

      host.classList.add("mobile-select-arrow-host");

      const button = document.createElement("button");

      button.type = "button";
      button.className = "mobile-select-arrow-button";
      button.setAttribute(
         "aria-label",
         "Open " +
            (select.getAttribute("aria-label") ||
               select.name ||
               select.id ||
               "dropdown"),
      );

      button.innerHTML =
         '<span aria-hidden="true" class="mobile-select-arrow-chevron"></span>';

      button.addEventListener("click", function (event) {
         event.preventDefault();
         event.stopPropagation();

         if (select.disabled || !select.isConnected) {
            return;
         }

         openMobileSelectPicker(select);
      });

      host.appendChild(button);

      syncMobileSelectArrowGeometry(select, button);
   }

   function enhanceAllMobileSelects(root) {
      if (!shouldUseMobileSelectPicker()) {
         return;
      }

      const scope = root && root.querySelectorAll ? root : document;

      if (scope.matches && scope.matches("select")) {
         enhanceMobileSelect(scope);
      }

      const selects = scope.querySelectorAll("select");

      for (let i = 0; i < selects.length; i++) {
         enhanceMobileSelect(selects[i]);
      }

      // Run once after layout settles so arrows match the exact select
      // rectangle even when Bootstrap/grid content was just injected.
      window.requestAnimationFrame(function () {
         for (let i = 0; i < selects.length; i++) {
            const select = selects[i];

            const host = select.parentElement;

            if (!host) continue;

            const button = host.querySelector(".mobile-select-arrow-button");

            if (button) {
               syncMobileSelectArrowGeometry(select, button);
            }
         }
      });
   }

   function initializeMobileSelectArrows() {
      if (!shouldUseMobileSelectPicker()) {
         return;
      }

      enhanceAllMobileSelects(document);

      // Screens are injected dynamically by openScreen(). Observe only
      // added nodes and enhance their selects once; no polling is used.
      const content = document.getElementById("content");

      if (!content || content.dataset.mobileSelectObserverReady === "true") {
         return;
      }

      content.dataset.mobileSelectObserverReady = "true";

      const observer = new MutationObserver(function (mutations) {
         for (let i = 0; i < mutations.length; i++) {
            const added = mutations[i].addedNodes;

            for (let j = 0; j < added.length; j++) {
               const node = added[j];

               if (node.nodeType !== 1) {
                  continue;
               }

               enhanceAllMobileSelects(node);
            }
         }
      });

      observer.observe(content, {
         childList: true,
         subtree: true,
      });
   }

   document.addEventListener("DOMContentLoaded", initializeMobileSelectArrows);

   function openScreen(screen) {
      google.script.run
         .withSuccessHandler(function (html) {
            document.getElementById("content").innerHTML = html;
            document.title = "Smoky Swaad ERP - " + screen;

            // Ensure dynamically loaded dropdowns get the standard
            // mobile arrow-only control immediately.
            enhanceAllMobileSelects(document.getElementById("content"));

            optimizeMobileControls(document.getElementById("content"));

            if (
               window.matchMedia("(max-width: 768px), (pointer: coarse)")
                  .matches
            ) {
               document.getElementById("main-content").scrollTop = 0;
               window.scrollTo(0, 0);
            }

            if (screen === "POS") {
               setTimeout(function () {
                  loadPOSCache();

                  const orderDate = document.getElementById("orderDate");

                  if (orderDate) {
                     orderDate.value = getToday();
                  }
               }, 100);
            } else if (screen === "Purchase") {
               setTimeout(function () {
                  if (document.getElementById("purchaseDate")) {
                     initializePurchase();
                  }
               }, 100);
            } else if (screen === "Invoice") {
               setTimeout(function () {
                  initializeInvoice();
               }, 100);
            } else if (screen === "Reports") {
               setTimeout(function () {
                  initializeReports();
               }, 100);
            } else if (screen === "PersonalExpenses") {
               setTimeout(function () {
                  initializePersonalExpenses();
               }, 100);
            } else if (screen === "CostsAndPricing") {
               // NEW COMBINED SCREEN LOGIC
               setTimeout(function () {
                  initializePricingCalculator();
                  initializeBusinessCosts();
               }, 100);
            }
         })
         .loadScreen(screen);
   }

   /**

   let personalExpenseDescriptionCache = [];
   let personalExpenseDescriptionMap = Object.create(null);
   let personalExpenseHistoryCache = [];
   let personalExpenseCategoryCache = [];
   let personalExpenseBootstrapLoaded = false;

   // Personal Expenses DOM/cache state.
   // Rebuilt whenever the screen HTML is loaded.
   let personalExpenseDom = Object.create(null);
   let personalExpenseLastHistorySignature = "";
   let personalExpenseLastDescriptionQuery = "";
   let personalExpenseLastDescriptionHtml = "";
   let personalExpenseVisibleDescriptionMatches = [];

   function cachePersonalExpenseDom() {
      const ids = [
         "personalExpenseDate",
         "personalExpensePaymentMode",

         "personalExpenseNature",

   function peEl(id) {

   function initializePersonalExpenses() {

   /**
    * ==========================================
    * PERSONAL EXPENSE HIGH-PERFORMANCE BOOTSTRAP
    * One server call for dashboard + history +
    * units + smart descriptions.
    * ==========================================
    */
   function loadPersonalExpenseBootstrap(forceRefresh) {
      google.script.run
         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               console.error(
                  "Expense bootstrap failed:",
                  response && response.message
                     ? response.message
                     : "Unknown error",
               );

               return;
            }

            personalExpenseBootstrapLoaded = true;

            updatePersonalExpenseSummary(response.summary || {});

            populatePersonalExpenseUnits(response.units || []);

            personalExpenseCategoryCache = Array.isArray(response.categories)
               ? response.categories
               : [];

            populatePersonalExpenseCategories(personalExpenseCategoryCache);

            personalExpenseDescriptionCache = Array.isArray(
               response.descriptions,
            )
               ? response.descriptions
               : [];

            preparePersonalExpenseDescriptionSearchCache();

            personalExpenseLastDescriptionQuery = "";
            personalExpenseLastDescriptionHtml = "";
            personalExpenseVisibleDescriptionMatches = [];

            populatePersonalExpenseQuantitySuggestions();

            personalExpenseHistoryCache = Array.isArray(response.history)
               ? response.history
               : [];

            // Precompute frequently-used filter/search values once.
            for (let i = 0; i < personalExpenseHistoryCache.length; i++) {
               const expense = personalExpenseHistoryCache[i];

               expense._month = String(expense.expenseDateKey || "").slice(
                  0,
                  7,
               );

               expense._category = String(expense.category || "");

               expense._isExpense =
                  String(expense.nature || "").toLowerCase() === "expense";

               expense._amount = Number(expense.amount || 0);

               expense._search = [
                  expense.expenseId,
                  expense.description,
                  expense.category,
                  expense.subcategory,
                  expense.paidTo,
                  expense.referenceNo,
                  expense.remarks,
                  expense.unit,
                  expense.quantity,
               ]
                  .join(" ")
                  .toLowerCase();
            }

            personalExpenseLastHistorySignature = "";
            renderPersonalExpenseHistoryFromCache();
         })
         .withFailureHandler(function (error) {
            console.error("Expense bootstrap server failure:", error);
         })
         .getPersonalExpenseBootstrapData();
   }

   function registerPersonalExpenseLocalHistoryFilters() {
      const ids = [
         "personalExpenseHistoryMonth",
         "personalExpenseHistoryCategory",
         "personalExpenseHistorySearch",
      ];

      ids.forEach(function (id) {
         const element = document.getElementById(id);

         if (!element) return;

         if (element.dataset.localFilterBound === "true") {
            return;
         }

         element.dataset.localFilterBound = "true";

         const eventName = element.tagName === "INPUT" ? "input" : "change";

         let timer = null;

         element.addEventListener(eventName, function () {
            if (timer) {
               clearTimeout(timer);
            }

            timer = setTimeout(function () {
               renderPersonalExpenseHistoryFromCache();
            }, 80);
         });
      });
   }








  function renderPersonalExpenseHistoryFromCache() {
      if (!personalExpenseBootstrapLoaded) {
         return;
      }

      const monthEl = peEl("personalExpenseHistoryMonth");

      const categoryEl = peEl("personalExpenseHistoryCategory");

      const searchEl = peEl("personalExpenseHistorySearch");

      const month = monthEl ? String(monthEl.value || "") : "";

      const category = categoryEl ? String(categoryEl.value || "") : "";

      const search = searchEl
         ? String(searchEl.value || "")
              .trim()
              .toLowerCase()
         : "";

      const signature =
         month +
         "\u0001" +
         category +
         "\u0001" +
         search +
         "\u0001" +
         personalExpenseHistoryCache.length;

      // Do not rebuild the same history view twice.
      if (signature === personalExpenseLastHistorySignature) {
         return;
      }

      personalExpenseLastHistorySignature = signature;

      const filtered = [];
      let total = 0;

      // One pass only:
      // filter + search + total calculation together.
      for (let i = 0; i < personalExpenseHistoryCache.length; i++) {
         const expense = personalExpenseHistoryCache[i];

         if (month && expense._month !== month) {
            continue;
         }

         if (category && expense._category !== category) {
            continue;
         }

         if (search && expense._search.indexOf(search) === -1) {
            continue;
         }

         filtered.push(expense);

         if (expense._isExpense) {
            total += expense._amount;
         }
      }

      // ==========================================
      // FIX: Render filtered expenses to the UI
      // ==========================================
      renderPersonalExpenses(filtered);

      // ==========================================
      // FIX: Update transaction count and total text
      // ==========================================
      const info = document.getElementById("personalExpenseHistoryInfo");
      if (info) {
         info.textContent =
            filtered.length +
            (filtered.length === 1 ? " transaction" : " transactions") +
            " • Total " +
            formatPersonalExpenseCurrency(total);
      }
   }








   function loadPersonalExpenseSetup() {
      google.script.run
         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               console.error(
                  "Unable to load expense setup:",
                  response && response.message
                     ? response.message
                     : "Unknown error",
               );
               return;
            }

            populatePersonalExpenseUnits(response.units || []);

            personalExpenseDescriptionCache = Array.isArray(
               response.descriptions,
            )
               ? response.descriptions
               : [];

            personalExpenseDescriptionMap = Object.create(null);

            personalExpenseDescriptionCache.forEach(function (item) {
               const description = String(item.description || "").trim();

               if (!description) return;

               personalExpenseDescriptionMap[description.toLowerCase()] = item;
            });

            preparePersonalExpenseDescriptionSearchCache();
            populatePersonalExpenseQuantitySuggestions();
         })
         .withFailureHandler(function (error) {
            console.error("Expense setup load failed:", error);
         })
         .getPersonalExpenseSetupData();
   }

   function populatePersonalExpenseUnits(units) {
      const select = document.getElementById("personalExpenseUnit");

      if (!select) return;

      const currentValue = String(select.value || "").trim();

      let html = '<option value="">Select Unit</option>';

      (Array.isArray(units) ? units : []).forEach(function (unit) {
         unit = String(unit || "").trim();

         if (!unit) return;

         html +=
            '<option value="' +
            escapePersonalExpenseHtml(unit) +
            '">' +
            escapePersonalExpenseHtml(unit) +
            "</option>";
      });

      select.innerHTML = html;

      if (currentValue) {
         select.value = currentValue;
      }
   }

   function preparePersonalExpenseDescriptionSearchCache() {
      personalExpenseDescriptionCache = personalExpenseDescriptionCache
         .map(function (item) {
            const description = String(item.description || "").trim();

            return {
               description: description,
               category: String(item.category || "").trim(),
               quantity:
                  item.quantity === null || item.quantity === undefined
                     ? ""
                     : String(item.quantity).trim(),
               unit: String(item.unit || "").trim(),

               // Pre-computed once for fast mobile searches.
               searchText: description.toLowerCase(),
            };
         })
         .filter(function (item) {
            return item.description !== "";
         });

      personalExpenseDescriptionMap = Object.create(null);

      personalExpenseDescriptionCache.forEach(function (item) {
         personalExpenseDescriptionMap[item.description.toLowerCase()] = item;
      });
   }

   function populatePersonalExpenseQuantitySuggestions() {
      const list = peEl("personalExpenseQuantityList");

      if (!list) return;

      const seen = Object.create(null);

      const html = [];

      for (let i = 0; i < personalExpenseDescriptionCache.length; i++) {
         const value = String(
            personalExpenseDescriptionCache[i].quantity || "",
         ).trim();

         if (!value || seen[value]) {
            continue;
         }

         seen[value] = true;

         html.push(
            '<option value="' +
               escapePersonalExpenseHtml(value) +
               '"></option>',
         );
      }

      list.innerHTML = html.join("");
   }

   function registerPersonalExpenseSmartDescription() {
      const input = peEl("personalExpenseDescription");

      if (!input) return;

      if (input.dataset.smartSearchBound === "true") {
         return;
      }

      input.dataset.smartSearchBound = "true";

      let searchTimer = null;

      input.addEventListener("input", function () {
         if (searchTimer) {
            clearTimeout(searchTimer);
         }

         // Small debounce keeps typing smooth on mobile.
         searchTimer = setTimeout(function () {
            showPersonalExpenseDescriptionSuggestions(input.value);

            applyPersonalExpenseSmartCategory();
         }, 80);
      });

      input.addEventListener("focus", function () {
         if (String(input.value || "").trim().length >= 2) {
            showPersonalExpenseDescriptionSuggestions(input.value);
         }
      });

      input.addEventListener("keydown", function (event) {
         if (event.key === "Escape") {
            hidePersonalExpenseDescriptionSuggestions();
         }
      });
   }

   function showPersonalExpenseDescriptionSuggestions(query) {
      const box = peEl("personalExpenseDescriptionSuggestions");

      if (!box) return;

      const search = String(query || "")
         .trim()
         .toLowerCase();

      if (search.length < 2) {
         hidePersonalExpenseDescriptionSuggestions();
         return;
      }

      // Avoid repeating identical search/render work.
      if (
         search === personalExpenseLastDescriptionQuery &&
         box.style.display === "block"
      ) {
         return;
      }

      personalExpenseLastDescriptionQuery = search;

      const startsWith = [];
      const contains = [];

      // Search is fully local. Stop collecting once enough
      // candidates exist for the six visible results.
      for (let i = 0; i < personalExpenseDescriptionCache.length; i++) {
         const item = personalExpenseDescriptionCache[i];

         const position = item.searchText.indexOf(search);

         if (position === 0) {
            if (startsWith.length < 6) {
               startsWith.push(item);
            }
         } else if (position > 0 && contains.length < 6) {
            contains.push(item);
         }

         if (startsWith.length >= 6 && contains.length >= 6) {
            break;
         }
      }

      const matches = [];

      for (let i = 0; i < startsWith.length && matches.length < 6; i++) {
         matches.push(startsWith[i]);
      }

      for (let i = 0; i < contains.length && matches.length < 6; i++) {
         matches.push(contains[i]);
      }

      personalExpenseVisibleDescriptionMatches = matches;

      let html = "";

      if (!matches.length) {
         html =
            '<div class="list-group-item text-muted small">' +
            "No previous match — continue typing to add a new description." +
            "</div>";
      } else {
         const parts = [];

         for (let i = 0; i < matches.length; i++) {
            const item = matches[i];

            let detail = "";

            if (item.category) {
               detail = item.category;
            }

            if (item.quantity) {
               const quantityText =
                  item.quantity + (item.unit ? " " + item.unit : "");

               detail = detail ? detail + " • " + quantityText : quantityText;
            } else if (item.unit) {
               detail = detail ? detail + " • " + item.unit : item.unit;
            }

            parts.push(
               '<button type="button" ' +
                  'class="list-group-item list-group-item-action pe-description-result" ' +
                  'data-pe-index="' +
                  i +
                  '">' +
                  '<div class="fw-semibold">' +
                  escapePersonalExpenseHtml(item.description) +
                  "</div>" +
                  (detail
                     ? '<div class="small text-muted">' +
                       escapePersonalExpenseHtml(detail) +
                       "</div>"
                     : "") +
                  "</button>",
            );
         }

         html = parts.join("");
      }

      if (html !== personalExpenseLastDescriptionHtml) {
         box.innerHTML = html;
         personalExpenseLastDescriptionHtml = html;
      }

      box.style.display = "block";

      if (box.dataset.resultDelegateBound !== "true") {
         box.dataset.resultDelegateBound = "true";

         box.addEventListener("click", function (event) {
            const button = event.target.closest(".pe-description-result");

            if (!button || !box.contains(button)) {
               return;
            }

            const index = Number(button.dataset.peIndex);

            const selected = personalExpenseVisibleDescriptionMatches[index];

            if (selected) {
               selectPersonalExpenseDescription(selected);
            }
         });
      }
   }

   function populatePersonalExpenseCategories(categories) {
      const source = Array.isArray(categories) ? categories : [];

      const clean = [];
      const seenCategories = Object.create(null);

      for (let i = 0; i < source.length; i++) {
         const value = String(source[i] || "").trim();

         if (!value) {
            continue;
         }

         const key = value.toLowerCase();

         if (seenCategories[key]) {
            continue;
         }

         seenCategories[key] = true;
         clean.push(value);
      }

      clean.sort(function (a, b) {
         return a.localeCompare(b, undefined, {
            sensitivity: "base",
            numeric: true,
         });
      });

      personalExpenseCategoryCache = clean;

      const categorySelect = document.getElementById("personalExpenseCategory");

      const historySelect = document.getElementById(
         "personalExpenseHistoryCategory",
      );

      const currentCategory = categorySelect
         ? String(categorySelect.value || "")
         : "";

      const currentHistory = historySelect
         ? String(historySelect.value || "")
         : "";

      // 1. POPULATE DROPDOWNS (Includes ALL categories)
      const options = clean
         .map(function (category) {
            const icon = getPersonalExpenseCategoryIcon(category);

            return (
               '<option value="' +
               escapePersonalExpenseHtml(category) +
               '">' +
               icon +
               " " +
               escapePersonalExpenseHtml(category) +
               "</option>"
            );
         })
         .join("");

      if (categorySelect) {
         categorySelect.innerHTML =
            '<option value="">Select Category</option>' + options;

         if (currentCategory) {
            categorySelect.value = currentCategory;
         }
      }

      if (historySelect) {
         historySelect.innerHTML =
            '<option value="">All Categories</option>' + options;

         if (currentHistory) {
            historySelect.value = currentHistory;
         }
      }

      const grid = document.getElementById("personalExpenseQuickCategoryGrid");

      if (grid) {
         // 2. DEFINE TILES TO HIDE FROM UI GRID
         const hiddenTiles = [
            "education",
            "entertainment",
            "medical",
            "vegetables",
         ];

         // 3. POPULATE GRID (Filters out the hidden tiles)
         grid.innerHTML = clean
            .filter(function (category) {
               return !hiddenTiles.includes(category.toLowerCase());
            })
            .map(function (category) {
               const icon = getPersonalExpenseCategoryIcon(category);

               return (
                  '<button type="button" ' +
                  'class="btn btn-outline-secondary pe-quick-btn" ' +
                  'data-pe-category="' +
                  escapePersonalExpenseHtml(category) +
                  '" title="' +
                  escapePersonalExpenseHtml(category) +
                  '">' +
                  '<span class="pe-category-icon" aria-hidden="true">' +
                  icon +
                  "</span>" +
                  '<span class="pe-category-name">' +
                  escapePersonalExpenseHtml(category) +
                  "</span>" +
                  "</button>"
               );
            })
            .join("");

         if (grid.dataset.categoryDelegateBound !== "true") {
            grid.dataset.categoryDelegateBound = "true";

            grid.addEventListener("click", function (event) {
               const button = event.target.closest("[data-pe-category]");

               if (!button || !grid.contains(button)) {
                  return;
               }

               selectPersonalExpenseCategory(
                  button.getAttribute("data-pe-category"),
               );
            });
         }
      }
   }

   function showAddPersonalExpenseCategory() {
      const value = window.prompt("Enter new expense category:");

      if (value === null) {
         return;
      }

      const category = String(value || "")
         .trim()
         .replace(/\s+/g, " ");

      if (!category) {
         return;
      }

      const duplicate = personalExpenseCategoryCache.some(function (item) {
         return item.toLowerCase() === category.toLowerCase();
      });

      if (duplicate) {
         selectPersonalExpenseCategory(
            personalExpenseCategoryCache.find(function (item) {
               return item.toLowerCase() === category.toLowerCase();
            }),
         );

         showPersonalExpenseMessage("Category already exists.", "info");

         return;
      }

      google.script.run
         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               showPersonalExpenseMessage(
                  response && response.message
                     ? response.message
                     : "Unable to add category.",
                  "danger",
               );

               return;
            }

            // Update browser cache immediately.
            personalExpenseCategoryCache = response.categories || [];

            populatePersonalExpenseCategories(personalExpenseCategoryCache);

            selectPersonalExpenseCategory(response.category);

            showPersonalExpenseMessage("Category added.", "success");
         })
         .withFailureHandler(function (error) {
            showPersonalExpenseMessage(
               error && error.message ? error.message : String(error),
               "danger",
            );
         })
         .addPersonalExpenseCategory(category);
   }

   /**
    * ==========================================================
    * PERSONAL EXPENSES
    * CLIENT-SIDE SAVE FUNCTIONS
    * ==========================================================
    */

   /**
    * Prevent accidental double-save
    */
   let isSavingPersonalExpense = false;

   function savePersonalExpense() {
      if (isSavingPersonalExpense) {
         return;
      }

      const expenseData = collectPersonalExpenseData();

      const validation = validatePersonalExpenseForm(expenseData);

      if (!validation.success) {
         showPersonalExpenseMessage(validation.message, "danger");

         return;
      }

      const editingField = document.getElementById("personalExpenseEditingId");

      const editingId = editingField
         ? String(editingField.value || "").trim()
         : "";

      const saveButton = document.getElementById("btnSavePersonalExpense");

      isSavingPersonalExpense = true;

      if (saveButton) {
         saveButton.disabled = true;

         saveButton.innerHTML = editingId
            ? '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Updating...'
            : '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Saving...';
      }

      hidePersonalExpenseMessage();

      // ==========================================
      // Common Success Handler
      // ==========================================

      function handleSuccess(response) {
         isSavingPersonalExpense = false;

         if (saveButton) {
            saveButton.disabled = false;

            saveButton.innerHTML = "💾 Save Expense";
         }

         if (!response || response.success !== true) {
            showPersonalExpenseMessage(
               response && response.message
                  ? response.message
                  : "Unable to save expense.",
               "danger",
            );

            return;
         }

         showPersonalExpenseMessage(
            editingId
               ? "Expense updated successfully. ID: " + response.expenseId
               : "Expense saved successfully. ID: " + response.expenseId,
            "success",
         );

         resetPersonalExpenseForm();

         if (editingField) {
            editingField.value = "";
         }

         loadPersonalExpenseBootstrap(true);
      }

      // ==========================================
      // Common Failure Handler
      // ==========================================

      function handleFailure(error) {
         isSavingPersonalExpense = false;

         if (saveButton) {
            saveButton.disabled = false;

            saveButton.innerHTML = editingId
               ? "✏️ Update Expense"
               : "💾 Save Expense";
         }

         const message = error && error.message ? error.message : String(error);

         showPersonalExpenseMessage(
            message || "Unable to save expense.",
            "danger",
         );
      }

      // ==========================================
      // EDIT
      // ==========================================

      if (editingId) {
         google.script.run

            .withSuccessHandler(handleSuccess)

            .withFailureHandler(handleFailure)

            .updatePersonalExpenseFromWeb(editingId, expenseData);

         return;
      }

      // ==========================================
      // NEW EXPENSE
      // ==========================================

      google.script.run

         .withSuccessHandler(handleSuccess)

         .withFailureHandler(handleFailure)

         .savePersonalExpenseFromWeb(expenseData);
   }

   function deletePersonalExpense(expenseId, description, amount) {
      expenseId = String(expenseId || "").trim();

      if (!expenseId) {
         return;
      }

      const amountText = formatPersonalExpenseCurrency(amount);

      const confirmed = confirm(
         "Delete this expense?\n\n" +
            expenseId +
            "\n" +
            description +
            "\n" +
            amountText +
            "\n\n" +
            "It will be removed from expense totals but retained for audit.",
      );

      if (!confirmed) {
         return;
      }

      google.script.run

         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               showPersonalExpenseMessage(
                  response && response.message
                     ? response.message
                     : "Unable to delete expense.",
                  "danger",
               );

               return;
            }

            showPersonalExpenseMessage(
               "Expense deleted. " +
                  expenseId +
                  " can be restored from Deleted Expenses.",
               "warning",
            );

            loadPersonalExpenses();
            loadPersonalExpenseHistory();
         })

         .withFailureHandler(function (error) {
            showPersonalExpenseMessage(
               error && error.message ? error.message : String(error),
               "danger",
            );
         })

         .deletePersonalExpenseFromWeb(expenseId);
   }

   /**

   function escapePersonalExpenseJs(value) {

         .replace(/\\/g, "\\\\")
         .replace(/'/g, "\\'")
         .replace(/\r/g, "")
         .replace(/\n/g, "\\n");
   }

   /**
    * ==========================================================
    * CLIENT-SIDE VALIDATION
    * ==========================================================
    *
    * Server-side validation still exists.
    * This validation simply gives the user faster
    * feedback without waiting for Apps Script.
    *
    * ==========================================================
    */
   function validatePersonalExpenseForm(expenseData) {
      if (!expenseData.expenseDate) {
         focusPersonalExpenseField("personalExpenseDate");

         return {
            success: false,

            message: "Please select Expense Date.",
         };
      }

      if (!expenseData.category) {
         focusPersonalExpenseField("personalExpenseCategory");

         return {
            success: false,

            message: "Please select a Category.",
         };
      }

      if (!expenseData.description) {
         focusPersonalExpenseField("personalExpenseDescription");

         return {
            success: false,

            message: "Please enter Description.",
         };
      }

      const amount = Number(expenseData.amount);

      if (!Number.isFinite(amount) || amount <= 0) {
         focusPersonalExpenseField("personalExpenseAmount");

         return {
            success: false,

            message: "Please enter a valid Amount greater than zero.",
         };
      }

      if (!expenseData.paymentMode) {
         focusPersonalExpenseField("personalExpensePaymentMode");

         return {
            success: false,

            message: "Please select Payment Mode.",
         };
      }

      return {
         success: true,
      };
   }

   /**
    * ==========================================================
    * FOCUS INVALID FIELD
    * ==========================================================
    */
   function focusPersonalExpenseField(elementId) {
      const element = document.getElementById(elementId);

      if (!element) {
         return;
      }

      // Scroll field into view on mobile
      try {
         element.scrollIntoView({
            behavior: "smooth",
            block: "center",
         });
      } catch (error) {
         // Older browser fallback
         element.scrollIntoView();
      }

      // Give scrolling a moment before focus
      setTimeout(function () {
         try {
            element.focus();
         } catch (error) {
            // Ignore focus failure
         }
      }, 250);
   }

      messageBox.style.display = "block";

      // ------------------------------------------

      // ------------------------------------------

      // ------------------------------------------
      // Unit
      // ------------------------------------------

      const unit = document.getElementById("personalExpenseUnit");

      if (unit) {
         unit.value = "";
      }

      // ------------------------------------------
      // Quantity
      // ------------------------------------------

      const quantity = document.getElementById("personalExpenseQuantity");

      if (quantity) {
         quantity.value = "";
      }

      // ------------------------------------------
      // Amount
      // ------------------------------------------

      const amount = document.getElementById("personalExpenseAmount");

      if (amount) {
         amount.value = "";
      }

      // ------------------------------------------
      // Payment Mode
      //
      // Keep UPI as convenient default
      // ------------------------------------------

      const paymentMode = document.getElementById("personalExpensePaymentMode");

      if (paymentMode) {
         paymentMode.value = "UPI";
      }

      // ------------------------------------------
      // Optional Fields
      // ------------------------------------------

      const optionalFields = [
         "personalExpenseSubcategory",

         "personalExpensePaidTo",

         "personalExpenseReference",

         "personalExpenseRemarks",
      ];

      optionalFields.forEach(function (elementId) {
         const element = document.getElementById(elementId);

         if (element) {
            element.value = "";
         }
      });

      // ------------------------------------------
      // Expense For
      // ------------------------------------------

      const expenseFor = document.getElementById("personalExpenseFor");

      if (expenseFor) {
         expenseFor.value = "Self";
      }

      // ------------------------------------------
      // Nature
      // ------------------------------------------

      const nature = document.getElementById("personalExpenseNature");

      if (nature) {
         nature.value = "Expense";
      }

      // ------------------------------------------
      // Recurring
      // ------------------------------------------

      const recurring = document.getElementById("personalExpenseRecurring");

      if (recurring) {
         recurring.value = "No";
      }

      // ------------------------------------------
      // Collapse More Details
      // ------------------------------------------

      const moreDetails = document.getElementById("personalExpenseMoreDetails");

      if (moreDetails && moreDetails.classList.contains("show")) {
         try {
            const collapse =
               bootstrap.Collapse.getOrCreateInstance(moreDetails);

            collapse.hide();
         } catch (error) {
            // Safe fallback if Bootstrap
            // collapse instance is unavailable.

            moreDetails.classList.remove("show");
         }
      }

      // ------------------------------------------
      // Return focus to Category
      //
      // Useful when entering multiple expenses.
      // ------------------------------------------

      if (category) {
         setTimeout(function () {
            try {
               category.focus();
            } catch (error) {
               // Ignore
            }
         }, 150);
      }

      const editingField = document.getElementById("personalExpenseEditingId");

      if (editingField) {
         editingField.value = "";
      }

      const saveButton = document.getElementById("btnSavePersonalExpense");

      if (saveButton) {
         saveButton.innerHTML = "💾 Save Expense";

   /**

   function formatPersonalExpenseCurrency(amount) {
      const value = Number(amount) || 0;

      try {
         return new Intl.NumberFormat("en-IN", {
            style: "currency",
            currency: "INR",
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
         }).format(value);
      } catch (error) {
         return "₹" + value.toFixed(2);
      }
   }

   /**
    * ==========================================
    * ESCAPE HTML
    * ==========================================
    *
    * Important because Description / Paid To / Remarks
    * are user-entered text.
    *
    * Prevents entered HTML from being interpreted
    * as page markup.
    *
    * ==========================================
    */
   function escapePersonalExpenseHtml(value) {
      return String(value === null || value === undefined ? "" : value)
         .replace(/&/g, "&amp;")
         .replace(/</g, "&lt;")
         .replace(/>/g, "&gt;")
         .replace(/"/g, "&quot;")
         .replace(/'/g, "&#039;");
   }

   /**
    * ==========================================
    * Menu Search - Optimized Local Search
    * ==========================================
    */
   function searchMenuItems() {
      const searchBox = document.getElementById("menuSearch");
      const suggestionBox = document.getElementById("menuSuggestions");

      if (!searchBox || !suggestionBox) {
         return;
      }

      const keyword = searchBox.value.trim().toLowerCase();

      if (keyword.length < 2) {
         suggestionBox.innerHTML = "";
         suggestionBox.style.display = "none";

         return;
      }

      const results = [];

      // Search locally and stop after 8 matches
      for (let i = 0; i < menuCache.length; i++) {
         const item = menuCache[i];

         if (!item) {
            continue;
         }

         // Use precomputed searchName when available.
         // Fallback protects against old/unprepared cache objects.
         const searchName =
            item.searchName ||
            String(item.itemName || "")
               .trim()
               .toLowerCase();

         if (searchName.includes(keyword)) {
            results.push(item);

            // Stop scanning immediately
            if (results.length >= 8) {
               break;
            }
         }
      }

      showMenuSuggestions(results);
   }

   /**
    * Add Item To Cart
    */
   function addToCart(itemId) {
      // Find selected item from cache
      const selectedItem = menuCache.find((item) => item.itemId === itemId);

      if (!selectedItem) {
         return;
      }

      // Check if already in cart
      const existingItem = cart.find((item) => item.itemId === itemId);

      if (existingItem) {
         existingItem.qty++;
         refreshCartCalculations();
      } else {
         cart.push({
            itemId: selectedItem.itemId,

            itemName: selectedItem.itemName,

            price: Number(selectedItem.price),

            cost: Number(selectedItem.cost),

            qty: 1,

            lineTotal: Number(selectedItem.price),

            profit: Number(selectedItem.price) - Number(selectedItem.cost),
         });
         refreshCartCalculations();
      }

      // Clear search
      document.getElementById("menuSearch").value = "";

      clearMenuSuggestions();

      renderCart();
   }

   /**
    * Increase Quantity
    */
   function increaseQty(index) {
      cart[index].qty++;

      refreshCartCalculations();

      renderCart();
   }

   /**
    * Decrease Quantity
    */
   function decreaseQty(index) {
      if (!cart[index]) return;
      cart[index].qty--;

      if (cart[index].qty <= 0) {
         cart.splice(index, 1);
      } else {
         refreshCartCalculations();
      }

      renderCart();
   }

   /**
    * Remove Item From Cart
    */
   function removeItem(index) {
      if (index < 0 || index >= cart.length) return;
      cart.splice(index, 1);

      refreshCartCalculations();

      renderCart();
   }

   /**
    * ==========================================
    * Calculate Order Totals
    * ==========================================
    */
   function calculateTotals() {
      // ------------------------------------------
      // Menu Subtotal
      // ------------------------------------------

      const subTotal = cart.reduce(function (total, item) {
         const price = Number(item.price) || 0;
         const qty = Number(item.qty) || 0;

         return total + price * qty;
      }, 0);

      // ------------------------------------------
      // Custom Add-on Total
      // ------------------------------------------

      const addonTotal = getCustomAddonTotal();

      // ------------------------------------------
      // Discount
      // ------------------------------------------

      const discountBox = document.getElementById("discount");

      let discount = discountBox ? parseFloat(discountBox.value) : 0;

      if (!Number.isFinite(discount) || discount < 0) {
         discount = 0;
      }

      /*
       * Maximum discount is limited to:
       *
       * Menu Subtotal + Add-on Total
       *
       * Delivery charge is intentionally excluded
       * from the discountable amount.
       */

      const discountableAmount = subTotal + addonTotal;

      if (discount > discountableAmount) {
         discount = discountableAmount;

         if (discountBox) {
            discountBox.value = discount.toFixed(2);
         }
      }

      // ------------------------------------------
      // Safe Delivery Charge
      // ------------------------------------------

      const safeDeliveryCharge = Number.isFinite(Number(deliveryCharge))
         ? Number(deliveryCharge)
         : 0;

      // ------------------------------------------
      // Grand Total
      // ------------------------------------------

      const grandTotal = subTotal + addonTotal - discount + safeDeliveryCharge;

      // ------------------------------------------
      // UI Elements
      // ------------------------------------------

      const subTotalEl = document.getElementById("subTotal");

      const addonTotalEl = document.getElementById("addonTotalDisplay");

      const deliveryEl = document.getElementById("deliveryCharge");

      const grandEl = document.getElementById("grandTotal");

      // ------------------------------------------
      // Update UI
      // ------------------------------------------

      if (subTotalEl) {
         subTotalEl.innerText = "₹" + subTotal.toFixed(2);
      }

      if (addonTotalEl) {
         addonTotalEl.textContent = "₹" + addonTotal.toFixed(2);
      }

      if (deliveryEl) {
         deliveryEl.innerText = "₹" + safeDeliveryCharge.toFixed(2);
      }

      if (grandEl) {
         grandEl.innerText = "₹" + grandTotal.toFixed(2);
      }
   }

   /**
    * ==========================================
    * Collect Complete Order Data
    * ==========================================
    */
   function collectOrderData() {
      const getValue = function (id) {
         const element = document.getElementById(id);

         if (!element) {
            return "";
         }

         return element.value;
      };

      // ------------------------------------------
      // Customer
      // ------------------------------------------

      const customer = {
         customerName: getValue("customerName").trim(),

         mobile: getValue("mobile").trim(),

         deliveryArea: getValue("deliveryArea"),

         houseAddress: getValue("houseAddress").trim(),

         deliverySlot: getValue("deliverySlot"),
      };

      // ------------------------------------------
      // Order
      // ------------------------------------------

      const order = {
         orderType: getValue("orderType"),

         specialInstructions: getValue("specialInstructions").trim(),
      };

      // ------------------------------------------
      // Payment
      // ------------------------------------------

      const payment = {
         paymentMode: getValue("paymentMode"),

         paymentStatus: getValue("paymentStatus") || "Pending",
      };

      // ------------------------------------------
      // Menu Subtotal
      // ------------------------------------------

      const subTotal = cart.reduce(function (sum, item) {
         const price = Number(item.price) || 0;

         const qty = Number(item.qty) || 0;

         return sum + price * qty;
      }, 0);

      // ------------------------------------------
      // Add-on Total
      // ------------------------------------------

      const addonTotal = getCustomAddonTotal();

      // ------------------------------------------
      // Discount
      // ------------------------------------------

      let discount = parseFloat(getValue("discount"));

      if (!Number.isFinite(discount) || discount < 0) {
         discount = 0;
      }

      const discountableAmount = subTotal + addonTotal;

      if (discount > discountableAmount) {
         discount = discountableAmount;
      }

      // ------------------------------------------
      // Delivery Charge
      // ------------------------------------------

      const safeDeliveryCharge = Number.isFinite(Number(deliveryCharge))
         ? Number(deliveryCharge)
         : 0;

      // ------------------------------------------
      // Grand Total
      // ------------------------------------------

      const grandTotal = subTotal + addonTotal - discount + safeDeliveryCharge;

      // ------------------------------------------
      // Totals
      // ------------------------------------------

      const totals = {
         subTotal: subTotal,

         addonTotal: addonTotal,

         discount: discount,

         deliveryCharge: safeDeliveryCharge,

         grandTotal: grandTotal,
      };

      // ------------------------------------------
      // Meta
      // ------------------------------------------

      const meta = {
         orderDate: getValue("orderDate"),

         source: "WEB",
      };

      // ------------------------------------------
      // Final Payload
      // ------------------------------------------

      return {
         customer: customer,

         order: order,

         payment: payment,

         totals: totals,

         cart: cart.map(function (item) {
            return { ...item };
         }),

         customAddons: customAddons.map(function (addon) {
            return {
               name: String(addon.name || "").trim(),

               price: Number(addon.price) || 0,
            };
         }),

         meta: meta,
      };
   }

   /**
    * Enable / Disable Discount Field
    */
   function updateDiscountState() {
      const area = document.getElementById("deliveryArea");
      const discountInput = document.getElementById("discount");

      if (!discountInput) return;

      if (cart.length === 0) {
         deliveryCharge = 0;

         if (area) {
            area.value = "";
         }

         discountInput.value = 0;
         discountInput.disabled = true;
      } else {
         discountInput.disabled = false;
      }
   }

   /**

   function populatePOSDropdowns() {

      }
   }

   /**
    * Update Delivery Charge
    */
   function updateDeliveryCharge() {
      const area = document.getElementById("deliveryArea").value;

      if (!area) {
         deliveryCharge = 0;

         calculateTotals();

         return;
      }

      const found = appSettings.deliveryAreas.find((x) => x.area === area);

      deliveryCharge = found ? Number(found.charge) : 0;

      calculateTotals();
   }

   /**
    * Fill Select Box
    */
   function fillSelect(id, values) {
      const select = document.getElementById(id);

      if (!select) return;

      if (!Array.isArray(values)) {
         console.warn(id + " has no values.");
         return;
      }

      // Skip rebuilding if already populated
      if (select.options.length > 1) {
         return;
      }

      let html = "";

      if (id === "deliveryArea") {
         html += `<option value="" selected>Select Delivery Area</option>`;
      }

      values.forEach(function (value) {
         html += `<option value="${value}">${value}</option>`;
      });

      select.innerHTML = html;
   }

   /**

    */
   function addQuickNote(note) {
      const box = document.getElementById("specialInstructions");

      if (!box) return;

      const current = box.value.trim();

      if (current.includes(note)) {
         return;
      }

      if (current === "") {
         box.value = note;
      } else {
         box.value += ", " + note;
      }
   }

        `;

   /**
    * Update Cart Calculations
    */
   function refreshCartCalculations() {
      cart.forEach((item) => {
         item.lineTotal = item.qty * item.price;

         item.profit = (item.price - item.cost) * item.qty;
      });
   }

   /**
    * ==========================================
    * Save Order
    * ==========================================
    */
   function saveOrder() {
      // ------------------------------------------
      // Prevent Double Click / Duplicate Save
      // ------------------------------------------

      if (isSavingOrder) {
         return;
      }

      // ------------------------------------------
      // Collect Order Data
      // ------------------------------------------

      const orderData = collectOrderData();

      // ------------------------------------------
      // Lock Save
      // ------------------------------------------

      isSavingOrder = true;

      const saveButton = document.getElementById("btnSaveOrder");

      if (saveButton) {
         saveButton.disabled = true;

         saveButton.innerHTML =
            '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Saving...';
      }

      // ------------------------------------------
      // Send Order To Server
      // ------------------------------------------

      google.script.run

         .withSuccessHandler(function (response) {
            // ----------------------------------
            // Unlock Save
            // ----------------------------------

            isSavingOrder = false;

            if (response && response.success) {
               // ----------------------------------
               // Clear POS Immediately
               // ----------------------------------

               clearPOSForm();

               // ----------------------------------
               // Restore Save Button
               // ----------------------------------

               if (saveButton) {
                  saveButton.disabled = false;

                  saveButton.innerHTML = "💾 Save Order";
               }

               // ----------------------------------
               // Success Message
               // ----------------------------------

               alert(
                  "Order Saved Successfully\n\n" +
                     "Order ID : " +
                     response.orderId,
               );
            } else {
               // ----------------------------------
               // Restore Save Button
               // ----------------------------------

               if (saveButton) {
                  saveButton.disabled = false;

                  saveButton.innerHTML = "💾 Save Order";
               }

               // ----------------------------------
               // Server Validation / Save Error
               // ----------------------------------

               alert(
                  response && response.message
                     ? response.message
                     : "Unable to save order.",
               );
            }
         })

         .withFailureHandler(function (error) {
            // ----------------------------------
            // Unlock Save
            // ----------------------------------

            isSavingOrder = false;

            // ----------------------------------
            // Restore Save Button
            // ----------------------------------

            if (saveButton) {
               saveButton.disabled = false;

               saveButton.innerHTML = "💾 Save Order";
            }

            // ----------------------------------
            // Unexpected Server Error
            // ----------------------------------

            console.error("Save Order Error:", error);

            alert(
               error && error.message ? error.message : "Unable to save order.",
            );
         })

         .saveOrderFromWeb(orderData);
   }

   function searchPurchaseItems() {
      const keyword = document
         .getElementById("itemSearch")
         .value.trim()
         .toLowerCase();

      if (keyword.length === 0) {
         clearPurchaseSuggestions();

         return;
      }

      const items = purchaseItemsCache
         .filter((item) => item.searchName.includes(keyword))
         .slice(0, 15);

      showPurchaseSuggestions(items);
   }

   /**
    * ==========================================
    * Show Purchase Suggestions
    * ==========================================
    */
   function showPurchaseSuggestions(items) {
      const keyword = document.getElementById("itemSearch").value.trim();

      const suggestionBox = document.getElementById("itemSuggestions");

      if (!suggestionBox) return;

      // Build suggestions in memory
      let html = items
         .map(
            (item) => `
      <button
         type="button"
         class="list-group-item list-group-item-action"
         onclick="selectPurchaseItem('${item.itemName.replace(/'/g, "\\'")}')">

         ${item.itemName}

      </button>
   `,
         )
         .join("");

      // Check if exact item already exists (Case Insensitive)
      const exactMatch = items.some(
         (item) => item.itemName.toLowerCase() === keyword.toLowerCase(),
      );

      // Show Add New Item option
      if (keyword !== "" && !exactMatch) {
         html += `
         <button
            type="button"
            class="list-group-item list-group-item-action text-success fw-bold border-top"
            onclick="addNewPurchaseItem()">

            ➕ Add "${keyword}"

         </button>
      `;
      }

      // Single DOM update
      suggestionBox.innerHTML = html;
   }

   /**
    * ==========================================
    * Add New Purchase Item
    * ==========================================
    */
   function addNewPurchaseItem() {
      const itemName = document.getElementById("itemSearch").value.trim();

      if (!itemName) return;

      google.script.run

         .withSuccessHandler(function (response) {
            // If item already exists or newly created,
            // make sure it exists in local cache only once.
            const exists = purchaseItemsCache.some(
               (item) =>
                  item.itemName.toLowerCase() ===
                  response.itemName.toLowerCase(),
            );

            if (!exists) {
               purchaseItemsCache.push({
                  itemName: response.itemName,

                  searchName: response.itemName.toLowerCase(),
               });
            }

            // Select the item
            document.getElementById("itemSearch").value = response.itemName;

            clearPurchaseSuggestions();

            selectPurchaseItem(response.itemName);
         })

         .withFailureHandler(function (error) {
            alert(error.message || error);
         })

         .addPurchaseItem(itemName);
   }

      // ===========================

      document.getElementById("invOrderId").innerText = order.orderId;

         rows += `

            <td class="text-center">${item.qty}</td>

            <td class="text-end">₹${item.price.toFixed(2)}</td>

      // ===========================
      // Totals

         "₹" + subtotal.toFixed(2);

      // Custom Add-ons
      // ===========================

      const addonsText = document.getElementById("invAddons");

      const addonTotalElement = document.getElementById("invAddonTotal");

      const addons = String(order.addons || "").trim();

      const addonTotal = Number(order.addonTotal || 0);

      if (addons && addonTotal > 0) {
         if (addonsRow) {
            addonsRow.style.display = "";

   /**
    * ==========================================
    * Download Invoice PDF
    * Compact A4 / Mobile Safe Version
    * ==========================================
    */
   async function downloadInvoicePdf() {
      const orderId = document.getElementById("invOrderId").innerText.trim();

      if (!orderId || orderId === "-") {
         alert("Please search an invoice first.");

         return;
      }

      const btn = document.getElementById("btnDownloadPdf");

      if (btn) {
         btn.disabled = true;

         btn.innerHTML = "Generating PDF...";
      }

      try {
         const today = new Date();

         const fileDate =
            today.getFullYear() +
            "-" +
            String(today.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(today.getDate()).padStart(2, "0");

         const fileName = orderId + "_" + fileDate + ".pdf";

         // Generate PDF ONCE
         const pdfBlob = await buildInvoicePdfBlob();

         // ==========================================
         // DOWNLOAD
         // ==========================================

         const downloadUrl = URL.createObjectURL(pdfBlob);

         const link = document.createElement("a");

         link.href = downloadUrl;

         link.download = fileName;

         document.body.appendChild(link);

         link.click();

         link.remove();

         setTimeout(function () {
            URL.revokeObjectURL(downloadUrl);
         }, 3000);

         // ==========================================
         // SAVE SAME PDF TO DRIVE
         // ==========================================

         const base64Pdf = await blobToBase64(pdfBlob);

         google.script.run

            .withSuccessHandler(function (response) {
               console.log("PDF saved to Drive", response);
            })

            .withFailureHandler(function (error) {
               console.error("Unable to save PDF to Drive:", error);
            })

            .savePdf(fileName, base64Pdf);
      } catch (error) {
         console.error("Invoice PDF Error:", error);

         alert("Unable to generate invoice PDF.");
      } finally {
         if (btn) {
            btn.disabled = false;

            btn.innerHTML = "📄 Download PDF";
         }
      }
   }

   /**
    * ==========================================
    * Convert Blob to Base64 (FIXED)
    * ==========================================
    */
   function blobToBase64(blob) {
      return new Promise(function (resolve, reject) {
         const reader = new FileReader();

         reader.onload = function () {
            // Split the Data URL and return ONLY the raw Base64 string
            const base64Data = reader.result.split(",")[1];
            resolve(base64Data);
         };

         reader.onerror = reject;

         reader.readAsDataURL(blob);
      });
   }

function initializeReports() {
      console.log("Reports Module Loaded");

      const today = getToday();
      const fromDate = document.getElementById("reportFromDate");
      const toDate = document.getElementById("reportToDate");

      // Ghost Element Check: Exit if user navigated away
      if (!fromDate || !toDate) {
         return; 
      }

      // Set default values
      fromDate.value = today;
      toDate.value = today;

      // Restrict future dates
      fromDate.max = today;
      toDate.max = today;

      // Prevent To Date from being earlier than From Date
      toDate.min = fromDate.value;

      // From Date Change
      fromDate.addEventListener("change", function () {
         toDate.min = this.value;
         if (toDate.value < this.value) {
            toDate.value = this.value;
         }
         const btn = document.getElementById("btnDownloadPDF");
         if (btn) btn.disabled = true;
      });

      // To Date Change
      toDate.addEventListener("change", function () {
         fromDate.max = this.value > today ? today : this.value;
         if (fromDate.value > this.value) {
            fromDate.value = this.value;
         }
         const btn = document.getElementById("btnDownloadPDF");
         if (btn) btn.disabled = true;
      });

      google.script.run
         .withSuccessHandler(renderReportDashboard)
         .withFailureHandler(function (error) {
            console.error(error);
         })
         .getReportsData(today, today);
   }

   function deleteOrder() {
      const orderIdBox = document.getElementById("deleteOrderId");

      const deleteButton = document.getElementById("btnDeleteOrder");

      // ------------------------------------------
      // Validate Order ID
      // ------------------------------------------

      if (!orderIdBox) {
         alert("Delete Order field not found.");

         return;
      }

      const orderId = String(orderIdBox.value || "")
         .trim()
         .toUpperCase();

      if (!orderId) {
         alert("Please enter an Order ID.");

         orderIdBox.focus();

         return;
      }

      // ------------------------------------------
      // Confirmation
      // ------------------------------------------

      const confirmed = confirm(
         "Delete Order " +
            orderId +
            "?\n\n" +
            "This will permanently delete the order and its " +
            "order items and recalculate the customer's order history.",
      );

      if (!confirmed) {
         return;
      }

      // ------------------------------------------
      // Lock Delete Button
      // ------------------------------------------

      if (deleteButton) {
         deleteButton.disabled = true;

         deleteButton.textContent = "Deleting...";
      }

      // ------------------------------------------
      // Server Request
      // ------------------------------------------

      google.script.run

         .withSuccessHandler(function (response) {
            if (deleteButton) {
               deleteButton.disabled = false;

               deleteButton.textContent = "Delete Order";
            }

            if (response && response.success) {
               orderIdBox.value = "";

               alert(
                  "Order Deleted Successfully\n\n" + "Order ID : " + orderId,
               );
            } else {
               alert(
                  response && response.message
                     ? response.message
                     : "Unable to delete order.",
               );
            }
         })

         .withFailureHandler(function (error) {
            if (deleteButton) {
               deleteButton.disabled = false;

               deleteButton.textContent = "Delete Order";
            }

            console.error("Delete Order Error:", error);

            alert(
               error && error.message
                  ? error.message
                  : "Unable to delete order.",
            );
         })

         .deleteOrderFromWeb(orderId);

   /**
    * ==========================================================
    * ESCAPE ADD-ON HTML
    * ==========================================================
    *
    * Prevents user-entered Add-on names from being interpreted
    * as HTML when displayed.
    * ==========================================================
    */
   function escapeAddonHtml(value) {
      return String(value || "")
         .replace(/&/g, "&amp;")

         .replace(/</g, "&lt;")

         .replace(/>/g, "&gt;")

         .replace(/"/g, "&quot;")

         .replace(/'/g, "&#039;");
   }

   function optimizeMobileControls(root) {
      if (!window.matchMedia("(max-width: 768px), (pointer: coarse)").matches)
         return;

      const scope = root && root.querySelectorAll ? root : document;
      const inputs = scope.querySelectorAll("input");

      for (let i = 0; i < inputs.length; i++) {
         const input = inputs[i];
         const type = String(input.type || "").toLowerCase();

         if (type === "number" && !input.hasAttribute("inputmode")) {
            input.setAttribute("inputmode", "decimal");
         } else if (type === "tel" && !input.hasAttribute("inputmode")) {
            input.setAttribute("inputmode", "tel");
         }
      }
   }
