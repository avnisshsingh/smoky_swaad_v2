<script>
   /* ==========================================
   Global Variables
========================================== */

   let cart = [];
   let menuCache = [];
   let customerCache = [];
   let appSettings = {};
   let deliveryCharge = 0;
   let purchaseSettings = {};
   let selectedPurchaseItem = null;
   let isSavingOrder = false;
   let isSavingPurchase = false;
   let purchaseItemsCache = [];
   let menuSearchTimer = null;
   let customAddons = [];

   function getToday() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
   }

   const QUICK_NOTES = [
      "Less Spicy",
      "Extra Spicy",
      "No Onion",
      "No Garlic",
      "Extra Gravy",
      "Less Oil",
      "Call Customer",
      "Ring Bell",
   ];

   /* ==========================================
   Application Startup
========================================== */
   document.addEventListener("DOMContentLoaded", initApp);

   function initApp() {
      console.log("Smoky Swaad ERP Started");
      bindMenuEvents();
      injectMobileSmoothStyles();

      const defaultMenu = document.querySelector(
         '.menu-link[data-screen="POS"]',
      );

      if (defaultMenu) {
         setActiveMenu(defaultMenu);
      }

      openScreen("POS");
   }

   /**
    * ==========================================
    * MOBILE VIEWPORT & BUTTER-SMOOTH UI ENHANCEMENTS
    * ==========================================
    */
   function injectMobileSmoothStyles() {
      if (document.getElementById("smokySmoothMobileStyle")) return;
      const style = document.createElement("style");
      style.id = "smokySmoothMobileStyle";
      style.textContent = `
         @media (max-width: 768px) {
            /* Prevent iOS auto-zoom on input focus by maintaining 16px minimum font size */
            input.form-control, select.form-select, textarea.form-control {
               font-size: 16px !important;
            }
            /* Enhance touch targets for buttons on mobile viewports */
            .btn-sm {
               padding: 0.4rem 0.75rem !important;
               font-size: 0.875rem !important;
            }
            /* Smooth scrolling and momentum on mobile wrappers */
            .table-responsive {
               -webkit-overflow-scrolling: touch;
            }
            /* Fluid spacing for mobile card blocks */
            #purchaseMobileList .border {
               transition: transform 0.1s ease, box-shadow 0.1s ease;
            }
            #purchaseMobileList .border:active {
               transform: scale(0.99);
            }
         }
      `;
      document.head.appendChild(style);
   }

   /* ==========================================
   Navigation
========================================== */

   function bindMenuEvents() {
      const menuLinks = document.querySelectorAll(".menu-link");

      menuLinks.forEach((link) => {
         link.addEventListener("click", function (e) {
            e.preventDefault();
            const screen = this.dataset.screen;
            setActiveMenu(this);
            openScreen(screen);
         });
      });
   }

   function openScreen(screen) {
      google.script.run
         .withSuccessHandler(function (html) {
            document.getElementById("content").innerHTML = html;
            document.title = "Smoky Swaad ERP - " + screen;

            optimizeMobileControls(document.getElementById("content"));

            if (
               window.matchMedia("(max-width: 768px), (pointer: coarse)")
                  .matches
            ) {
               document.getElementById("main-content").scrollTop = 0;
               window.scrollTo(0, 0);
            }

            if (screen === "POS") {
               setTimeout(function () {
                  loadPOSCache();
                  const orderDate = document.getElementById("orderDate");
                  if (orderDate) {
                     orderDate.value = getToday();
                  }
               }, 100);
            } else if (screen === "Purchase") {
               setTimeout(function () {
                  if (document.getElementById("purchaseDate")) {
                     initializePurchase();
                  }
               }, 100);
            } else if (screen === "Invoice") {
               setTimeout(function () {
                  initializeInvoice();
               }, 100);
            } else if (screen === "Reports") {
               setTimeout(function () {
                  initializeReports();
               }, 100);
            } else if (screen === "PersonalExpenses") {
               setTimeout(function () {
                  initializePersonalExpenses();
               }, 100);
            } else if (screen === "CostsAndPricing") {
               setTimeout(function () {
                  initializePricingCalculator();
                  initializeBusinessCosts();
               }, 100);
            }
         })
         .loadScreen(screen);
   }

   /* ==========================================
   PERSONAL EXPENSES & OTHER MODULES
   ========================================== */
   let personalExpenseDescriptionCache = [];
   let personalExpenseDescriptionMap = Object.create(null);
   let personalExpenseHistoryCache = [];
   let personalExpenseCategoryCache = [];
   let personalExpenseBootstrapLoaded = false;
   let personalExpenseDom = Object.create(null);
   let personalExpenseLastHistorySignature = "";
   let personalExpenseLastDescriptionQuery = "";
   let personalExpenseLastDescriptionHtml = "";
   let personalExpenseVisibleDescriptionMatches = [];

   function cachePersonalExpenseDom() {
      const ids = [
         "personalExpenseDate",
         "personalExpensePaymentMode",
         "personalExpenseFor",
         "personalExpenseNature",
         "personalExpenseRecurring",
         "personalExpenseHistoryMonth",
         "personalExpenseHistoryCategory",
         "personalExpenseHistorySearch",
         "personalExpenseUnit",
         "personalExpenseQuantityList",
         "personalExpenseDescription",
         "personalExpenseDescriptionSuggestions",
         "personalExpenseCategory",
         "personalExpenseQuantity",
         "personalExpenseQuickCategoryGrid",
         "personalExpenseEditingId",
         "btnSavePersonalExpense",
      ];

      personalExpenseDom = Object.create(null);
      for (let i = 0; i < ids.length; i++) {
         personalExpenseDom[ids[i]] = document.getElementById(ids[i]);
      }
   }

   function peEl(id) {
      return personalExpenseDom[id] || document.getElementById(id);
   }

   function initializePersonalExpenses() {
      cachePersonalExpenseDom();
      personalExpenseLastHistorySignature = "";
      personalExpenseLastDescriptionQuery = "";
      personalExpenseLastDescriptionHtml = "";
      personalExpenseVisibleDescriptionMatches = [];

      const dateInput = peEl("personalExpenseDate");
      if (dateInput) dateInput.value = getToday();

      const paymentMode = peEl("personalExpensePaymentMode");
      if (paymentMode) paymentMode.value = "UPI";

      const expenseFor = peEl("personalExpenseFor");
      if (expenseFor) expenseFor.value = "Self";

      const nature = peEl("personalExpenseNature");
      if (nature) nature.value = "Expense";

      const recurring = peEl("personalExpenseRecurring");
      if (recurring) recurring.value = "No";

      const historyMonth = peEl("personalExpenseHistoryMonth");
      if (historyMonth && !historyMonth.value) {
         historyMonth.value = getToday().slice(0, 7);
      }

      registerPersonalExpenseSmartDescription();
      registerPersonalExpenseLocalHistoryFilters();
      loadPersonalExpenseBootstrap();
   }

   function loadPersonalExpenseBootstrap(forceRefresh) {
      google.script.run
         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               console.error("Expense bootstrap failed");
               return;
            }

            personalExpenseBootstrapLoaded = true;
            updatePersonalExpenseSummary(response.summary || {});
            populatePersonalExpenseUnits(response.units || []);

            personalExpenseCategoryCache = Array.isArray(response.categories)
               ? response.categories
               : [];
            populatePersonalExpenseCategories(personalExpenseCategoryCache);

            personalExpenseDescriptionCache = Array.isArray(
               response.descriptions,
            )
               ? response.descriptions
               : [];

            preparePersonalExpenseDescriptionSearchCache();
            populatePersonalExpenseQuantitySuggestions();

            personalExpenseHistoryCache = Array.isArray(response.history)
               ? response.history
               : [];

            for (let i = 0; i < personalExpenseHistoryCache.length; i++) {
               const expense = personalExpenseHistoryCache[i];
               expense._month = String(expense.expenseDateKey || "").slice(
                  0,
                  7,
               );
               expense._category = String(expense.category || "");
               expense._isExpense =
                  String(expense.nature || "").toLowerCase() === "expense";
               expense._amount = Number(expense.amount || 0);
               expense._search = [
                  expense.expenseId,
                  expense.description,
                  expense.category,
                  expense.subcategory,
                  expense.paidTo,
                  expense.referenceNo,
                  expense.remarks,
                  expense.unit,
                  expense.quantity,
               ]
                  .join(" ")
                  .toLowerCase();
            }

            personalExpenseLastHistorySignature = "";
            renderPersonalExpenseHistoryFromCache();
         })
         .withFailureHandler(function (error) {
            console.error("Expense bootstrap server failure:", error);
         })
         .getPersonalExpenseBootstrapData();
   }

   function registerPersonalExpenseLocalHistoryFilters() {
      const ids = [
         "personalExpenseHistoryMonth",
         "personalExpenseHistoryCategory",
         "personalExpenseHistorySearch",
      ];

      ids.forEach(function (id) {
         const element = document.getElementById(id);
         if (!element || element.dataset.localFilterBound === "true") return;

         element.dataset.localFilterBound = "true";
         const eventName = element.tagName === "INPUT" ? "input" : "change";
         let timer = null;

         element.addEventListener(eventName, function () {
            if (timer) clearTimeout(timer);
            timer = setTimeout(function () {
               renderPersonalExpenseHistoryFromCache();
            }, 80);
         });
      });
   }

   function renderPersonalExpenseHistoryFromCache() {
      if (!personalExpenseBootstrapLoaded) return;

      const monthEl = peEl("personalExpenseHistoryMonth");
      const categoryEl = peEl("personalExpenseHistoryCategory");
      const searchEl = peEl("personalExpenseHistorySearch");

      const month = monthEl ? String(monthEl.value || "") : "";
      const category = categoryEl ? String(categoryEl.value || "") : "";
      const search = searchEl
         ? String(searchEl.value || "")
              .trim()
              .toLowerCase()
         : "";

      const signature =
         month +
         "\u0001" +
         category +
         "\u0001" +
         search +
         "\u0001" +
         personalExpenseHistoryCache.length;
      if (signature === personalExpenseLastHistorySignature) return;

      personalExpenseLastHistorySignature = signature;
      const filtered = [];
      let total = 0;

      for (let i = 0; i < personalExpenseHistoryCache.length; i++) {
         const expense = personalExpenseHistoryCache[i];
         if (month && expense._month !== month) continue;
         if (category && expense._category !== category) continue;
         if (search && expense._search.indexOf(search) === -1) continue;

         filtered.push(expense);
         if (expense._isExpense) total += expense._amount;
      }

      // Sort by date/time of addition (Newest first using expenseId)
      filtered.sort(function (a, b) {
         return String(b.expenseId || "").localeCompare(String(a.expenseId || ""), undefined, { numeric: true });
      });

      renderPersonalExpenses(filtered);

      const info = document.getElementById("personalExpenseHistoryInfo");
      if (info) {
         info.textContent =
            filtered.length +
            (filtered.length === 1 ? " transaction" : " transactions") +
            " • Total " +
            formatPersonalExpenseCurrency(total);
      }
   }

   function populatePersonalExpenseUnits(units) {
      const select = document.getElementById("personalExpenseUnit");
      if (!select) return;
      const currentValue = String(select.value || "").trim();
      let html = '<option value="">Select Unit</option>';

      (Array.isArray(units) ? units : []).forEach(function (unit) {
         unit = String(unit || "").trim();
         if (!unit) return;
         html +=
            '<option value="' +
            escapePersonalExpenseHtml(unit) +
            '">' +
            escapePersonalExpenseHtml(unit) +
            "</option>";
      });

      select.innerHTML = html;
      if (currentValue) select.value = currentValue;
   }

   function preparePersonalExpenseDescriptionSearchCache() {
      personalExpenseDescriptionCache = personalExpenseDescriptionCache
         .map(function (item) {
            const description = String(item.description || "").trim();
            return {
               description: description,
               category: String(item.category || "").trim(),
               quantity:
                  item.quantity === null || item.quantity === undefined
                     ? ""
                     : String(item.quantity).trim(),
               unit: String(item.unit || "").trim(),
               searchText: description.toLowerCase(),
            };
         })
         .filter(function (item) {
            return item.description !== "";
         });

      personalExpenseDescriptionMap = Object.create(null);
      personalExpenseDescriptionCache.forEach(function (item) {
         personalExpenseDescriptionMap[item.description.toLowerCase()] = item;
      });
   }

   function populatePersonalExpenseQuantitySuggestions() {
      const list = peEl("personalExpenseQuantityList");
      if (!list) return;
      const seen = Object.create(null);
      const html = [];

      for (let i = 0; i < personalExpenseDescriptionCache.length; i++) {
         const value = String(
            personalExpenseDescriptionCache[i].quantity || "",
         ).trim();
         if (!value || seen[value]) continue;
         seen[value] = true;
         html.push(
            '<option value="' +
               escapePersonalExpenseHtml(value) +
               '"></option>',
         );
      }
      list.innerHTML = html.join("");
   }

   function registerPersonalExpenseSmartDescription() {
      const input = peEl("personalExpenseDescription");
      if (!input || input.dataset.smartSearchBound === "true") return;

      input.dataset.smartSearchBound = "true";
      let searchTimer = null;

      input.addEventListener("input", function () {
         if (searchTimer) clearTimeout(searchTimer);
         searchTimer = setTimeout(function () {
            showPersonalExpenseDescriptionSuggestions(input.value);
            applyPersonalExpenseSmartCategory();
         }, 80);
      });

      input.addEventListener("focus", function () {
         if (String(input.value || "").trim().length >= 2) {
            showPersonalExpenseDescriptionSuggestions(input.value);
         }
      });

      input.addEventListener("keydown", function (event) {
         if (event.key === "Escape")
            hidePersonalExpenseDescriptionSuggestions();
      });
   }

   function showPersonalExpenseDescriptionSuggestions(query) {
      const box = peEl("personalExpenseDescriptionSuggestions");
      if (!box) return;

      const search = String(query || "")
         .trim()
         .toLowerCase();
      if (search.length < 2) {
         hidePersonalExpenseDescriptionSuggestions();
         return;
      }

      if (
         search === personalExpenseLastDescriptionQuery &&
         box.style.display === "block"
      )
         return;
      personalExpenseLastDescriptionQuery = search;

      const startsWith = [];
      const contains = [];

      for (let i = 0; i < personalExpenseDescriptionCache.length; i++) {
         const item = personalExpenseDescriptionCache[i];
         const position = item.searchText.indexOf(search);
         if (position === 0) {
            if (startsWith.length < 6) startsWith.push(item);
         } else if (position > 0 && contains.length < 6) {
            contains.push(item);
         }
         if (startsWith.length >= 6 && contains.length >= 6) break;
      }

      const matches = [];
      for (let i = 0; i < startsWith.length && matches.length < 6; i++)
         matches.push(startsWith[i]);
      for (let i = 0; i < contains.length && matches.length < 6; i++)
         matches.push(contains[i]);

      personalExpenseVisibleDescriptionMatches = matches;
      let html = "";

      if (!matches.length) {
         html =
            '<div class="list-group-item text-muted small">No previous match — continue typing to add a new description.</div>';
      } else {
         const parts = [];
         for (let i = 0; i < matches.length; i++) {
            const item = matches[i];
            let detail = "";
            if (item.category) detail = item.category;
            if (item.quantity) {
               const quantityText =
                  item.quantity + (item.unit ? " " + item.unit : "");
               detail = detail ? detail + " • " + quantityText : quantityText;
            } else if (item.unit) {
               detail = detail ? detail + " • " + item.unit : item.unit;
            }

            parts.push(
               '<button type="button" class="list-group-item list-group-item-action pe-description-result" data-pe-index="' +
                  i +
                  '">' +
                  '<div class="fw-semibold">' +
                  escapePersonalExpenseHtml(item.description) +
                  "</div>" +
                  (detail
                     ? '<div class="small text-muted">' +
                       escapePersonalExpenseHtml(detail) +
                       "</div>"
                     : "") +
                  "</button>",
            );
         }
         html = parts.join("");
      }

      if (html !== personalExpenseLastDescriptionHtml) {
         box.innerHTML = html;
         personalExpenseLastDescriptionHtml = html;
      }
      box.style.display = "block";

      if (box.dataset.resultDelegateBound !== "true") {
         box.dataset.resultDelegateBound = "true";
         box.addEventListener("click", function (event) {
            const button = event.target.closest(".pe-description-result");
            if (!button || !box.contains(button)) return;
            const index = Number(button.dataset.peIndex);
            const selected = personalExpenseVisibleDescriptionMatches[index];
            if (selected) selectPersonalExpenseDescription(selected);
         });
      }
   }

   function selectPersonalExpenseDescription(item) {
      const description = peEl("personalExpenseDescription");
      const category = document.getElementById("personalExpenseCategory");
      const quantity = peEl("personalExpenseQuantity");
      const unit = peEl("personalExpenseUnit");

      if (description) description.value = item.description || "";
      if (category && item.category) category.value = item.category;
      if (quantity) quantity.value = item.quantity || "";
      if (unit) unit.value = item.unit || "";

      hidePersonalExpenseDescriptionSuggestions();
      if (quantity) quantity.focus();
   }

   function hidePersonalExpenseDescriptionSuggestions() {
      const box = peEl("personalExpenseDescriptionSuggestions");
      if (!box) return;
      box.style.display = "none";
      personalExpenseLastDescriptionQuery = "";
   }

   document.addEventListener("click", function (event) {
      const input = peEl("personalExpenseDescription");
      const box = peEl("personalExpenseDescriptionSuggestions");
      if (!input || !box) return;
      if (event.target !== input && !box.contains(event.target)) {
         hidePersonalExpenseDescriptionSuggestions();
      }
   });

   function applyPersonalExpenseSmartCategory() {
      const input = peEl("personalExpenseDescription");
      const category = document.getElementById("personalExpenseCategory");
      if (!input || !category) return;

      const key = String(input.value || "")
         .trim()
         .toLowerCase();
      if (!key) return;

      const remembered = personalExpenseDescriptionMap[key];
      if (!remembered) return;

      if (remembered.category) category.value = remembered.category;
      const quantity = peEl("personalExpenseQuantity");
      if (quantity) quantity.value = remembered.quantity || "";
      const unit = peEl("personalExpenseUnit");
      if (unit) unit.value = remembered.unit || "";
   }

   function getPersonalExpenseCategoryIcon(category) {
      const key = String(category || "")
         .trim()
         .toLowerCase();
      return PERSONAL_EXPENSE_CATEGORY_ICONS[key] || "📌";
   }

   function populatePersonalExpenseCategories(categories) {
      const source = Array.isArray(categories) ? categories : [];
      const clean = [];
      const seenCategories = Object.create(null);

      for (let i = 0; i < source.length; i++) {
         const value = String(source[i] || "").trim();
         if (!value) continue;
         const key = value.toLowerCase();
         if (seenCategories[key]) continue;
         seenCategories[key] = true;
         clean.push(value);
      }

      clean.sort(function (a, b) {
         return a.localeCompare(b, undefined, {
            sensitivity: "base",
            numeric: true,
         });
      });

      personalExpenseCategoryCache = clean;
      const categorySelect = document.getElementById("personalExpenseCategory");
      const historySelect = document.getElementById(
         "personalExpenseHistoryCategory",
      );

      const currentCategory = categorySelect
         ? String(categorySelect.value || "")
         : "";
      const currentHistory = historySelect
         ? String(historySelect.value || "")
         : "";

      const options = clean
         .map(function (category) {
            const icon = getPersonalExpenseCategoryIcon(category);
            return (
               '<option value="' +
               escapePersonalExpenseHtml(category) +
               '">' +
               icon +
               " " +
               escapePersonalExpenseHtml(category) +
               "</option>"
            );
         })
         .join("");

      if (categorySelect) {
         categorySelect.innerHTML =
            '<option value="">Select Category</option>' + options;
         if (currentCategory) categorySelect.value = currentCategory;
      }

      if (historySelect) {
         historySelect.innerHTML =
            '<option value="">All Categories</option>' + options;
         if (currentHistory) historySelect.value = currentHistory;
      }

      const grid = document.getElementById("personalExpenseQuickCategoryGrid");
      if (grid) {
         const hiddenTiles = [
            "education",
            "entertainment",
            "medical",
            "vegetables",
         ];
         grid.innerHTML = clean
            .filter(function (category) {
               return !hiddenTiles.includes(category.toLowerCase());
            })
            .map(function (category) {
               const icon = getPersonalExpenseCategoryIcon(category);
               return (
                  '<button type="button" class="btn btn-outline-secondary pe-quick-btn" data-pe-category="' +
                  escapePersonalExpenseHtml(category) +
                  '" title="' +
                  escapePersonalExpenseHtml(category) +
                  '">' +
                  '<span class="pe-category-icon" aria-hidden="true">' +
                  icon +
                  "</span>" +
                  '<span class="pe-category-name">' +
                  escapePersonalExpenseHtml(category) +
                  "</span></button>"
               );
            })
            .join("");

         if (grid.dataset.categoryDelegateBound !== "true") {
            grid.dataset.categoryDelegateBound = "true";
            grid.addEventListener("click", function (event) {
               const button = event.target.closest("[data-pe-category]");
               if (!button || !grid.contains(button)) return;
               selectPersonalExpenseCategory(
                  button.getAttribute("data-pe-category"),
               );
            });
         }
      }
   }

   function showAddPersonalExpenseCategory() {
      const value = window.prompt("Enter new expense category:");
      if (value === null) return;

      const category = String(value || "")
         .trim()
         .replace(/\s+/g, " ");
      if (!category) return;

      const duplicate = personalExpenseCategoryCache.some(function (item) {
         return item.toLowerCase() === category.toLowerCase();
      });

      if (duplicate) {
         selectPersonalExpenseCategory(
            personalExpenseCategoryCache.find(function (item) {
               return item.toLowerCase() === category.toLowerCase();
            }),
         );
         showPersonalExpenseMessage("Category already exists.", "info");
         return;
      }

      google.script.run
         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               showPersonalExpenseMessage(
                  response && response.message
                     ? response.message
                     : "Unable to add category.",
                  "danger",
               );
               return;
            }
            personalExpenseCategoryCache = response.categories || [];
            populatePersonalExpenseCategories(personalExpenseCategoryCache);
            selectPersonalExpenseCategory(response.category);
            showPersonalExpenseMessage("Category added.", "success");
         })
         .withFailureHandler(function (error) {
            showPersonalExpenseMessage(
               error && error.message ? error.message : String(error),
               "danger",
            );
         })
         .addPersonalExpenseCategory(category);
   }

   function selectPersonalExpenseCategory(category) {
      const categorySelect = document.getElementById("personalExpenseCategory");
      if (!categorySelect) return;

      const target = String(category || "").trim().toLowerCase();
      let foundIndex = -1;

      for (let i = 0; i < categorySelect.options.length; i++) {
         const optVal = String(categorySelect.options[i].value || "").trim().toLowerCase();
         const optText = String(categorySelect.options[i].textContent || "").trim().toLowerCase();
         if (optVal === target || optText.includes(target)) {
            foundIndex = i;
            break;
         }
      }

      if (foundIndex !== -1) {
         categorySelect.selectedIndex = foundIndex;
      } else {
         categorySelect.value = category;
      }

      categorySelect.dispatchEvent(new Event("input", { bubbles: true }));
      categorySelect.dispatchEvent(new Event("change", { bubbles: true }));
   }

   let isSavingPersonalExpense = false;

function savePersonalExpense() {
     if (isSavingPersonalExpense) return;

     const expenseData = collectPersonalExpenseData();
     const validation = validatePersonalExpenseForm(expenseData);
     if (!validation.success) {
         showToast(validation.message, "error"); // Replaced alert/message box with Toast
         return;
     }

     const editingField = document.getElementById("personalExpenseEditingId");
     const editingId = editingField
        ? String(editingField.value || "").trim()
        : "";
     const saveButton = document.getElementById("btnSavePersonalExpense");

     isSavingPersonalExpense = true;
     if (saveButton) {
        saveButton.disabled = true;
        saveButton.innerHTML = editingId
           ? '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Updating...'
           : '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Saving...';
     }

     hidePersonalExpenseMessage();

     function handleSuccess(response) {
        isSavingPersonalExpense = false;
        if (saveButton) {
           saveButton.disabled = false;
           saveButton.innerHTML = "💾 Save Expense";
        }

        if (!response || response.success !== true) {
           showToast(
              response && response.message
                 ? response.message
                 : "Unable to save expense.",
              "error"
           );
           return;
        }

        // Success Toast Notification
        showToast(
           editingId
              ? "Expense updated successfully. ID: " + response.expenseId
              : "Expense saved successfully. ID: " + response.expenseId,
           "success"
        );

        resetPersonalExpenseForm();
        if (editingField) editingField.value = "";
        loadPersonalExpenseBootstrap(true);
     }

     function handleFailure(error) {
        isSavingPersonalExpense = false;
        if (saveButton) {
           saveButton.disabled = false;
           saveButton.innerHTML = editingId
              ? "✏️ Update Expense"
              : "💾 Save Expense";
        }
        const message = error && error.message ? error.message : String(error);
        showToast(
           message || "Unable to save expense.",
           "error"
        );
     }

     if (editingId) {
        google.script.run
           .withSuccessHandler(handleSuccess)
           .withFailureHandler(handleFailure)
           .updatePersonalExpenseFromWeb(editingId, expenseData);
        return;
     }

     google.script.run
        .withSuccessHandler(handleSuccess)
        .withFailureHandler(handleFailure)
        .savePersonalExpenseFromWeb(expenseData);
  }

   function deletePersonalExpense(expenseId, description, amount) {
      expenseId = String(expenseId || "").trim();
      if (!expenseId) return;

      const amountText = formatPersonalExpenseCurrency(amount);
      const confirmed = confirm(
         "Delete this expense?\n\n" +
            expenseId +
            "\n" +
            description +
            "\n" +
            amountText +
            "\n\nIt will be removed from expense totals but retained for audit.",
      );
      if (!confirmed) return;

      google.script.run
         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               showPersonalExpenseMessage(
                  response && response.message
                     ? response.message
                     : "Unable to delete expense.",
                  "danger",
               );
               return;
            }
            showPersonalExpenseMessage(
               "Expense deleted. " +
                  expenseId +
                  " can be restored from Deleted Expenses.",
               "warning",
            );
            loadPersonalExpenses();
            loadPersonalExpenseHistory();

         .withFailureHandler(function (error) {

               error && error.message ? error.message : String(error),

   function validatePersonalExpenseForm(expenseData) {
      if (!expenseData.expenseDate) {
         focusPersonalExpenseField("personalExpenseDate");
         return { success: false, message: "Please select Expense Date." };
      }
      if (!expenseData.category) {
         focusPersonalExpenseField("personalExpenseCategory");
         return { success: false, message: "Please select a Category." };
      }
      if (!expenseData.description) {
         focusPersonalExpenseField("personalExpenseDescription");
         return { success: false, message: "Please enter Description." };
      }
      const amount = Number(expenseData.amount);
      if (!Number.isFinite(amount) || amount <= 0) {
         focusPersonalExpenseField("personalExpenseAmount");
         return {
            success: false,
            message: "Please enter a valid Amount greater than zero.",
         };
      }
      if (!expenseData.paymentMode) {
         focusPersonalExpenseField("personalExpensePaymentMode");
         return { success: false, message: "Please select Payment Mode." };
      }
      return { success: true };
   }

      const dateInput = document.getElementById("personalExpenseDate");
      if (dateInput) dateInput.value = getToday();

      const category = document.getElementById("personalExpenseCategory");
      if (category) category.value = "";

      const description = document.getElementById("personalExpenseDescription");

      if (unit) unit.value = "";

      if (quantity) quantity.value = "";

      const amount = document.getElementById("personalExpenseAmount");
      if (amount) amount.value = "";

      const paymentMode = document.getElementById("personalExpensePaymentMode");

      const optionalFields = [
         "personalExpenseSubcategory",
         "personalExpensePaidTo",
         "personalExpenseReference",
         "personalExpenseRemarks",
      ];
      optionalFields.forEach(function (elementId) {
         const element = document.getElementById(elementId);

      if (expenseFor) expenseFor.value = "Self";

      if (recurring) recurring.value = "No";

      if (moreDetails && moreDetails.classList.contains("show")) {

               bootstrap.Collapse.getOrCreateInstance(moreDetails);
            collapse.hide();
         } catch (error) {

      if (category) {
         setTimeout(function () {

               category.focus();

      if (editingField) editingField.value = "";

            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
         }).format(value);
      } catch (error) {
         return "₹" + value.toFixed(2);
      }
   }

   function debounceMenuSearch() {
      clearTimeout(menuSearchTimer);
      menuSearchTimer = setTimeout(function () {
         searchMenuItems();
      }, 120);
   }

   function searchMenuItems() {
      const searchBox = document.getElementById("menuSearch");
      const suggestionBox = document.getElementById("menuSuggestions");
      if (!searchBox || !suggestionBox) return;

      const keyword = searchBox.value.trim().toLowerCase();
      if (keyword.length < 2) {
         suggestionBox.innerHTML = "";
         suggestionBox.style.display = "none";
         return;
      }

      const results = [];
      for (let i = 0; i < menuCache.length; i++) {
         const item = menuCache[i];
         if (!item) continue;
         const searchName =
            item.searchName ||
            String(item.itemName || "")
               .trim()
               .toLowerCase();
         if (searchName.includes(keyword)) {
            results.push(item);
            if (results.length >= 8) break;
         }
      }
      showMenuSuggestions(results);
   }

   function showMenuSuggestions(items) {
      const list = document.getElementById("menuSuggestions");
      if (!list) return;
      list.style.display = "block";

      if (items.length === 0) {
         list.innerHTML =
            '<div class="list-group-item text-muted">No menu item found</div>';
         return;
      }

      let html = "";
      items.forEach(function (item) {
         html += `<button type="button" class="list-group-item list-group-item-action" onclick="addToCart('${item.itemId}')"><div class="d-flex justify-content-between"><span>${item.itemName}</span><strong>₹${item.price}</strong></div></button>`;
      });
      list.innerHTML = html;
   }

   function addToCart(itemId) {
      const selectedItem = menuCache.find((item) => item.itemId === itemId);
      if (!selectedItem) return;

      const existingItem = cart.find((item) => item.itemId === itemId);
      if (existingItem) {
         existingItem.qty++;
         refreshCartCalculations();
      } else {
         cart.push({
            itemId: selectedItem.itemId,
            itemName: selectedItem.itemName,
            price: Number(selectedItem.price),
            cost: Number(selectedItem.cost),
            qty: 1,
            lineTotal: Number(selectedItem.price),
            profit: Number(selectedItem.price) - Number(selectedItem.cost),
         });
         refreshCartCalculations();
      }

      document.getElementById("menuSearch").value = "";
      clearMenuSuggestions();
      renderCart();
   }

   function renderCart() {
      const cartContainer = document.getElementById("cartItems");
      if (!cartContainer) return;

      if (cart.length === 0) {
         cartContainer.innerHTML =
            '<div class="text-center text-muted py-5"><i class="bi bi-cart-x fs-1"></i><h6 class="mt-3">No items added</h6><small>Search menu items to begin</small></div>';
         updateDiscountState();
         calculateTotals();
         return;
      }

      let html = "";
      cart.forEach((item, index) => {
         const lineTotal = item.lineTotal;
         html += `
            <div class="card shadow-sm mb-3 border-0">
               <div class="card-body">
                  <div class="d-flex justify-content-between align-items-center">
                     <h6 class="mb-0 fw-bold">${item.itemName}</h6>
                     <span class="badge bg-success fs-6">₹${lineTotal}</span>
                  </div>

                     <div class="col-6"><small class="text-muted">Unit Price</small><div class="fw-semibold">₹${item.price}</div></div>

                           <button class="btn btn-light btn-sm" disabled>${item.qty}</button>

      updateDiscountState();

   function increaseQty(index) {
      cart[index].qty++;
      refreshCartCalculations();
      renderCart();
   }

   function decreaseQty(index) {
      if (!cart[index]) return;
      cart[index].qty--;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      else refreshCartCalculations();
      renderCart();
   }

   function removeItem(index) {
      if (index < 0 || index >= cart.length) return;
      cart.splice(index, 1);
      refreshCartCalculations();
      renderCart();
   }

   function calculateTotals() {
      const subTotal = cart.reduce(function (total, item) {
         const price = Number(item.price) || 0;
         const qty = Number(item.qty) || 0;
         return total + price * qty;
      }, 0);

      const addonTotal = getCustomAddonTotal();
      const discountBox = document.getElementById("discount");
      let discount = discountBox ? parseFloat(discountBox.value) : 0;
      if (!Number.isFinite(discount) || discount < 0) discount = 0;

      const discountableAmount = subTotal + addonTotal;
      if (discount > discountableAmount) {
         discount = discountableAmount;
         if (discountBox) discountBox.value = discount.toFixed(2);
      }

      const safeDeliveryCharge = Number.isFinite(Number(deliveryCharge))
         ? Number(deliveryCharge)
         : 0;
      const grandTotal = subTotal + addonTotal - discount + safeDeliveryCharge;

      const subTotalEl = document.getElementById("subTotal");
      const addonTotalEl = document.getElementById("addonTotalDisplay");
      const deliveryEl = document.getElementById("deliveryCharge");
      const grandEl = document.getElementById("grandTotal");

      if (subTotalEl) subTotalEl.innerText = "₹" + subTotal.toFixed(2);
      if (addonTotalEl) addonTotalEl.textContent = "₹" + addonTotal.toFixed(2);
      if (deliveryEl)
         deliveryEl.innerText = "₹" + safeDeliveryCharge.toFixed(2);
      if (grandEl) grandEl.innerText = "₹" + grandTotal.toFixed(2);
   }

   function collectOrderData() {
      const getValue = function (id) {
         const element = document.getElementById(id);
         return element ? element.value : "";
      };

      const customer = {
         customerName: getValue("customerName").trim(),
         mobile: getValue("mobile").trim(),
         deliveryArea: getValue("deliveryArea"),
         houseAddress: getValue("houseAddress").trim(),
         deliverySlot: getValue("deliverySlot"),
      };

      const order = {
         orderType: getValue("orderType"),
         specialInstructions: getValue("specialInstructions").trim(),
      };

      const payment = {
         paymentMode: getValue("paymentMode"),
         paymentStatus: getValue("paymentStatus") || "Pending",
      };

      const subTotal = cart.reduce(function (sum, item) {
         return sum + (Number(item.price) || 0) * (Number(item.qty) || 0);
      }, 0);

      const addonTotal = getCustomAddonTotal();
      let discount = parseFloat(getValue("discount"));
      if (!Number.isFinite(discount) || discount < 0) discount = 0;
      if (discount > subTotal + addonTotal) discount = subTotal + addonTotal;

      const safeDeliveryCharge = Number.isFinite(Number(deliveryCharge))
         ? Number(deliveryCharge)
         : 0;
      const grandTotal = subTotal + addonTotal - discount + safeDeliveryCharge;

      return {
         customer: customer,
         order: order,
         payment: payment,
         totals: {
            subTotal,
            addonTotal,
            discount,
            deliveryCharge: safeDeliveryCharge,
            grandTotal,
         },
         cart: cart.map(function (item) {
            return { ...item };
         }),
         customAddons: customAddons.map(function (addon) {
            return {
               name: String(addon.name || "").trim(),
               price: Number(addon.price) || 0,
            };
         }),
         meta: { orderDate: getValue("orderDate"), source: "WEB" },
      };
   }

   function loadPurchaseHistoryBootstrap() {
      const monthEl = document.getElementById("purchaseHistoryMonth");
      const now = new Date();
      const currentMonthVal = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      const selectedMonth = monthEl && monthEl.value ? monthEl.value : currentMonthVal;

      google.script.run
         .withSuccessHandler(function (response) {
            if (!response || response.success !== true) {
               console.error("Purchase history bootstrap failed");
               return;
            }

            purchaseBootstrapLoaded = true;
            populatePurchaseMonths(response.months || [], selectedMonth);
            populatePurchaseSuppliers(response.suppliers || []);

            purchaseHistoryCache = Array.isArray(response.purchases) ? response.purchases : [];

            for (let i = 0; i < purchaseHistoryCache.length; i++) {
               const p = purchaseHistoryCache[i];
               p._month = String(p.purchaseDateRaw || "").slice(0, 7);
               p._supplier = String(p.supplier || "");
               p._amount = Number(p.amount || 0);
               p._search = [
                  p.purchaseId,
                  p.itemName,
                  p.supplier,
                  p.paymentType,
                  p.remarks,
                  p.unit,
                  p.quantity
               ].join(" ").toLowerCase();
            }

            purchaseLastHistorySignature = "";
            renderPurchaseHistoryFromCache();
         })
         .withFailureHandler(function (error) {
            console.error("Purchase history server failure:", error);
         })
         .getPurchaseBootstrapData(selectedMonth);
   }

   function populatePurchaseMonths(months, currentSelection) {
      const select = document.getElementById("purchaseHistoryMonth");
      if (!select) return;

      const now = new Date();
      const currentMonthVal = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
      const activeVal = currentSelection || select.value || currentMonthVal;
      
      let html = "";
      (months || []).forEach(function (m) {
         html += `<option value="${m.value}">${m.label}</option>`;
      });

      select.innerHTML = html;
      
      const exists = Array.from(select.options).some(opt => opt.value === activeVal);
      if (exists) {
         select.value = activeVal;
      } else if (select.options.length > 0) {
         select.selectedIndex = 0;
      }
   }

   function populatePurchaseSuppliers(suppliers) {
      const select = document.getElementById("purchaseHistorySupplier");
      if (!select) return;
      const current = select.value;
      let html = '<option value="">All Suppliers</option>';
      (suppliers || []).forEach(function (sup) {
         sup = String(sup || "").trim();
         if (!sup) return;
         html += '<option value="' + escapeHtml(sup) + '">' + escapeHtml(sup) + '</option>';

      select.value = current;

   function registerPurchaseLocalHistoryFilters() {
      const monthEl = document.getElementById("purchaseHistoryMonth");
      if (monthEl && monthEl.dataset.serverFetchBound !== "true") {
         monthEl.dataset.serverFetchBound = "true";
         monthEl.addEventListener("change", function () {
            loadPurchaseHistoryBootstrap(); 
         });
      }

      ["purchaseHistorySupplier", "purchaseHistorySearch"].forEach(function (id) {
         const element = document.getElementById(id);
         if (!element || element.dataset.localFilterBound === "true") return;

         element.dataset.localFilterBound = "true";
         const eventName = element.tagName === "INPUT" ? "input" : "change";
         let timer = null;

         element.addEventListener(eventName, function () {
            if (timer) clearTimeout(timer);
            timer = setTimeout(function () {
               renderPurchaseHistoryFromCache();
            }, 80);
         });
      });
   }

   function renderPurchaseHistoryFromCache() {
      if (!purchaseBootstrapLoaded) return;

      const monthEl = document.getElementById("purchaseHistoryMonth");
      const supplierEl = document.getElementById("purchaseHistorySupplier");
      const searchEl = document.getElementById("purchaseHistorySearch");

      const month = monthEl ? String(monthEl.value || "") : "";
      const supplier = supplierEl ? String(supplierEl.value || "") : "";
      const search = searchEl ? String(searchEl.value || "").trim().toLowerCase() : "";

      const signature = month + "\u0001" + supplier + "\u0001" + search + "\u0001" + purchaseHistoryCache.length;
      if (signature === purchaseLastHistorySignature) return;

      purchaseLastHistorySignature = signature;
      const filtered = [];
      let total = 0;

      for (let i = 0; i < purchaseHistoryCache.length; i++) {
         const p = purchaseHistoryCache[i];
         if (month && p._month !== month) continue;
         if (supplier && p._supplier !== supplier) continue;
         if (search && p._search.indexOf(search) === -1) continue;

         filtered.push(p);
         total += p._amount;
      }

      filtered.sort(function (a, b) {
         return String(b.purchaseId || "").localeCompare(String(a.purchaseId || ""), undefined, { numeric: true });
      });

      renderPurchasesTable(filtered);

      const info = document.getElementById("purchaseHistoryInfo");
      if (info) {
         info.textContent = filtered.length + (filtered.length === 1 ? " transaction" : " transactions") + " • Total " + formatCurrencyCustom(total);
      }
   }

   function showPurchaseSuggestions(items) {
      const keyword = document.getElementById("itemSearch").value.trim();
      const suggestionBox = document.getElementById("itemSuggestions");
      if (!suggestionBox) return;

      let html = items
         .map(
            (item) =>
               `<button type="button" class="list-group-item list-group-item-action" onclick="selectPurchaseItem('${item.itemName.replace(/'/g, "\\'")}')">${item.itemName}</button>`,
         )
         .join("");
      const exactMatch = items.some(
         (item) => item.itemName.toLowerCase() === keyword.toLowerCase(),
      );

      if (keyword !== "" && !exactMatch) {
         html += `<button type="button" class="list-group-item list-group-item-action text-success fw-bold border-top" onclick="addNewPurchaseItem()">➕ Add "${keyword}"</button>`;
      }

         .withSuccessHandler(function (response) {
            const exists = purchaseItemsCache.some(

            if (!exists) {

      if (isSavingPurchase) return;
      isSavingPurchase = true;

      const purchaseData = collectPurchaseData();
      const editingId = document.getElementById("purchaseEditingId").value.trim();
      const saveButton = document.getElementById("savePurchaseBtn");
      
      if (saveButton) {
         saveButton.disabled = true;
         saveButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Saving...';
      }

      const handler = editingId
         ? google.script.run.withSuccessHandler(handleSaveResponse).withFailureHandler(handleSaveError).updatePurchaseFromWeb(editingId, purchaseData)
         : google.script.run.withSuccessHandler(handleSaveResponse).withFailureHandler(handleSaveError).savePurchaseFromWeb(purchaseData);

      function handleSaveResponse(response) {
         isSavingPurchase = false;
         if (saveButton) {
            saveButton.disabled = false;
            saveButton.innerHTML = "💾 Save Purchase";
         }
         if (!response || !response.success) {
            showToast(response && response.message ? response.message : "Unable to save purchase.", "error");
            return;
         }
         showToast(response.message || (editingId ? "Purchase updated successfully!" : "Purchase saved successfully!"), "success");
         clearPurchaseForm();
         document.getElementById("purchaseEditingId").value = "";
         loadPurchaseHistoryBootstrap();

      function handleSaveError(error) {
         isSavingPurchase = false;
         if (saveButton) {
            saveButton.disabled = false;

         }
         showToast(error.message || error, "error");

   async function downloadInvoicePdf() {
      const orderId = document.getElementById("invOrderId").innerText.trim();

      if (!orderId || orderId === "-") {
         showToast("Please search an invoice first.", "error");
         return;
      }

      const btn = document.getElementById("btnDownloadPdf");

      if (btn) {
         btn.disabled = true;
         btn.innerHTML = "Generating PDF...";
      }

      try {
         const today = new Date();
         const fileDate =
            today.getFullYear() +
            "-" +
            String(today.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(today.getDate()).padStart(2, "0");

         const fileName = orderId + "_" + fileDate + ".pdf";
         const pdfBlob = await buildInvoicePdfBlob();
         const downloadUrl = URL.createObjectURL(pdfBlob);

         const link = document.createElement("a");
         link.href = downloadUrl;
         link.download = fileName;
         document.body.appendChild(link);
         link.click();
         link.remove();

         setTimeout(function () {
            URL.revokeObjectURL(downloadUrl);
         }, 3000);

         const base64Pdf = await blobToBase64(pdfBlob);

         google.script.run
            .withSuccessHandler(function (response) {
               console.log("PDF saved to Drive", response);
            })
            .withFailureHandler(function (error) {
               console.error("Unable to save PDF to Drive:", error);
            })
            .savePdf(fileName, base64Pdf);
      } catch (error) {
         console.error("Invoice PDF Error:", error);
         showToast("Unable to generate invoice PDF.", "error");
      } finally {
         if (btn) {
            btn.disabled = false;
            btn.innerHTML = "📄 Download PDF";
         }
      }
   }



   function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
         const reader = new FileReader();
         reader.onloadend = () => {
            const res = reader.result;
            resolve(res && res.includes(",") ? res.split(",")[1] : res);
         };
         reader.onerror = reject;
         reader.readAsDataURL(blob);
      });
   }

let isPosCacheLoaded = false;
   function loadPOSCache(forceRefresh) {
      // 1. Instantly load from localStorage if available so UI renders with zero lag
      if (!forceRefresh && !isPosCacheLoaded) {
         try {
            const localRaw = localStorage.getItem("smoky_swaad_pos_cache");
            if (localRaw) {
               const localData = JSON.parse(localRaw);
               menuCache = localData.menu || [];
               appSettings = localData.settings || {};
               customerCache = localData.customers || [];
               isPosCacheLoaded = true;
               populatePOSDropdowns();
            }
         } catch (e) {
            console.warn("Could not read POS local storage cache:", e);
         }
      }

      // If already loaded in memory and no force refresh is requested, return early
      if (isPosCacheLoaded && !forceRefresh) {
         populatePOSDropdowns();
      }

      // 2. Fetch fresh data from the server in the background to keep cache up to date
      google.script.run
         .withSuccessHandler(function (data) {
            if (!data) return;
            menuCache = data.menu || [];
            appSettings = data.settings || {};
            customerCache = data.customers || [];
            isPosCacheLoaded = true;
            populatePOSDropdowns();

            // Save fresh payload to localStorage for subsequent instant opens
            try {
               localStorage.setItem(
                  "smoky_swaad_pos_cache",
                  JSON.stringify({
                     menu: menuCache,
                     settings: appSettings,
                     customers: customerCache,
                     timestamp: Date.now()
                  })
               );
            } catch (e) {
               console.warn("Could not write POS cache to local storage:", e);
            }
         })
         .withFailureHandler(function (error) {
            console.error("Background POS cache sync failed:", error);
         })
         .loadPOSCache();
   }

   function sortBulkInvoiceResults() {
      const sortElement =
         document.getElementById("bulkInvoiceSort") ||
         document.querySelector("select[id*='sort']") ||
         document.getElementById("sortSelect");
      if (
         !sortElement ||
         !Array.isArray(bulkInvoiceSearchResults) ||
         bulkInvoiceSearchResults.length === 0
      ) {
         return;
      }

      const sortType = sortElement.value;
      const sortedOrders = bulkInvoiceSearchResults.slice();

      function getDateValue(order) {
         const value = String(order.orderDate || "");
         const parts = value.split("/");
         if (parts.length !== 3) return 0;
         return new Date(
            Number(parts[2]),
            Number(parts[1]) - 1,
            Number(parts[0]),
         ).getTime();
      }

      sortedOrders.sort(function (a, b) {
         switch (sortType) {
            case "date-desc":
               return getDateValue(b) - getDateValue(a);
            case "date-asc":
               return getDateValue(a) - getDateValue(b);
            case "amount-desc":
               return Number(b.grandTotal || 0) - Number(a.grandTotal || 0);
            case "amount-asc":
               return Number(a.grandTotal || 0) - Number(b.grandTotal || 0);
            case "order-desc":
               return String(b.orderId || "").localeCompare(
                  String(a.orderId || ""),
                  undefined,
                  { numeric: true },
               );
            case "order-asc":
               return String(a.orderId || "").localeCompare(
                  String(b.orderId || ""),
                  undefined,
                  { numeric: true },
               );
            default:
               return 0;
         }
      });

      bulkInvoiceSearchResults = sortedOrders;
      renderBulkInvoiceResults(bulkInvoiceSearchResults);
   }

               <div class="p-2 border rounded bg-light"><small class="text-muted">Pending Amount</small><div class="fw-bold text-danger">₹${totals.pendingAmount.toFixed(2)}</div></div>
            </div>
         </div>
         <div class="d-grid gap-2 d-md-flex justify-content-center">
            <button class="btn btn-danger" onclick="downloadBulkPdf()">📄 Download Bulk PDF</button>
            <button class="btn btn-success" onclick="shareBulkWhatsApp()">📲 Share via WhatsApp</button>
         </div>`;

      previewContainer.scrollIntoView({ behavior: "smooth" });
   }

   function downloadBulkPdf() {
      if (!selectedBulkData || !selectedBulkData.base64Data) return;
      const link = document.createElement("a");
      link.href = "data:application/pdf;base64," + selectedBulkData.base64Data;
      link.download = selectedBulkData.blobName;
      link.click();
   }

   function shareBulkWhatsApp() {
      if (!selectedBulkData) return;
      const mobile = selectedBulkData.customerMobile;
      const totals = selectedBulkData.totals;

      let message = `*Smoky Swaad - Consolidated Statement*\n\nGrand Total: ₹${totals.grandTotal.toFixed(2)}\nPaid: ₹${totals.paidAmount.toFixed(2)}\n`;
      if (totals.pendingAmount > 0)
         message += `*Pending Due: ₹${totals.pendingAmount.toFixed(2)}*\n`;
      message += `\nThank you for ordering with Smoky Swaad! ❤️`;

      window.open(
         `https://wa.me/91${mobile}?text=${encodeURIComponent(message)}`,
         "_blank",
      );
   }

    * PIN AUTHENTICATION SYSTEM
    * ==========================================
    */
   function unlockSystem() {
      const pinInput = document.getElementById("app-pin-input").value;
      const lockScreen = document.getElementById("pin-lock-screen");
      const errorMsg = document.getElementById("pin-error-msg");
      const adminPin = "9999";
      const cashierPin = "1234";

      if (pinInput === adminPin || pinInput === cashierPin) {
         lockScreen.style.display = "none";
         errorMsg.style.visibility = "hidden";
      } else {
         errorMsg.style.visibility = "visible";
         document.getElementById("app-pin-input").value = "";
      }
   }

   document.addEventListener("DOMContentLoaded", function () {
      const pinField = document.getElementById("app-pin-input");
      if (pinField) {
         pinField.addEventListener("keypress", function (e) {
            if (e.key === "Enter") unlockSystem();
         });
      }
   });

   /**

    * NATIVE MOBILE SORTING & CHANGE LISTENER
    * ==========================================

   document.addEventListener("DOMContentLoaded", function () {
      document.body.addEventListener("change", function (e) {
         const target = e.target;

         if (

            target.id.toLowerCase().includes("sort")

               sortBulkInvoiceResults();

      });

   let purchaseSearchTimer = null;

   function debouncedPurchaseSearch() {
      clearTimeout(purchaseSearchTimer);

      purchaseSearchTimer = setTimeout(function () {
         if (typeof searchPurchaseItems === "function") {
            searchPurchaseItems();
         }
      }, 200);
   }

   function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
   }

   function escapeJs(str) {
      return String(str || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
   }

   function formatCurrencyCustom(amount) {
      return "₹" + Number(amount || 0).toFixed(2);
   }





function clearPOSForm() {
      cart = [];
      customAddons = [];
      deliveryCharge = 0;

      const fields = [
         "customerName",
         "mobile",
         "houseAddress",
         "deliveryArea",
         "deliverySlot",
         "orderType",
         "specialInstructions",
         "discount"
      ];

      fields.forEach(function (id) {
         const el = document.getElementById(id);
         if (el) {
            if (id === "discount") {
               el.value = "0";
            } else {
               el.value = "";
            }
         }
      });

      renderCart();
      renderCustomAddons();

      const menuSearch = document.getElementById("menuSearch");
      if (menuSearch) {
         menuSearch.value = "";
      }
      clearMenuSuggestions();
   }

// INSTANT TOAST NOTIFICATION HELPER
// ==========================================
function showToast(message, type = 'success') {
    let container = document.getElementById('toast-container');
    if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = `custom-toast ${type}`;
    
    const textSpan = document.createElement('span');
    textSpan.innerText = message;
    toast.appendChild(textSpan);

    container.appendChild(toast);

    // Auto-remove after 3 seconds with a smooth fade-out
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}
