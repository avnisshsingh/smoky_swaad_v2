   /**
    * ==========================================
    * Search Purchase Items
    * ==========================================
    */
   function searchPurchaseItems() {
      const keyword = document
         .getElementById("itemSearch")
         .value.trim()
         .toLowerCase();

      if (keyword.length === 0) {
         clearPurchaseSuggestions();

         return;
      }

      const items = purchaseItemsCache
         .filter((item) => item.searchName.includes(keyword))
         .slice(0, 15);

      showPurchaseSuggestions(items);
   }

   /**
    * ==========================================
    * Show Purchase Suggestions
    * ==========================================
    */
   function showPurchaseSuggestions(items) {
      const keyword = document.getElementById("itemSearch").value.trim();

      const suggestionBox = document.getElementById("itemSuggestions");

      if (!suggestionBox) return;

      // Build suggestions in memory
      let html = items
         .map(
            (item) => `
      <button
         type="button"
         class="list-group-item list-group-item-action"
         onclick="selectPurchaseItem('${item.itemName.replace(/'/g, "\\'")}')">

         ${item.itemName}

      </button>
   `,
         )
         .join("");

      // Check if exact item already exists (Case Insensitive)
      const exactMatch = items.some(
         (item) => item.itemName.toLowerCase() === keyword.toLowerCase(),
      );

      // Show Add New Item option
      if (keyword !== "" && !exactMatch) {
         html += `
         <button
            type="button"
            class="list-group-item list-group-item-action text-success fw-bold border-top"
            onclick="addNewPurchaseItem()">

            ➕ Add "${keyword}"

         </button>
      `;
      }

      // Single DOM update
      suggestionBox.innerHTML = html;
   }

   /**
    * ==========================================
    * Select Purchase Item
    * ==========================================
    */
   function selectPurchaseItem(itemName) {
      document.getElementById("itemSearch").value = itemName;

      clearPurchaseSuggestions();

      updatePurchaseSummary();
   }

   /**
    * ==========================================
    * Add New Purchase Item
    * ==========================================
    */
   function addNewPurchaseItem() {
      const itemName = document.getElementById("itemSearch").value.trim();

      if (!itemName) return;

      google.script.run

         .withSuccessHandler(function (response) {
            // If item already exists or newly created,
            // make sure it exists in local cache only once.
            const exists = purchaseItemsCache.some(
               (item) =>
                  item.itemName.toLowerCase() ===
                  response.itemName.toLowerCase(),
            );

            if (!exists) {
               purchaseItemsCache.push({
                  itemName: response.itemName,

                  searchName: response.itemName.toLowerCase(),
               });
            }

            // Select the item
            document.getElementById("itemSearch").value = response.itemName;

            clearPurchaseSuggestions();

            selectPurchaseItem(response.itemName);
         })

         .withFailureHandler(function (error) {
            alert(error.message || error);
         })

         .addPurchaseItem(itemName);
   }

   /**
    * ==========================================
    * Clear Suggestions
    * ==========================================
    */
   function clearPurchaseSuggestions() {
      const el = document.getElementById("itemSuggestions");
      if (el) el.innerHTML = "";
   }

   /**
    * ==========================================
    * Collect Purchase Data
    * ==========================================
    */
   function collectPurchaseData() {
      return {
         purchase: {
            purchaseDate: document.getElementById("purchaseDate").value,

            itemName: document.getElementById("itemSearch").value.trim(),

            quantity: Number(document.getElementById("quantity").value),

            unit: document.getElementById("unit").value,

            paymentType: document.getElementById("paymentType").value,

            amount: Number(document.getElementById("amount").value),

            supplier: document.getElementById("supplier").value,

            remarks: document.getElementById("remarks").value.trim(),

   /**
    * ==========================================
    * Save Purchase
    * ==========================================
    */
   function savePurchase() {

         return;
      }

      isSavingPurchase = true;

      const purchaseData = collectPurchaseData();

      const saveButton = document.getElementById("btnSavePurchase");

      if (saveButton) {
         saveButton.disabled = true;

         saveButton.innerHTML = "Saving...";
      }

      google.script.run

         .withSuccessHandler(function (response) {
            isSavingPurchase = false;

            if (saveButton) {
               saveButton.disabled = false;

               saveButton.innerHTML = "💾 Save Purchase";
            }

            if (!response.success) {
               alert(response.message);

               return;
            }

            alert(
               response.message + "\n\nPurchase ID : " + response.purchaseId,
            );

            clearPurchaseForm();
         })

         .withFailureHandler(function (error) {
            isSavingPurchase = false;

            if (saveButton) {
               saveButton.disabled = false;

               saveButton.innerHTML = "💾 Save Purchase";
            }

            alert(error.message || error);
         })

         .savePurchaseFromWeb(purchaseData);
   }
   /**
    * ==========================================
    * Update Purchase Summary
    * ==========================================
    */
   function updatePurchaseSummary() {
      if (!document.getElementById("summaryPurchaseDate")) return;

      document.getElementById("summaryPurchaseDate").textContent =
         document.getElementById("purchaseDate").value || "-";

      document.getElementById("summaryItem").textContent =
         document.getElementById("itemSearch").value || "-";

      document.getElementById("summaryQuantity").textContent =
         document.getElementById("quantity").value || "-";

      document.getElementById("summaryUnit").textContent =
         document.getElementById("unit").value || "-";

      document.getElementById("summaryPaymentType").textContent =
         document.getElementById("paymentType").value || "-";

      const amount = document.getElementById("amount").value || 0;

      document.getElementById("summaryAmount").textContent = "₹" + amount;

      document.getElementById("summarySupplier").textContent =
         document.getElementById("supplier").value || "-";

      document.getElementById("summaryRemarks").textContent =
         document.getElementById("remarks").value || "-";

   /**
    * ==========================================
    * Clear Purchase Form
    * ==========================================
    */
   function clearPurchaseForm() {

      const month = String(today.getMonth() + 1).padStart(2, "0");

      const day = String(today.getDate()).padStart(2, "0");

      document.getElementById("purchaseDate").value = `${year}-${month}-${day}`;

      // Clear form fields
      document.getElementById("itemSearch").value = "";
      document.getElementById("quantity").value = "";

    function searchInvoice() {

         .value

   /**
    * ==========================================
    * renderInvoice
    * ==========================================
    */

   function renderInvoice(data) {
      const order = data.order;
      const items = data.items;

      let subtotal = 0;

      // ===========================
      // Header
      // ===========================

      document.getElementById("invOrderId").innerText = order.orderId;

      document.getElementById("invDate").innerText = order.orderDate;

      document.getElementById("invCustomer").innerText = order.customerName;

      document.getElementById("invMobile").innerText = order.mobile;

      document.getElementById("invDeliveryArea").innerText = order.deliveryArea;

      //document.getElementById("invDeliverySlot").innerText = order.deliverySlot;

      document.getElementById("invOrderType").innerText = order.orderType;

      document.getElementById("invAddress").innerHTML = (
         order.houseAddress || ""
      ).replace(/\n/g, "<br>");

      document.getElementById("invPaymentMode2").innerText = order.paymentMode;

      document.getElementById("invInstructions").innerText =
         order.specialInstructions || "-";

      // ===========================
      // Status Badge
      // ===========================

      document.getElementById("invStatus").innerHTML =
         `<span class="badge bg-primary">${order.status}</span>`;

      document.getElementById("invPaymentStatus").innerHTML =
         `<span class="badge bg-success">${order.paymentStatus}</span>`;

      // ===========================
      // Items
      // ===========================

      let rows = "";

      items.forEach(function (item) {
         subtotal += item.total;

         rows += `
        <tr>

            <td>${item.itemName}</td>

            <td class="text-center">${item.qty}</td>

            <td class="text-end">₹${item.price.toFixed(2)}</td>

            <td class="text-end">₹${item.total.toFixed(2)}</td>

        </tr>
        `;
      });

      document.getElementById("invoiceItemsBody").innerHTML = rows;

      // ===========================
      // Totals
      // ===========================

      document.getElementById("invSubtotal").innerText =
         "₹" + subtotal.toFixed(2);

      // ===========================
      // Custom Add-ons
      // ===========================

      const addonsRow = document.getElementById("invAddonsRow");

      const addonsText = document.getElementById("invAddons");

      const addonTotalElement = document.getElementById("invAddonTotal");

      const addons = String(order.addons || "").trim();

      const addonTotal = Number(order.addonTotal || 0);

      if (addons && addonTotal > 0) {
         if (addonsRow) {
            addonsRow.style.display = "";
         }

         if (addonsText) {
            addonsText.innerText = addons;
         }

         if (addonTotalElement) {
            addonTotalElement.innerText = "₹" + addonTotal.toFixed(2);
         }
      } else {
         if (addonsRow) {
            addonsRow.style.display = "none";
         }

         if (addonsText) {
            addonsText.innerText = "";
         }

         if (addonTotalElement) {
            addonTotalElement.innerText = "₹0.00";
         }
      }

      document.getElementById("invDeliveryCharge").innerText =
         "₹" + Number(order.deliveryCharge || 0).toFixed(2);

      document.getElementById("invDiscount").innerText =
         "₹" + Number(order.discount || 0).toFixed(2);

      document.getElementById("invGrandTotal").innerText =
         "₹" + Number(order.grandTotal || 0).toFixed(2);
   }

            allowTaint: false,

            backgroundColor: "#ffffff",

            logging: false,

            /*
             * Force desktop media/layout
             * even when user downloads PDF
             * from a phone.
             */
            windowWidth: 794,
            windowHeight: Math.max(
               pdfInvoice.scrollHeight + 40,
               1123
            ),

            scrollX: 0,
            scrollY: 0,

            onclone: function(clonedDocument) {

               const clonedInvoice =
                  clonedDocument.getElementById("invoicePdfExport");

               if (!clonedInvoice) {
                  return;
               }

               clonedInvoice.style.position = "relative";
               clonedInvoice.style.left = "0";
               clonedInvoice.style.top = "0";
               clonedInvoice.style.margin = "0";
               clonedInvoice.style.transform = "none";
               clonedInvoice.style.overflow = "visible";

               const clonedWrapper =
                  clonedInvoice.parentElement;

               if (clonedWrapper) {
                  clonedWrapper.style.position = "relative";
                  clonedWrapper.style.left = "0";
                  clonedWrapper.style.top = "0";
                  clonedWrapper.style.margin = "0";
                  clonedWrapper.style.transform = "none";
                  clonedWrapper.style.overflow = "visible";
               }

            }

         },

         jsPDF: {

            unit: "mm",

            format: "a4",

            orientation: "portrait"

         },

         /*
          * No avoid-all.
          *
          * Only the specific elements above
          * control page breaking.
          */
         pagebreak: {

            mode: [
               "legacy"
            ]

         }

      };


      /* ==========================================
         GENERATE PDF ONCE
      ========================================== */

      const worker =
         html2pdf()
            .set(options)
            .from(pdfInvoice);

      const pdfBlob =
         await worker.outputPdf("blob");


      if (
         !pdfBlob ||
         pdfBlob.size < 1000
      ) {

         throw new Error(
            "Generated PDF is empty."
         );

      }


      /* ==========================================
         DOWNLOAD SAME GENERATED PDF
      ========================================== */

      const downloadUrl =
         URL.createObjectURL(pdfBlob);

      const link =
         document.createElement("a");

      link.href = downloadUrl;
      link.download = fileName;

      document.body.appendChild(link);

      link.click();

      link.remove();


      setTimeout(function() {

         URL.revokeObjectURL(
            downloadUrl
         );

      }, 3000);


      /* ==========================================
         SAVE EXACT SAME PDF TO GOOGLE DRIVE
      ========================================== */

      const base64Pdf =
         await blobToBase64(pdfBlob);


      google.script.run

         .withSuccessHandler(
            function(response) {

               console.log(
                  "PDF saved to Drive",
                  response
               );

            }
         )

         .withFailureHandler(
            function(error) {

               console.error(
                  "Unable to save PDF to Drive:",
                  error
               );

            }
         )

         .savePdf(
            fileName,
            base64Pdf
         );


   } catch (err) {

      console.error(
         "Invoice PDF Error:",
         err
      );

      alert(
         "Unable to generate invoice PDF."
      );

   } finally {

      /* ==========================================
         REMOVE TEMPORARY PDF COPY
      ========================================== */

      if (
         wrapper &&
         wrapper.parentNode
      ) {

         wrapper.parentNode.removeChild(
            wrapper
         );

      }


      /* ==========================================
         RESTORE BUTTON
      ========================================== */

      if (btn) {

         btn.disabled = false;

         btn.innerHTML =
            "📄 Download PDF";

      }

   }

}











   /**
    * ==========================================
    * Convert Blob to Base64
    * ==========================================
    */
   function blobToBase64(blob) {
      return new Promise(function (resolve, reject) {
         const reader = new FileReader();

         reader.onloadend = function () {
            resolve(reader.result);
         };

         reader.onerror = reject;

         reader.readAsDataURL(blob);
      });
   }

         /*
          * Generate a canvas first, then place that single image on one
          * A4 PDF page. This deliberately avoids html2pdf's DOM page
          * pagination, which was creating the blank page in the Drive PDF.
          */
         /*
          * IMPORTANT:
          * The Apps Script page loads html2pdf, but does not necessarily
          * expose standalone global html2canvas / jspdf objects.
          * Use html2pdf's own bundled canvas renderer instead.
          */
         const captureWorker =
            html2pdf()
               .set({
                  html2canvas: {
                     scale: 2,
                     useCORS: true,
                     allowTaint: false,
                     backgroundColor: "#ffffff",
                     logging: false,
                     windowWidth: 794,
                     scrollX: 0,
                     scrollY: 0
                  }
               })
               .from(pdfInvoice)
               .toCanvas();

         const sourceCanvas =
            await captureWorker.get("canvas");

         if (
            !sourceCanvas ||
            !sourceCanvas.width ||
            !sourceCanvas.height
         ) {
            throw new Error("Invoice canvas could not be generated.");
         }

         /*
          * Build ONE A4-ratio canvas.
          * The complete invoice is scaled proportionally into this canvas,
          * so html2pdf receives exactly one page-sized image.
          */
         const pageCanvas =
            document.createElement("canvas");

         const pageWidthPx = 1588;   // A4 ratio at ~192 dpi
         const pageHeightPx = 2238;

         pageCanvas.width = pageWidthPx;
         pageCanvas.height = pageHeightPx;

         const ctx =
            pageCanvas.getContext("2d");

         if (!ctx) {
            throw new Error("Unable to create PDF canvas.");
         }

         ctx.fillStyle = "#ffffff";
         ctx.fillRect(
            0,
            0,
            pageCanvas.width,
            pageCanvas.height
         );

         const marginPx = 38;

         const usableWidth =
            pageCanvas.width - (marginPx * 2);

         const usableHeight =
            pageCanvas.height - (marginPx * 2);

         const scale =
            Math.min(
               usableWidth / sourceCanvas.width,
               usableHeight / sourceCanvas.height
            );

         const drawWidth =
            sourceCanvas.width * scale;

         const drawHeight =
            sourceCanvas.height * scale;

         const drawX =
            marginPx +
            ((usableWidth - drawWidth) / 2);

         const drawY =
            marginPx;

         ctx.drawImage(
            sourceCanvas,
            drawX,
            drawY,
            drawWidth,
            drawHeight
         );

         /*
          * Generate the Drive PDF using html2pdf only.
          * No standalone jsPDF dependency is required.
          */
         /*
          * Generate the PDF through html2pdf's internal jsPDF instance.
          *
          * html2pdf can sometimes create a second completely blank page
          * when the source canvas is extremely close to the exact A4
          * boundary because of pixel/mm rounding.
          *
          * We deliberately keep ONLY page 1 because pageCanvas already
          * contains the COMPLETE invoice scaled to one A4 page.
          */
         const pdfWorker =
            html2pdf()
               .set({
                  margin: 0,
                  image: {
                     type: "jpeg",
                     quality: 0.98
                  },
                  html2canvas: {
                     scale: 1,
                     backgroundColor: "#ffffff",
                     logging: false
                  },
                  jsPDF: {
                     unit: "mm",
                     format: "a4",
                     orientation: "portrait"
                  },
                  pagebreak: {
                     mode: ["legacy"]
                  }
               })
               .from(pageCanvas, "canvas")
               .toPdf();

         const pdfDocument =
            await pdfWorker.get("pdf");

         /*
          * pageCanvas is already a complete one-page invoice image.
          * Any additional PDF pages are therefore html2pdf rounding
          * artifacts and are safe to remove.
          */
         const totalPages =
            pdfDocument.internal.getNumberOfPages();

         for (
            let pageNo = totalPages;
            pageNo > 1;
            pageNo--
         ) {
            pdfDocument.deletePage(pageNo);
         }

         const pdfBlob =
            pdfDocument.output("blob");

         if (!pdfBlob || pdfBlob.size < 1000) {
            throw new Error("Generated PDF is empty.");
         }

         const base64Pdf =
            await blobToBase64(pdfBlob);

         google.script.run

            .withSuccessHandler(function(response) {

               if (!response.success) {
                  alert(response.message);
                  return;

               const message = `Hello ${customerName},

Thank you for choosing Smoky Swaad.

🧾 Invoice No : ${orderId}
💰 Amount : ${grandTotal}

📄 Your Invoice
${response.fileUrl}

Thank you for choosing Smoky Swaad.

🍛 Smoky Swaad`;

               window.open(
                  "https://wa.me/" +
                  mobile +
                  "?text=" +
                  encodeURIComponent(message),
                  "_blank"
               );
            })

            .withFailureHandler(function(error) {

               console.error(error);

               alert(
                  "Unable to save invoice to Google Drive."
               );
            })

            .saveInvoicePdf(
               fileName,
               base64Pdf
            );

      } catch (err) {

         console.error(
            "Share Invoice PDF Error:",
            err
         );

            "Unable to generate Invoice PDF."
         );

      } finally {

         if (
            wrapper &&
            wrapper.parentNode
         ) {
            wrapper.parentNode.removeChild(wrapper);
         }
      }
   }

   function initializeReports() {
      console.log("Reports Module Loaded");

      const today = getToday();

      const fromDate = document.getElementById("reportFromDate");

      const toDate = document.getElementById("reportToDate");

      // Set default values
      fromDate.value = today;

      toDate.value = today;

      // Restrict future dates
      fromDate.max = today;

      toDate.max = today;

      // Prevent To Date from being earlier than From Date
      toDate.min = fromDate.value;

      // From Date Change
      fromDate.addEventListener("change", function () {
         toDate.min = this.value;

         if (toDate.value < this.value) {
            toDate.value = this.value;
         }

         // Disable PDF until a new report is generated
         document.getElementById("btnDownloadPDF").disabled = true;
      });

      // To Date Change
      toDate.addEventListener("change", function () {
         fromDate.max = this.value > today ? today : this.value;

         if (fromDate.value > this.value) {
            fromDate.value = this.value;
         }

         // Disable PDF until a new report is generated
         document.getElementById("btnDownloadPDF").disabled = true;
      });

      google.script.run

         .withSuccessHandler(renderReportDashboard)

         .withFailureHandler(function (error) {
            console.error(error);
         })

         .getReportsData(today, today);
   }

   /**
    * ==========================================
    * Delete Order
    * ==========================================
    */
   function deleteOrder() {
      const orderIdBox = document.getElementById("deleteOrderId");

      const deleteButton = document.getElementById("btnDeleteOrder");

      // ------------------------------------------
      // Validate Order ID
      // ------------------------------------------

      if (!orderIdBox) {
         alert("Delete Order field not found.");

         return;
      }

      const orderId = String(orderIdBox.value || "")
         .trim()
         .toUpperCase();

      if (!orderId) {
         alert("Please enter an Order ID.");

         orderIdBox.focus();

         return;
      }

      // ------------------------------------------
      // Confirmation
      // ------------------------------------------

      const confirmed = confirm(
         "Delete Order " +
            orderId +
            "?\n\n" +
            "This will permanently delete the order and its " +
            "order items and recalculate the customer's order history.",
      );

      if (!confirmed) {
         return;
      }

      // ------------------------------------------
      // Lock Delete Button
      // ------------------------------------------

      if (deleteButton) {
         deleteButton.disabled = true;

         deleteButton.textContent = "Deleting...";
      }

      // ------------------------------------------
      // Server Request
      // ------------------------------------------

      google.script.run

         .withSuccessHandler(function (response) {
            if (deleteButton) {
               deleteButton.disabled = false;

               deleteButton.textContent = "Delete Order";
            }

            if (response && response.success) {
               orderIdBox.value = "";

               alert(
                  "Order Deleted Successfully\n\n" + "Order ID : " + orderId,
               );
            } else {
               alert(
                  response && response.message
                     ? response.message
                     : "Unable to delete order.",
               );
            }
         })

         .withFailureHandler(function (error) {
            if (deleteButton) {
               deleteButton.disabled = false;

               deleteButton.textContent = "Delete Order";
            }

            console.error("Delete Order Error:", error);

            alert(
               error && error.message
                  ? error.message
                  : "Unable to delete order.",
            );
         })

         .deleteOrderFromWeb(orderId);
   }

   /**
    * ==========================================================
    * ADD CUSTOM ADD-ON
    * ==========================================================
    */
   function addCustomAddon() {
      const nameInput = document.getElementById("addonName");

      const priceInput = document.getElementById("addonPrice");

      if (!nameInput || !priceInput) {
         console.error("Add-on input fields not found.");

         return;
      }

      const addonName = String(nameInput.value || "").trim();

      const addonPrice = Number(priceInput.value || 0);

      // ------------------------------------------
      // Validation
      // ------------------------------------------

      if (!addonName) {
         alert("Please enter Add-on Name.");

         nameInput.focus();

         return;
      }

      if (!Number.isFinite(addonPrice) || addonPrice <= 0) {
         alert("Please enter a valid Add-on Price.");

         priceInput.focus();

         return;
      }

      // ------------------------------------------
      // Add to separate Add-on array
      // ------------------------------------------

      customAddons.push({
         name: addonName,

         price: addonPrice,
      });

      // ------------------------------------------
      // Clear fields
      // ------------------------------------------

      nameInput.value = "";

      priceInput.value = "";

      // ------------------------------------------
      // Refresh Add-on display
      // ------------------------------------------

      renderCustomAddons();

      // Keep cursor ready for next Add-on
      nameInput.focus();
   }

   /**
    * ==========================================================
    * REMOVE CUSTOM ADD-ON
    * ==========================================================
    */
   function removeCustomAddon(index) {
      if (index < 0 || index >= customAddons.length) {
         return;
      }

      customAddons.splice(index, 1);

      renderCustomAddons();
   }

   /**
    * ==========================================================
    * RENDER CUSTOM ADD-ONS
    * ==========================================================
    */
   function renderCustomAddons() {
      const list = document.getElementById("addonList");

      const totalDisplay = document.getElementById("addonTotalDisplay");

      // ------------------------------------------
      // Calculate Add-on Total
      // ------------------------------------------

      const addonTotal = getCustomAddonTotal();

      // ------------------------------------------
      // Update Add-on Total Display
      // ------------------------------------------

      if (totalDisplay) {
         totalDisplay.textContent = "₹" + addonTotal.toFixed(2);
      }

      // ------------------------------------------
      // Render Add-on List
      // ------------------------------------------

      if (list) {
         if (customAddons.length === 0) {
            list.innerHTML = "";
         } else {
            let html = "";

            customAddons.forEach(function (addon, index) {
               html += `

                        <div
                            class="d-flex justify-content-between align-items-center py-2 border-bottom">

                            <div class="me-2">

                                <span>
                                    ${escapeAddonHtml(addon.name)}
                                </span>

                            </div>


                            <div
                                class="d-flex align-items-center gap-2">

                                <strong>
                                    ₹${Number(addon.price || 0).toFixed(2)}
                                </strong>

                                <button
                                    type="button"
                                    class="btn btn-outline-danger btn-sm"
                                    onclick="removeCustomAddon(${index})"
                                    title="Remove Add-on">

                                    ×

                                </button>

                            </div>

                        </div>

                    `;
            });

            list.innerHTML = html;
         }
      }

      // ------------------------------------------
      // IMPORTANT
      // Recalculate complete order total
      // ------------------------------------------

      calculateTotals();
   }

   /**
    * ==========================================================
    * GET CUSTOM ADD-ON TOTAL
    * ==========================================================
    */
   function getCustomAddonTotal() {
      let total = 0;

      customAddons.forEach(function (addon) {
         total += Number(addon.price || 0);
      });

      return total;
   }

   /**
    * ==========================================================
    * ESCAPE ADD-ON HTML
    * ==========================================================
    *
    * Prevents user-entered Add-on names from being interpreted
    * as HTML when displayed.
    * ==========================================================
    */
   function escapeAddonHtml(value) {
      return String(value || "")
         .replace(/&/g, "&amp;")

         .replace(/</g, "&lt;")

         .replace(/>/g, "&gt;")

         .replace(/"/g, "&quot;")

         .replace(/'/g, "&#039;");
   }

         })

         .getSmokySwaadLogo();
   }


   /* ==========================================================
      GLOBAL MOBILE UX HELPERS
   ========================================================== */
   function optimizeMobileControls(root) {
      if (!window.matchMedia("(max-width: 768px), (pointer: coarse)").matches) return;

      const scope = root && root.querySelectorAll ? root : document;
      const inputs = scope.querySelectorAll('input');

      for (let i = 0; i < inputs.length; i++) {
         const input = inputs[i];
         const type = String(input.type || '').toLowerCase();

         if (type === 'number' && !input.hasAttribute('inputmode')) {
            input.setAttribute('inputmode', 'decimal');
         } else if (type === 'tel' && !input.hasAttribute('inputmode')) {
            input.setAttribute('inputmode', 'tel');
         }
      }
   }

   let mobileGeometryTimer = 0;
   function refreshMobileSelectArrowGeometry() {
      if (!shouldUseMobileSelectPicker()) return;
      window.clearTimeout(mobileGeometryTimer);
      mobileGeometryTimer = window.setTimeout(function () {
         const selects = document.querySelectorAll('select.mobile-arrow-select');
         for (let i = 0; i < selects.length; i++) {
            const select = selects[i];
            const host = select.parentElement;
            if (!host) continue;
            const button = host.querySelector('.mobile-select-arrow-button');
            if (button) syncMobileSelectArrowGeometry(select, button);
         }
      }, 80);
   }

   window.addEventListener('resize', refreshMobileSelectArrowGeometry, { passive: true });
   window.addEventListener('orientationchange', refreshMobileSelectArrowGeometry, { passive: true });

   document.addEventListener('DOMContentLoaded', function () {
      optimizeMobileControls(document);
   });








function formatCurrency(value){

    return "₹" + Number(value || 0).toLocaleString("en-IN",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
    });

}







function loadProfitMonths() {

    google.script.run

        .withSuccessHandler(function(result){

            const ddl =
                document.getElementById("profitMonth");

            if(!ddl) return;

            ddl.innerHTML = "";

            result.months.forEach(function(month){

                ddl.add(
                    new Option(month, month)
                );

            });

            if(result.months.length){

                ddl.value =
                    result.months[0];

                ddl.onchange =
                    loadMonthlyProfit;

            }

            /*
             * Populate Profit Card immediately.
             * No second Apps Script call.
             */
            updateProfitSummary(
                result.summary
            );

        })

        .getProfitDashboardData();

}










function loadMonthlyProfit(){

    const ddl =
        document.getElementById("profitMonth");

    if(!ddl) return;

    google.script.run

        .withSuccessHandler(function(result){

            document.getElementById("monthlySales").innerHTML =
                formatCurrency(result.sales);

            document.getElementById("monthlyPurchases").innerHTML =
                formatCurrency(result.purchases);

            document.getElementById("monthlyProfit").innerHTML =
                formatCurrency(result.grossProfit);

            document.getElementById("monthlyMargin").innerHTML =
                result.profitMargin===null
                ? "—"
                : result.profitMargin.toFixed(1)+"%";

        })

        .getMonthlyProfitSummary(
            ddl.value
        );

}











function updateProfitSummary(result){

    document.getElementById("monthlySales").innerHTML =
        formatCurrency(result.sales);

    document.getElementById("monthlyPurchases").innerHTML =
        formatCurrency(result.purchases);

    document.getElementById("monthlyProfit").innerHTML =
        formatCurrency(result.grossProfit);

    document.getElementById("monthlyMargin").innerHTML =
        result.profitMargin === null
            ? "—"
            : result.profitMargin.toFixed(1) + "%";

}
