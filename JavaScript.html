   /**
    * ==========================================================
    * BULK INVOICE SEARCH MODULE
    * ==========================================================
    *
    * Independent from the existing single invoice module.
    * ==========================================================
    */

   let bulkInvoiceSearchResults = [];

   /**
    * ==========================================================
    * SEARCH BULK INVOICE ORDERS
    * ==========================================================
    */

   function searchBulkInvoiceOrders() {
      const fromDate = document.getElementById("bulkInvoiceFromDate").value;

      const toDate = document.getElementById("bulkInvoiceToDate").value;

      const mobile = document.getElementById("bulkInvoiceMobile").value.trim();

      const orderId = document
         .getElementById("bulkInvoiceOrderId")
         .value.trim();

      const paymentStatus = document.getElementById(
         "bulkInvoicePaymentStatus",
      ).value;

      // ======================================================
      // CLIENT VALIDATION
      // ======================================================

      if ((fromDate && !toDate) || (!fromDate && toDate)) {
         showBulkInvoiceMessage(
            "Please select both From Date and To Date.",
            "warning",
         );

         return;
      }

      // ======================================================
      // BUILD FILTER OBJECT
      // ======================================================

      const filters = {
         fromDate: fromDate,

         toDate: toDate,

         mobile: mobile,

         orderId: orderId,

         paymentStatus: paymentStatus,
      };

      // ======================================================
      // LOADING STATE
      // ======================================================

      const searchButton = document.getElementById("bulkInvoiceSearchBtn");

      if (searchButton) {
         searchButton.disabled = true;

         searchButton.innerHTML = "Searching...";
      }

      showBulkInvoiceMessage("Searching orders...", "info");

      // ======================================================
      // SERVER CALL
      // ======================================================

      google.script.run

         .withSuccessHandler(function (response) {
            if (searchButton) {
               searchButton.disabled = false;

               searchButton.innerHTML = "🔍 Search Orders";
            }

            if (!response || response.success !== true) {
               bulkInvoiceSearchResults = [];

               renderBulkInvoiceResults([]);

               showBulkInvoiceMessage(
                  response && response.message
                     ? response.message
                     : "Unable to search orders.",

                  "danger",
               );

               return;
            }

            bulkInvoiceSearchResults = Array.isArray(response.orders)
               ? response.orders
               : [];

            renderBulkInvoiceResults(bulkInvoiceSearchResults);

            if (bulkInvoiceSearchResults.length === 0) {
               showBulkInvoiceMessage("No matching orders found.", "warning");

               return;
            }

            let message = bulkInvoiceSearchResults.length + " order";

            if (bulkInvoiceSearchResults.length !== 1) {
               message += "s";
            }

            message += " found";

            if (response.usingCurrentMonth === true) {
               message += " in the current month";
            }

            message += ".";

            showBulkInvoiceMessage(message, "success");
         })

         .withFailureHandler(function (error) {
            if (searchButton) {
               searchButton.disabled = false;

               searchButton.innerHTML = "🔍 Search Orders";
            }

            bulkInvoiceSearchResults = [];

            renderBulkInvoiceResults([]);

            showBulkInvoiceMessage(
               error && error.message ? error.message : String(error),

               "danger",
            );
         })

         .searchBulkInvoiceOrdersFromWeb(filters);
   }

   /**
    * ==========================================================
    * RENDER BULK INVOICE RESULTS
    * ==========================================================
    */

   function renderBulkInvoiceResults(orders) {
      orders = Array.isArray(orders) ? orders : [];

      const body = document.getElementById("bulkInvoiceResultsBody");

      const container = document.getElementById("bulkInvoiceResultsContainer");

      const countElement = document.getElementById("bulkInvoiceOrderCount");

      if (countElement) {
         countElement.textContent = orders.length;
      }

      if (!body || !container) {
         return;
      }

      body.innerHTML = "";

      // ======================================================
      // NO RESULTS
      // ======================================================

      if (orders.length === 0) {
         container.style.display = "none";

         resetBulkInvoiceSelection();

         return;
      }

      // ======================================================
      // BUILD RESULTS
      // ======================================================

      const fragment = document.createDocumentFragment();

      for (let i = 0; i < orders.length; i++) {
         const order = orders[i];

         const row = document.createElement("tr");

         // --------------------------------------------------
         // CHECKBOX
         // --------------------------------------------------

         const selectCell = document.createElement("td");

         selectCell.className = "text-center";

         const checkbox = document.createElement("input");

         checkbox.type = "checkbox";

         checkbox.className = "bulk-invoice-order-checkbox";

         checkbox.dataset.index = String(i);

         checkbox.addEventListener("change", updateBulkInvoiceSelection);

         selectCell.appendChild(checkbox);

         // --------------------------------------------------
         // ORDER ID
         // --------------------------------------------------

         const orderIdCell = document.createElement("td");

         orderIdCell.textContent = order.orderId || "";

         // --------------------------------------------------
         // DATE
         // --------------------------------------------------

         const dateCell = document.createElement("td");

         dateCell.textContent = order.orderDate || "";

         // --------------------------------------------------
         // CUSTOMER
         // --------------------------------------------------

         const customerCell = document.createElement("td");

         customerCell.textContent = order.customerName || "";

         // --------------------------------------------------
         // MOBILE
         // --------------------------------------------------

         const mobileCell = document.createElement("td");

         mobileCell.textContent = order.mobile || "";

         // --------------------------------------------------
         // PAYMENT STATUS
         // --------------------------------------------------

         const paymentCell = document.createElement("td");

         const badge = document.createElement("span");

         const paymentStatus = String(order.paymentStatus || "");

         badge.textContent = paymentStatus || "-";

         if (paymentStatus.toLowerCase() === "paid") {
            badge.className = "badge bg-success";
         } else if (paymentStatus.toLowerCase() === "pending") {
            badge.className = "badge bg-danger";
         } else {
            badge.className = "badge bg-secondary";
         }

         paymentCell.appendChild(badge);

         // --------------------------------------------------
         // AMOUNT
         // --------------------------------------------------

         const amountCell = document.createElement("td");

         amountCell.className = "text-end fw-semibold";

         amountCell.textContent =
            "₹" + Number(order.grandTotal || 0).toFixed(2);

         // --------------------------------------------------
         // ADD CELLS
         // --------------------------------------------------

         row.appendChild(selectCell);

         row.appendChild(orderIdCell);

         row.appendChild(dateCell);

         row.appendChild(customerCell);

         row.appendChild(mobileCell);

         row.appendChild(paymentCell);

         row.appendChild(amountCell);

         fragment.appendChild(row);
      }

      body.appendChild(fragment);

      container.style.display = "";

      // ======================================================
      // SELECT ALL
      // ======================================================

      const selectAll = document.getElementById("bulkInvoiceSelectAll");

      if (selectAll) {
         selectAll.checked = false;

         selectAll.indeterminate = false;

         selectAll.onchange = toggleAllBulkInvoiceOrders;
      }

      resetBulkInvoiceSelection();
   }

   /**
    * ==========================================================
    * UPDATE SELECTED ORDERS
    * ==========================================================
    */

   function updateBulkInvoiceSelection() {
      const checkboxes = document.querySelectorAll(
         ".bulk-invoice-order-checkbox",
      );

      let selectedCount = 0;

      let selectedTotal = 0;

      for (let i = 0; i < checkboxes.length; i++) {
         const checkbox = checkboxes[i];

         if (checkbox.checked !== true) {
            continue;
         }

         const index = Number(checkbox.dataset.index);

         const order = bulkInvoiceSearchResults[index];

         if (!order) {
            continue;
         }

         selectedCount++;

         selectedTotal += Number(order.grandTotal || 0);
      }

      // ======================================================
      // UPDATE SUMMARY
      // ======================================================

      const countElement = document.getElementById("bulkInvoiceSelectedCount");

      const totalElement = document.getElementById("bulkInvoiceSelectedTotal");

      const generateButton = document.getElementById("bulkInvoiceGenerateBtn");

      if (countElement) {
         countElement.textContent = selectedCount;
      }

      if (totalElement) {
         totalElement.textContent = "₹" + selectedTotal.toFixed(2);
      }

      if (generateButton) {
         generateButton.disabled = selectedCount === 0;
      }

      // ======================================================
      // UPDATE SELECT ALL STATE
      // ======================================================

      const selectAll = document.getElementById("bulkInvoiceSelectAll");

      if (selectAll && checkboxes.length) {
         selectAll.checked = selectedCount === checkboxes.length;

         selectAll.indeterminate =
            selectedCount > 0 && selectedCount < checkboxes.length;
      }
   }

   /**
    * ==========================================================
    * SORT BULK INVOICE SEARCH RESULTS
    * ==========================================================
    */

   function sortBulkInvoiceResults() {
      const sortElement = document.getElementById("bulkInvoiceSort");

      if (!sortElement || !Array.isArray(bulkInvoiceSearchResults)) {
         return;
      }

      const sortType = sortElement.value;

      // Work on a copy first.
      const sortedOrders = bulkInvoiceSearchResults.slice();

      // ======================================================
      // DATE HELPER
      //
      // Backend returns dd/MM/yyyy
      // ======================================================

      function getDateValue(order) {
         const value = String(order.orderDate || "");

         const parts = value.split("/");

         if (parts.length !== 3) {
            return 0;
         }

         return new Date(
            Number(parts[2]),
            Number(parts[1]) - 1,
            Number(parts[0]),
         ).getTime();
      }

      // ======================================================
      // SORT
      // ======================================================

      sortedOrders.sort(function (a, b) {
         switch (sortType) {
            // ------------------------------------------
            // NEWEST FIRST
            // ------------------------------------------

            case "date-desc":
               return getDateValue(b) - getDateValue(a);

            // ------------------------------------------
            // OLDEST FIRST
            // ------------------------------------------

            case "date-asc":
               return getDateValue(a) - getDateValue(b);

            // ------------------------------------------
            // AMOUNT HIGH → LOW
            // ------------------------------------------

            case "amount-desc":
               return Number(b.grandTotal || 0) - Number(a.grandTotal || 0);

            // ------------------------------------------
            // AMOUNT LOW → HIGH
            // ------------------------------------------

            case "amount-asc":
               return Number(a.grandTotal || 0) - Number(b.grandTotal || 0);

            // ------------------------------------------
            // ORDER ID HIGH → LOW
            // ------------------------------------------

            case "order-desc":
               return String(b.orderId || "").localeCompare(
                  String(a.orderId || ""),
                  undefined,
                  {
                     numeric: true,
                  },
               );

            // ------------------------------------------
            // ORDER ID LOW → HIGH
            // ------------------------------------------

            case "order-asc":
               return String(a.orderId || "").localeCompare(
                  String(b.orderId || ""),
                  undefined,
                  {
                     numeric: true,
                  },
               );

            default:
               return 0;
         }
      });

      // ======================================================
      // SAVE NEW ORDER
      // ======================================================

      bulkInvoiceSearchResults = sortedOrders;

      // ======================================================
      // REDRAW TABLE
      // ======================================================

      renderBulkInvoiceResults(bulkInvoiceSearchResults);
   }

   /**
    * ==========================================================
    * GENERATE BULK INVOICE
    * STEP 1 - COLLECT AND VALIDATE SELECTED ORDERS
    * ==========================================================
    */
   function generateBulkInvoice() {
      // ------------------------------------------
      // Validate search results
      // ------------------------------------------

      if (
         !Array.isArray(bulkInvoiceSearchResults) ||
         bulkInvoiceSearchResults.length === 0
      ) {
         showBulkInvoiceMessage(
            "No orders are available for bulk invoice.",
            "warning",
         );

         return;
      }

      // ------------------------------------------
      // Find selected checkboxes
      // ------------------------------------------

      const checkedBoxes = document.querySelectorAll(
         ".bulk-invoice-order-checkbox:checked",
      );

      if (!checkedBoxes.length) {
         showBulkInvoiceMessage("Please select at least one order.", "warning");

         return;
      }

      // ------------------------------------------
      // Collect selected Order IDs
      // ------------------------------------------

      const selectedOrderIds = [];

      checkedBoxes.forEach(function (checkbox) {
         const index = Number(checkbox.dataset.index);

         const order = bulkInvoiceSearchResults[index];

         if (order && order.orderId) {
            selectedOrderIds.push(String(order.orderId).trim().toUpperCase());
         }
      });

      if (!selectedOrderIds.length) {
         showBulkInvoiceMessage(
            "Unable to identify the selected orders.",
            "danger",
         );

         return;
      }

      // ------------------------------------------
      // Match selected orders with loaded data
      // ------------------------------------------

      const selectedOrders = bulkInvoiceSearchResults.filter(function (order) {
         return selectedOrderIds.includes(String(order.orderId || ""));
      });

      if (!selectedOrders.length) {
         showBulkInvoiceMessage(
            "Selected order data could not be found.",
            "danger",
         );

         return;
      }

      // ------------------------------------------
      // Validate same mobile number
      // ------------------------------------------

      const firstMobile = String(selectedOrders[0].mobile || "").trim();

      const differentCustomer = selectedOrders.some(function (order) {
         return String(order.mobile || "").trim() !== firstMobile;
      });

      if (differentCustomer) {
         showBulkInvoiceMessage(
            "Bulk invoice can only be generated for orders belonging to the same mobile number.",
            "warning",
         );

         return;
      }

      // ------------------------------------------
      // Disable button while loading
      // ------------------------------------------

      const button = document.getElementById("bulkInvoiceGenerateBtn");

      if (button) {
         button.disabled = true;
         button.textContent = "⏳ Generating Bulk Invoice...";
      }

      // ------------------------------------------
      // Call NEW backend function
      // ------------------------------------------

      google.script.run

         .withSuccessHandler(function (response) {
            if (button) {
               button.disabled = false;

               button.textContent = "🧾 Generate Bulk Invoice";
            }

            if (!response || response.success !== true) {
               showBulkInvoiceMessage(
                  response && response.message
                     ? response.message
                     : "Unable to generate bulk invoice.",
                  "danger",
               );

               return;
            }

            console.log("Bulk Invoice Data:", response);

            showBulkInvoiceMessage(
               response.orderCount +
                  " orders loaded successfully for bulk invoice.",
               "success",
            );
         })

         .withFailureHandler(function (error) {
            if (button) {
               button.disabled = false;

               button.textContent = "🧾 Generate Bulk Invoice";
            }

            showBulkInvoiceMessage(
               error && error.message ? error.message : String(error),
               "danger",
            );
         })

         .getBulkInvoiceData(selectedOrderIds);
   }
















// Global variable to hold searched bulk orders
let currentBulkOrders = [];
let selectedBulkData = null;

/**
 * 1. Search Bulk Invoice Orders
 */
function searchBulkInvoiceOrders() {
  const fromDate = document.getElementById("bulkInvoiceFromDate").value;
  const toDate = document.getElementById("bulkInvoiceToDate").value;
  const mobile = document.getElementById("bulkInvoiceMobile").value;
  const orderId = document.getElementById("bulkInvoiceOrderId").value;
  const paymentStatus = document.getElementById("bulkInvoicePaymentStatus").value;

  const filters = {
    fromDate: fromDate,
    toDate: toDate,
    mobile: mobile,
    orderId: orderId,
    paymentStatus: paymentStatus
  };

  const searchBtn = document.getElementById("bulkInvoiceSearchBtn");
  searchBtn.disabled = true;
  searchBtn.innerHTML = "⏳ Searching...";

  google.script.run
    .withSuccessHandler(function(response) {
      searchBtn.disabled = false;
      searchBtn.innerHTML = "🔍 Search Orders";

      const msgDiv = document.getElementById("bulkInvoiceMessage");
      const resultsContainer = document.getElementById("bulkInvoiceResultsContainer");

      if (!response.success) {
        msgDiv.className = "alert alert-danger mt-3";
        msgDiv.innerText = response.message;
        msgDiv.style.display = "block";
        resultsContainer.style.display = "none";
        return;
      }

      msgDiv.style.display = "none";
      currentBulkOrders = response.orders || [];
      document.getElementById("bulkInvoiceOrderCount").innerText = response.count;

      if (currentBulkOrders.length === 0) {
        msgDiv.className = "alert alert-warning mt-3";
        msgDiv.innerText = "No orders found matching the criteria.";
        msgDiv.style.display = "block";
        resultsContainer.style.display = "none";
        return;
      }

      resultsContainer.style.display = "block";
      renderBulkInvoiceResults(currentBulkOrders);
    })
    .withFailureHandler(function(err) {
      searchBtn.disabled = false;
      searchBtn.innerHTML = "🔍 Search Orders";
      alert("Error searching orders: " + err.message);
    })
    .searchBulkInvoiceOrdersFromWeb(filters);
}

/**
 * 2. Render Results Table
 */
function renderBulkInvoiceResults(orders) {
  const tbody = document.getElementById("bulkInvoiceResultsBody");
  tbody.innerHTML = "";

  orders.forEach(function(order) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="text-center">
        <input type="checkbox" class="bulk-order-checkbox" value="${order.orderId}" data-amount="${order.grandTotal}" onchange="updateBulkInvoiceSelectionSummary()" />
      </td>
      <td><strong>${order.orderId}</strong></td>
      <td>${order.orderDate}</td>
      <td>${order.customerName}</td>
      <td>${order.mobile}</td>
      <td>
        <span class="badge ${order.paymentStatus.toLowerCase() === 'paid' ? 'bg-success' : 'bg-danger'}">
          ${order.paymentStatus}
        </span>
      </td>
      <td class="text-end">₹${order.grandTotal.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });

  // Select all handler
  const selectAll = document.getElementById("bulkInvoiceSelectAll");
  selectAll.checked = false;
  selectAll.onclick = function() {
    const checkboxes = document.querySelectorAll(".bulk-order-checkbox");
    checkboxes.forEach(cb => cb.checked = selectAll.checked);
    updateBulkInvoiceSelectionSummary();
  };

  updateBulkInvoiceSelectionSummary();
}

/**
 * 3. Update Selection Count & Total
 */
function updateBulkInvoiceSelectionSummary() {
  const checkboxes = document.querySelectorAll(".bulk-order-checkbox:checked");
  let selectedCount = checkboxes.length;
  let selectedTotal = 0;

  checkboxes.forEach(cb => {
    selectedTotal += parseFloat(cb.getAttribute("data-amount")) || 0;
  });

  document.getElementById("bulkInvoiceSelectedCount").innerText = selectedCount;
  document.getElementById("bulkInvoiceSelectedTotal").innerText = "₹" + selectedTotal.toFixed(2);

  const generateBtn = document.getElementById("bulkInvoiceGenerateBtn");
  generateBtn.disabled = selectedCount === 0;
}

/**
 * 4. Generate Bulk Invoice Preview & PDF
 */
function generateBulkInvoice() {
  const checkboxes = document.querySelectorAll(".bulk-order-checkbox:checked");
  const selectedOrderIds = Array.from(checkboxes).map(cb => cb.value);

  if (selectedOrderIds.length === 0) {
    alert("Please select at least one order.");
    return;
  }

  const generateBtn = document.getElementById("bulkInvoiceGenerateBtn");
  generateBtn.disabled = true;
  generateBtn.innerText = "⌛ Generating Bulk Invoice...";

  google.script.run
    .withSuccessHandler(function(response) {
      generateBtn.disabled = false;
      generateBtn.innerText = "🧾 Generate Bulk Invoice";

      if (!response.success) {
        alert("Failed to generate bulk invoice: " + response.message);
        return;
      }

      selectedBulkData = response;
      showBulkInvoicePreview(response);
    })
    .withFailureHandler(function(err) {
      generateBtn.disabled = false;
      generateBtn.innerText = "🧾 Generate Bulk Invoice";
      alert("Error: " + err.message);
    })
    .generateBulkInvoicePdf(selectedOrderIds);
}

/**
 * 5. Show Preview in Right Panel
 */
function showBulkInvoicePreview(bulkResponse) {
  const previewContainer = document.getElementById("bulkInvoicePreviewContainer");
  previewContainer.style.display = "block";

  const totals = bulkResponse.totals;
  const cardBody = previewContainer.querySelector(".card-body");

  cardBody.innerHTML = `
    <div class="alert alert-success d-flex justify-content-between align-items-center mb-3">
      <div>
        <strong>✅ Bulk Invoice Ready!</strong>
        <br><small>Mobile: ${bulkResponse.customerMobile} | Total Orders: ${document.querySelectorAll('.bulk-order-checkbox:checked').length}</small>
      </div>
      <span class="fs-4 fw-bold text-success">₹${totals.grandTotal.toFixed(2)}</span>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <div class="p-2 border rounded bg-light">
          <small class="text-muted">Paid Amount</small>
          <div class="fw-bold text-success">₹${totals.paidAmount.toFixed(2)}</div>
        </div>
      </div>
      <div class="col-6">
        <div class="p-2 border rounded bg-light">
          <small class="text-muted">Pending Amount</small>
          <div class="fw-bold text-danger">₹${totals.pendingAmount.toFixed(2)}</div>
        </div>
      </div>
    </div>

    <div class="d-grid gap-2 d-md-flex justify-content-center">
      <button class="btn btn-danger" onclick="downloadBulkPdf()">📄 Download Bulk PDF</button>
      <button class="btn btn-success" onclick="shareBulkWhatsApp()">📲 Share via WhatsApp</button>
    </div>
  `;

  previewContainer.scrollIntoView({ behavior: 'smooth' });
}

/**
 * 6. Download Bulk PDF File
 */
function downloadBulkPdf() {
  if (!selectedBulkData || !selectedBulkData.base64Data) return;

  const link = document.createElement("a");
  link.href = "data:application/pdf;base64," + selectedBulkData.base64Data;
  link.download = selectedBulkData.blobName;
  link.click();
}

/**
 * 7. Share Statement via WhatsApp
 */
function shareBulkWhatsApp() {
  if (!selectedBulkData) return;

  const mobile = selectedBulkData.customerMobile;
  const totals = selectedBulkData.totals;

  let message = `*Smoky Swaad - Consolidated Statement*\n\n`;
  message += `Grand Total: ₹${totals.grandTotal.toFixed(2)}\n`;
  message += `Paid: ₹${totals.paidAmount.toFixed(2)}\n`;
  if (totals.pendingAmount > 0) {
    message += `*Pending Due: ₹${totals.pendingAmount.toFixed(2)}*\n`;
  }
  message += `\nThank you for ordering with Smoky Swaad! ❤️`;

  const url = `https://wa.me/91${mobile}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}

/**
 * 8. Clear Filters
 */
function clearBulkInvoiceSearch() {
  document.getElementById("bulkInvoiceFromDate").value = "";
  document.getElementById("bulkInvoiceToDate").value = "";
  document.getElementById("bulkInvoiceMobile").value = "";
  document.getElementById("bulkInvoiceOrderId").value = "";
  document.getElementById("bulkInvoicePaymentStatus").value = "";
  document.getElementById("bulkInvoiceResultsContainer").style.display = "none";
  document.getElementById("bulkInvoiceMessage").style.display = "none";
  currentBulkOrders = [];
}

/**
 * 9. Close Preview
 */
function closeBulkInvoicePreview() {
  document.getElementById("bulkInvoicePreviewContainer").style.display = "none";
}



/**

 * PIN AUTHENTICATION SYSTEM
 * ==========================================
 */
function unlockSystem() {
  const pinInput = document.getElementById("app-pin-input").value;
  const lockScreen = document.getElementById("pin-lock-screen");
  const errorMsg = document.getElementById("pin-error-msg");
  
  // Set your secure PINs here
  const adminPin = "9999"; 
  const cashierPin = "1234";

  if (pinInput === adminPin) {
    
    // Unlock everything for Admin
    lockScreen.style.display = "none";
    errorMsg.style.visibility = "hidden";
    
  } else if (pinInput === cashierPin) {
    
    // Unlock for Cashier
    lockScreen.style.display = "none";
    errorMsg.style.visibility = "hidden";
    
    // TODO: Hide sensitive sidebar tabs here
    // Example: document.getElementById("menu-expenses").style.display = "none";
    
  } else {
    
    // Failed attempt
    errorMsg.style.visibility = "visible";
    document.getElementById("app-pin-input").value = "";
    
  }
}

// Allow pressing 'Enter' on the keyboard to unlock instantly
document.addEventListener("DOMContentLoaded", function() {
  const pinField = document.getElementById("app-pin-input");
  if(pinField) {
    pinField.addEventListener("keypress", function(e) {
      if (e.key === "Enter") unlockSystem();
    });
  }
});
