function getToday() {

    const today = new Date();

    const year = today.getFullYear();

    const month = String(today.getMonth() + 1).padStart(2, "0");

    const day = String(today.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;

}

  function searchCustomer() {

   const mobileBox = document.getElementById("mobile");

   if (!mobileBox) {
      console.error("Mobile textbox not found.");
      return;
   }

   const mobile = mobileBox.value.trim();

   if (mobile.length !== 10) {
      return;
   }

   // Search customer in local cache
   const customer = customerCache.find(c => c.mobile === mobile);

   if (customer) {
      fillCustomerForm(customer);
   } else {
      fillCustomerForm(null);
   }

}

/**
 * ==========================================
 * Debounced Menu Search
 * ==========================================
 */
function debounceMenuSearch() {

   clearTimeout(menuSearchTimer);

   menuSearchTimer = setTimeout(function () {
      searchMenuItems();
   }, 120);

}




/**
 * ==========================================
 * Menu Search - Optimized Local Search
 * ==========================================
 */
function searchMenuItems() {

   const searchBox = document.getElementById("menuSearch");
   const suggestionBox = document.getElementById("menuSuggestions");

   if (!searchBox || !suggestionBox) {
      return;
   }

   const keyword = searchBox.value
      .trim()
      .toLowerCase();

   if (keyword.length < 2) {

      suggestionBox.innerHTML = "";
      suggestionBox.style.display = "none";

      return;
   }

   const results = [];

   // Search locally and stop after 8 matches
   for (let i = 0; i < menuCache.length; i++) {

      const item = menuCache[i];

      if (!item) {
         continue;
      }

      // Use precomputed searchName when available.
      // Fallback protects against old/unprepared cache objects.
      const searchName =
         item.searchName ||
         String(item.itemName || "").trim().toLowerCase();

      if (searchName.includes(keyword)) {

         results.push(item);

         // Stop scanning immediately
         if (results.length >= 8) {
            break;
         }

      }

   }

   showMenuSuggestions(results);

}

function showMenuSuggestions(items) {

        list.innerHTML = `
            <div class="list-group-item text-muted">

    let html = "";

    items.forEach(function(item){

                    <span>${item.itemName}</span>

                    <strong>₹${item.price}</strong>

                </div>

            </button>
        `;

    });

    // Single DOM update
    list.innerHTML = html;

}

   /**
    * Add Item To Cart
    */
   function addToCart(itemId) {
      // Find selected item from cache
      const selectedItem = menuCache.find((item) => item.itemId === itemId);

      if (!selectedItem) {
         return;
      }

      // Check if already in cart
      const existingItem = cart.find((item) => item.itemId === itemId);

      if (existingItem) {
         existingItem.qty++;
         refreshCartCalculations();
      } else {
         cart.push({
            itemId: selectedItem.itemId,

            itemName: selectedItem.itemName,

            price: Number(selectedItem.price),

            cost: Number(selectedItem.cost),

            qty: 1,

            lineTotal: Number(selectedItem.price),

            profit: Number(selectedItem.price) - Number(selectedItem.cost),
         });
         refreshCartCalculations();
      }

      // Clear search
      document.getElementById("menuSearch").value = "";

      clearMenuSuggestions();

      renderCart();
   }



   /**
    * Render Shopping Cart
    */
   function renderCart() {
      const cartContainer = document.getElementById("cartItems");

      if (!cartContainer) return;

      if (cart.length === 0) {
         cartContainer.innerHTML = `
    <div class="text-center text-muted py-5">

        <i class="bi bi-cart-x fs-1"></i>

        <h6 class="mt-3">

            No items added

        </h6>

        <small>

            Search menu items to begin

        </small>

    </div>
`;

         updateDiscountState();

         calculateTotals();

         return;
      }

      let html = "";

      cart.forEach((item, index) => {
         const lineTotal = item.lineTotal;

         html += `

        <div class="card shadow-sm mb-3 border-0">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <h6 class="mb-0 fw-bold">
                        ${item.itemName}
                    </h6>

                    <span class="badge bg-success fs-6">
                        ₹${lineTotal}
                    </span>

                </div>

                <hr>

                <div class="row align-items-center">

                    <div class="col-6">

                        <small class="text-muted">
                            Unit Price
                        </small>

                        <div class="fw-semibold">
                            ₹${item.price}
                        </div>

                    </div>

                    <div class="col-6 text-end">

                        <small class="text-muted">
                            Quantity
                        </small>

                        <div class="btn-group mt-1">

                            <button
                                class="btn btn-outline-secondary btn-sm"
                                onclick="decreaseQty(${index})">

                                −

                            </button>

                            <button
                                class="btn btn-light btn-sm"
                                disabled>

                                ${item.qty}

                            </button>

                            <button
                                class="btn btn-outline-primary btn-sm"
                                onclick="increaseQty(${index})">

                                +

                            </button>

                        </div>

                    </div>

                </div>

                <div class="text-end mt-3">

                    <button
                        class="btn btn-outline-danger btn-sm"
                        onclick="removeItem(${index})">

                        🗑 Remove

                    </button>

                </div>

            </div>

        </div>

        `;
      });

      cartContainer.innerHTML = html;

      updateDiscountState();

      calculateTotals();
   }

   /**
    * Increase Quantity
    */
   function increaseQty(index) {
      cart[index].qty++;

      refreshCartCalculations();

      renderCart();
   }

   /**
    * Decrease Quantity
    */
   function decreaseQty(index) {
      if (!cart[index]) return;
      cart[index].qty--;

      if (cart[index].qty <= 0) {
         cart.splice(index, 1);
      } else {
         refreshCartCalculations();
      }

      renderCart();
   }

   /**
    * Remove Item From Cart
    */
   function removeItem(index) {
      if (index < 0 || index >= cart.length) return;
      cart.splice(index, 1);

      refreshCartCalculations();

      renderCart();
   }











/**
 * ==========================================
 * Calculate Order Totals
 * ==========================================
 */
function calculateTotals() {

    // ------------------------------------------
    // Menu Subtotal
    // ------------------------------------------

    const subTotal = cart.reduce(function(total, item) {

        const price = Number(item.price) || 0;
        const qty = Number(item.qty) || 0;

        return total + (price * qty);

    }, 0);


    // ------------------------------------------
    // Custom Add-on Total
    // ------------------------------------------

    const addonTotal = getCustomAddonTotal();


    // ------------------------------------------
    // Discount
    // ------------------------------------------

    const discountBox =
        document.getElementById("discount");

    let discount = discountBox
        ? parseFloat(discountBox.value)
        : 0;


    if (!Number.isFinite(discount) || discount < 0) {

        discount = 0;

    }


    /*
     * Maximum discount is limited to:
     *
     * Menu Subtotal + Add-on Total
     *
     * Delivery charge is intentionally excluded
     * from the discountable amount.
     */

    const discountableAmount =
        subTotal + addonTotal;


    if (discount > discountableAmount) {

        discount = discountableAmount;

        if (discountBox) {

            discountBox.value =
                discount.toFixed(2);

        }

    }


    // ------------------------------------------
    // Safe Delivery Charge
    // ------------------------------------------

    const safeDeliveryCharge =
        Number.isFinite(Number(deliveryCharge))
            ? Number(deliveryCharge)
            : 0;


    // ------------------------------------------
    // Grand Total
    // ------------------------------------------

    const grandTotal =
        subTotal
        + addonTotal
        - discount
        + safeDeliveryCharge;


    // ------------------------------------------
    // UI Elements
    // ------------------------------------------

    const subTotalEl =
        document.getElementById("subTotal");

    const addonTotalEl =
        document.getElementById("addonTotalDisplay");

    const deliveryEl =
        document.getElementById("deliveryCharge");

    const grandEl =
        document.getElementById("grandTotal");


    // ------------------------------------------
    // Update UI
    // ------------------------------------------

    if (subTotalEl) {

        subTotalEl.innerText =
            "₹" + subTotal.toFixed(2);

    }


    if (addonTotalEl) {

        addonTotalEl.textContent =
            "₹" + addonTotal.toFixed(2);

    }


    if (deliveryEl) {

        deliveryEl.innerText =
            "₹" + safeDeliveryCharge.toFixed(2);

    }


    if (grandEl) {

        grandEl.innerText =
            "₹" + grandTotal.toFixed(2);

    }

}










   /**
 * ==========================================
 * Collect Complete Order Data
 * ==========================================
 */
function collectOrderData() {

    const getValue = function(id) {

        const element =
            document.getElementById(id);

        if (!element) {

            return "";

        }

        return element.value;

    };


    // ------------------------------------------
    // Customer
    // ------------------------------------------

    const customer = {

        customerName:
            getValue("customerName").trim(),

        mobile:
            getValue("mobile").trim(),

        deliveryArea:
            getValue("deliveryArea"),

        houseAddress:
            getValue("houseAddress").trim(),

        deliverySlot:
            getValue("deliverySlot")

    };


    // ------------------------------------------
    // Order
    // ------------------------------------------

    const order = {

        orderType:
            getValue("orderType"),

        specialInstructions:
            getValue("specialInstructions").trim()

    };


    // ------------------------------------------
    // Payment
    // ------------------------------------------

    const payment = {

        paymentMode:
            getValue("paymentMode"),

        paymentStatus:
            getValue("paymentStatus") || "Pending"

    };


    // ------------------------------------------
    // Menu Subtotal
    // ------------------------------------------

    const subTotal = cart.reduce(
        function(sum, item) {

            const price =
                Number(item.price) || 0;

            const qty =
                Number(item.qty) || 0;

            return sum + (price * qty);

        },
        0
    );


    // ------------------------------------------
    // Add-on Total
    // ------------------------------------------

    const addonTotal =
        getCustomAddonTotal();


    // ------------------------------------------
    // Discount
    // ------------------------------------------

    let discount =
        parseFloat(getValue("discount"));


    if (
        !Number.isFinite(discount) ||
        discount < 0
    ) {

        discount = 0;

    }


    const discountableAmount =
        subTotal + addonTotal;


    if (discount > discountableAmount) {

        discount =
            discountableAmount;

    }


    // ------------------------------------------
    // Delivery Charge
    // ------------------------------------------

    const safeDeliveryCharge =
        Number.isFinite(Number(deliveryCharge))
            ? Number(deliveryCharge)
            : 0;


    // ------------------------------------------
    // Grand Total
    // ------------------------------------------

    const grandTotal =
        subTotal
        + addonTotal
        - discount
        + safeDeliveryCharge;


    // ------------------------------------------
    // Totals
    // ------------------------------------------

    const totals = {

        subTotal: subTotal,

        addonTotal: addonTotal,

        discount: discount,

        deliveryCharge:
            safeDeliveryCharge,

        grandTotal:
            grandTotal

    };


    // ------------------------------------------
    // Meta
    // ------------------------------------------

    const meta = {

        orderDate:
            getValue("orderDate"),

        source: "WEB"

    };


    // ------------------------------------------
    // Final Payload
    // ------------------------------------------

    return {

        customer: customer,

        order: order,

        payment: payment,

        totals: totals,

        cart: cart.map(function(item) {

            return { ...item };

        }),

        customAddons:
            customAddons.map(function(addon) {

                return {

                    name:
                        String(addon.name || "").trim(),

                    price:
                        Number(addon.price) || 0

                };

            }),

        meta: meta

    };

}









   /**
    * Enable / Disable Discount Field
    */
   function updateDiscountState() {
      const area = document.getElementById("deliveryArea");
      const discountInput = document.getElementById("discount");

      if (!discountInput) return;

      if (cart.length === 0) {
         deliveryCharge = 0;

         if (area) {
            area.value = "";
         }

         discountInput.value = 0;
         discountInput.disabled = true;
      } else {
         discountInput.disabled = false;
      }
   }

   /**
    * Populate POS Dropdowns
    */
   function populatePOSDropdowns() {

      if (appSettings.deliveryAreas) {
         fillSelect(
            "deliveryArea",
            appSettings.deliveryAreas.map((x) => x.area),
         );
      }

      if (appSettings.paymentModes) {
         fillSelect("paymentMode", appSettings.paymentModes);
      }

      if (appSettings.paymentStatus) {
         fillSelect("paymentStatus", appSettings.paymentStatus);
      }

      if (appSettings.orderTypes) {
         fillSelect("orderType", appSettings.orderTypes);
      }

      if (appSettings.deliverySlots) {
         fillSelect("deliverySlot", appSettings.deliverySlots);
      }
   }

   /**
    * Update Delivery Charge
    */
   function updateDeliveryCharge() {
      const area = document.getElementById("deliveryArea").value;

      if (!area) {
         deliveryCharge = 0;

         calculateTotals();

         return;
      }

      const found = appSettings.deliveryAreas.find((x) => x.area === area);

      deliveryCharge = found ? Number(found.charge) : 0;

      calculateTotals();
   }

   /**
    * Fill Select Box
    */
 function fillSelect(id, values) {

   const select = document.getElementById(id);

   if (!select) return;

   if (!Array.isArray(values)) {
      console.warn(id + " has no values.");
      return;
   }

   // Skip rebuilding if already populated
   if (select.options.length > 1) {
      return;
   }

   let html = "";

   if (id === "deliveryArea") {
      html += `<option value="" selected>Select Delivery Area</option>`;
   }

   values.forEach(function(value){

      html += `<option value="${value}">${value}</option>`;

   });

   select.innerHTML = html;

}

   /**
    * Add Quick Note
    */
   function addQuickNote(note) {
      const box = document.getElementById("specialInstructions");

      if (!box) return;

      const current = box.value.trim();

      if (current.includes(note)) {
         return;
      }

      if (current === "") {
         box.value = note;
      } else {
         box.value += ", " + note;
      }
   }

   /**
    * Load Quick Notes
    */
   function loadQuickNotes() {
      const container = document.getElementById("quickNotes");

      if (!container) return;

      let html = "";

      QUICK_NOTES.forEach((note) => {
         const buttonClass =
            note.includes("Call") || note.includes("Ring")
               ? "btn-outline-info"
               : "btn-outline-warning";

         html += `
            <button
                type="button"
                class="btn ${buttonClass} btn-sm m-1"
                onclick="addQuickNote('${note}')">

                ${note}

            </button>
        `;
      });

      container.innerHTML = html;
   }

   function clearSpecialInstructions() {
      document.getElementById("specialInstructions").value = "";
   }

   /**
    * Update Cart Calculations
    */
   function refreshCartCalculations() {
      cart.forEach((item) => {
         item.lineTotal = item.qty * item.price;

         item.profit = (item.price - item.cost) * item.qty;
      });
   }


  /**
 * ==========================================
 * Save Order
 * ==========================================
 */
function saveOrder() {

    // ------------------------------------------
    // Prevent Double Click / Duplicate Save
    // ------------------------------------------

    if (isSavingOrder) {
        return;
    }


    // ------------------------------------------
    // Collect Order Data
    // ------------------------------------------

    const orderData = collectOrderData();


    // ------------------------------------------
    // Lock Save
    // ------------------------------------------

    isSavingOrder = true;

    const saveButton =
        document.getElementById("btnSaveOrder");

    if (saveButton) {

        saveButton.disabled = true;

        saveButton.textContent = "Saving...";

    }


    // ------------------------------------------
    // Send Order To Server
    // ------------------------------------------

    google.script.run

        .withSuccessHandler(function(response) {

            // ----------------------------------
            // Unlock Save
            // ----------------------------------

            isSavingOrder = false;


            if (response && response.success) {

                // ----------------------------------
                // Clear POS Immediately
                // ----------------------------------

                clearPOSForm();


                // ----------------------------------
                // Restore Save Button
                // ----------------------------------

                if (saveButton) {

                    saveButton.disabled = false;

                    saveButton.textContent = "Save Order";

                }


                // ----------------------------------
                // Success Message
                // ----------------------------------

                alert(
                    "Order Saved Successfully\n\n" +
                    "Order ID : " +
                    response.orderId
                );

            } else {

                // ----------------------------------
                // Restore Save Button
                // ----------------------------------

                if (saveButton) {

                    saveButton.disabled = false;

                    saveButton.textContent = "Save Order";

                }


                // ----------------------------------
                // Server Validation / Save Error
                // ----------------------------------

                alert(
                    response && response.message
                        ? response.message
                        : "Unable to save order."
                );

            }

        })


        .withFailureHandler(function(error) {

            // ----------------------------------
            // Unlock Save
            // ----------------------------------

            isSavingOrder = false;


            // ----------------------------------
            // Restore Save Button
            // ----------------------------------

            if (saveButton) {

                saveButton.disabled = false;

                saveButton.textContent = "Save Order";

            }


            // ----------------------------------
            // Unexpected Server Error
            // ----------------------------------

            console.error(
                "Save Order Error:",
                error
            );


            alert(
                error && error.message
                    ? error.message
                    : "Unable to save order."
            );

        })


        .saveOrderFromWeb(orderData);

}

   /**

    * initializePurchase
    * ==========================================
    */
  function initializePurchase() {

    const purchaseDate = document.getElementById("purchaseDate");

    if (purchaseDate && !purchaseDate.value) {

        const today = new Date();

        const year = today.getFullYear();

        const month = String(today.getMonth() + 1).padStart(2, "0");

        const day = String(today.getDate()).padStart(2, "0");

        purchaseDate.value = `${year}-${month}-${day}`;

    }

    loadPurchaseSettings();

    registerPurchaseEvents();

    updatePurchaseSummary();

    google.script.run
        .withSuccessHandler(function (items) {

            purchaseItemsCache = items;

        })
        .getPurchaseItems();

}

   /**
    * ==========================================
    * registerPurchaseEvents
    * ==========================================
    */
   function registerPurchaseEvents() {
      [
         "purchaseDate",
         "itemSearch",
         "quantity",
         "unit",
         "paymentType",
         "amount",
         "supplier",

   /**
    * ==========================================
    * Show Purchase Suggestions
    * ==========================================
    */
function showPurchaseSuggestions(items) {

   const keyword = document.getElementById("itemSearch").value.trim();

   const suggestionBox = document.getElementById("itemSuggestions");

   if (!suggestionBox) return;

   // Build suggestions in memory
   let html = items.map(item => `
      <button
         type="button"
         class="list-group-item list-group-item-action"
         onclick="selectPurchaseItem('${item.itemName.replace(/'/g, "\\'")}')">

         ${item.itemName}

      </button>
   `).join("");

   // Check if exact item already exists (Case Insensitive)
   const exactMatch = items.some(item =>
      item.itemName.toLowerCase() === keyword.toLowerCase()
   );

   // Show Add New Item option
   if (keyword !== "" && !exactMatch) {

      html += `
         <button
            type="button"
            class="list-group-item list-group-item-action text-success fw-bold border-top"
            onclick="addNewPurchaseItem()">

            ➕ Add "${keyword}"

         </button>
      `;

   }

   // Single DOM update
   suggestionBox.innerHTML = html;

}

   /**
    * ==========================================
    * Add New Purchase Item
    * ==========================================
    */
function addNewPurchaseItem() {

    const itemName = document.getElementById("itemSearch").value.trim();

    if (!itemName) return;

    google.script.run

        .withSuccessHandler(function (response) {

            // If item already exists or newly created,
            // make sure it exists in local cache only once.
            const exists = purchaseItemsCache.some(item =>
                item.itemName.toLowerCase() === response.itemName.toLowerCase()
            );

            if (!exists) {

                purchaseItemsCache.push({

                    itemName: response.itemName,

                    searchName: response.itemName.toLowerCase()

                });

            }

            // Select the item
            document.getElementById("itemSearch").value = response.itemName;

            clearPurchaseSuggestions();

            selectPurchaseItem(response.itemName);

        })

        .withFailureHandler(function (error) {

            alert(error.message || error);

        })

        .addPurchaseItem(itemName);

}

                    console.error(
                        "Unable to save PDF to Drive:",
                        error
                    );

                }
            )

            .savePdf(
                fileName,
                base64Pdf
            );


    } catch (err) {


        console.error(
            "Invoice PDF Error:",
            err
        );


        alert(
            "Unable to generate PDF."
        );


    } finally {


        // ======================================
        // Remove Temporary DOM
        // ======================================

        if (
            wrapper &&
            wrapper.parentNode
        ) {

            wrapper.parentNode.removeChild(
                wrapper
            );

        }


        // ======================================
        // Restore Button
        // ======================================

        if (btn) {

            btn.disabled =
                false;

            btn.innerHTML =
                "📄 Download PDF";

        }

    }

}









   /**
    * ==========================================
    * Convert Blob to Base64
    * ==========================================
    */
   function blobToBase64(blob) {
      return new Promise(function (resolve, reject) {
         const reader = new FileReader();

         reader.onloadend = function () {
            resolve(reader.result);
         };

         reader.onerror = reject;

         reader.readAsDataURL(blob);
      });
   }

   /**
    * ==========================================
    * initializeReports
    * ==========================================
    */

   function initializeReports() {
      console.log("Reports Module Loaded");

      const today = getToday();

      const fromDate = document.getElementById("reportFromDate");

      const toDate = document.getElementById("reportToDate");

      // Set default values
      fromDate.value = today;

      toDate.value = today;

      // Restrict future dates
      fromDate.max = today;

      toDate.max = today;

      // Prevent To Date from being earlier than From Date
      toDate.min = fromDate.value;

      // From Date Change
      fromDate.addEventListener("change", function () {
         toDate.min = this.value;

         if (toDate.value < this.value) {
            toDate.value = this.value;
         }

      // Disable PDF until a new report is generated
         document.getElementById("btnDownloadPDF").disabled = true;
         
      });

      // To Date Change
      toDate.addEventListener("change", function () {
         fromDate.max = this.value > today ? today : this.value;

         if (fromDate.value > this.value) {
            fromDate.value = this.value;
         }

      // Disable PDF until a new report is generated
         document.getElementById("btnDownloadPDF").disabled = true;
  
      });

      google.script.run

         .withSuccessHandler(renderReportDashboard)

         .withFailureHandler(function (error) {
            console.error(error);
         })

         .getReportsData(today, today);
   }

/**
 * ==========================================
 * Delete Order
 * ==========================================
 */
function deleteOrder() {

    const orderIdBox =
        document.getElementById("deleteOrderId");

    const deleteButton =
        document.getElementById("btnDeleteOrder");


    // ------------------------------------------
    // Validate Order ID
    // ------------------------------------------

    if (!orderIdBox) {

        alert("Delete Order field not found.");

        return;

    }


    const orderId =
        String(orderIdBox.value || "")
            .trim()
            .toUpperCase();


    if (!orderId) {

        alert("Please enter an Order ID.");

        orderIdBox.focus();

        return;

    }


    // ------------------------------------------
    // Confirmation
    // ------------------------------------------

    const confirmed = confirm(

        "Delete Order " + orderId + "?\n\n" +

        "This will permanently delete the order and its " +
        "order items and recalculate the customer's order history."

    );


    if (!confirmed) {

        return;

    }


    // ------------------------------------------
    // Lock Delete Button
    // ------------------------------------------

    if (deleteButton) {

        deleteButton.disabled = true;

        deleteButton.textContent = "Deleting...";

    }


    // ------------------------------------------
    // Server Request
    // ------------------------------------------

    google.script.run

        .withSuccessHandler(function(response) {

            if (deleteButton) {

                deleteButton.disabled = false;

                deleteButton.textContent = "Delete Order";

            }


            if (response && response.success) {

                orderIdBox.value = "";

                alert(
                    "Order Deleted Successfully\n\n" +
                    "Order ID : " + orderId
                );

            } else {

                alert(
                    response && response.message
                        ? response.message
                        : "Unable to delete order."
                );

            }

        })


        .withFailureHandler(function(error) {

            if (deleteButton) {

                deleteButton.disabled = false;

                deleteButton.textContent = "Delete Order";

            }


            console.error(
                "Delete Order Error:",
                error
            );


            alert(
                error && error.message
                    ? error.message
                    : "Unable to delete order."
            );

        })


        .deleteOrderFromWeb(orderId);

}







/**
 * ==========================================================
 * ADD CUSTOM ADD-ON
 * ==========================================================
 */
function addCustomAddon() {

    const nameInput =
        document.getElementById("addonName");

    const priceInput =
        document.getElementById("addonPrice");


    if (!nameInput || !priceInput) {

        console.error(
            "Add-on input fields not found."
        );

        return;

    }


    const addonName =
        String(nameInput.value || "")
            .trim();


    const addonPrice =
        Number(priceInput.value || 0);


    // ------------------------------------------
    // Validation
    // ------------------------------------------

    if (!addonName) {

        alert("Please enter Add-on Name.");

        nameInput.focus();

        return;

    }


    if (
        !Number.isFinite(addonPrice) ||
        addonPrice <= 0
    ) {

        alert(
            "Please enter a valid Add-on Price."
        );

        priceInput.focus();

        return;

    }


    // ------------------------------------------
    // Add to separate Add-on array
    // ------------------------------------------

    customAddons.push({

        name: addonName,

        price: addonPrice

    });


    // ------------------------------------------
    // Clear fields
    // ------------------------------------------

    nameInput.value = "";

    priceInput.value = "";


    // ------------------------------------------
    // Refresh Add-on display
    // ------------------------------------------

    renderCustomAddons();


    // Keep cursor ready for next Add-on
    nameInput.focus();

}



/**
 * ==========================================================
 * REMOVE CUSTOM ADD-ON
 * ==========================================================
 */
function removeCustomAddon(index) {

    if (
        index < 0 ||
        index >= customAddons.length
    ) {

        return;

    }


    customAddons.splice(
        index,
        1
    );


    renderCustomAddons();

}



/**
 * ==========================================================
 * RENDER CUSTOM ADD-ONS
 * ==========================================================
 */
function renderCustomAddons() {

    const list =
        document.getElementById("addonList");

    const totalDisplay =
        document.getElementById(
            "addonTotalDisplay"
        );


    // ------------------------------------------
    // Calculate Add-on Total
    // ------------------------------------------

    const addonTotal =
        getCustomAddonTotal();


    // ------------------------------------------
    // Update Add-on Total Display
    // ------------------------------------------

    if (totalDisplay) {

        totalDisplay.textContent =
            "₹" + addonTotal.toFixed(2);

    }


    // ------------------------------------------
    // Render Add-on List
    // ------------------------------------------

    if (list) {

        if (customAddons.length === 0) {

            list.innerHTML = "";

        } else {

            let html = "";


            customAddons.forEach(
                function(addon, index) {

                    html += `

                        <div
                            class="d-flex justify-content-between align-items-center py-2 border-bottom">

                            <div class="me-2">

                                <span>
                                    ${escapeAddonHtml(addon.name)}
                                </span>

                            </div>


                            <div
                                class="d-flex align-items-center gap-2">

                                <strong>
                                    ₹${Number(addon.price || 0).toFixed(2)}
                                </strong>

                                <button
                                    type="button"
                                    class="btn btn-outline-danger btn-sm"
                                    onclick="removeCustomAddon(${index})"
                                    title="Remove Add-on">

                                    ×

                                </button>

                            </div>

                        </div>

                    `;

                }
            );


            list.innerHTML = html;

        }

    }


    // ------------------------------------------
    // IMPORTANT
    // Recalculate complete order total
    // ------------------------------------------

    calculateTotals();

}




/**
 * ==========================================================
 * GET CUSTOM ADD-ON TOTAL
 * ==========================================================
 */
function getCustomAddonTotal() {

    let total = 0;


    customAddons.forEach(function(addon) {

        total +=
            Number(addon.price || 0);

    });


    return total;

}



/**
 * ==========================================================
 * ESCAPE ADD-ON HTML
 * ==========================================================
 *
 * Prevents user-entered Add-on names from being interpreted
 * as HTML when displayed.
 * ==========================================================
 */
function escapeAddonHtml(value) {

    return String(value || "")

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}
